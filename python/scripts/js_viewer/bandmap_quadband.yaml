# bandmap_quadband.yaml
#
# How livebeam_server.py (--band-map) reassembles cloyd's quad-band capture
# (aro_record_quadband_viewer.yaml) into an ordinary ascending dual-pol spectrum.
#
# The kotekan config captures 8 consecutive iceboard elements (num_elements: 8,
# dpdk offset: 0 -> elements 0..7), and computeDualpolPower emits one autopower
# PER element, so the wire carries npol*len(subbands) element-spectra in CAPTURED
# order. Each consecutive group of `npol` elements is the polarizations of one
# sub-band, listed below in that captured order (elements 0&1, 2&3, 4&5, 6&7).
#
# EDIT THIS to match the real element->RF wiring, then restart just the cloyd
# viewer instance on the receiver (`sudo systemctl restart aro-viewer-hub`) --
# no kotekan restart needed:
#   - reorder / relabel `subbands` if the captured element order differs,
#   - fix f_lo_mhz / f_hi_mhz for each sub-band's true RF range,
#   - flip `invert` if a sub-band comes out mirrored (channel 0 = high edge).
#     Even Nyquist zones (400-800, 1200-1600) are typically inverted.

npol: 2                      # elements (polarizations) per sub-band
pol_labels: [X, Y]

# In CAPTURED element order (dpdk offset: 0, num_elements: 8 -> elements 0..7).
# Wiring per squirrel aro_monitor.yaml's authoritative map (offset 0/2/4/6):
subbands:
  - {name: "0-400",     f_lo_mhz: 0,    f_hi_mhz: 400,  invert: false}   # elems 0,1
  - {name: "400-800",   f_lo_mhz: 400,  f_hi_mhz: 800,  invert: true}    # elems 2,3
  - {name: "800-1200",  f_lo_mhz: 800,  f_hi_mhz: 1200, invert: false}   # elems 4,5
  - {name: "1200-1600", f_lo_mhz: 1200, f_hi_mhz: 1600, invert: true}    # elems 6,7
