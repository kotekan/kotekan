<!DOCTYPE html>
<html>
<title>Data from Kotekan</title>
<head>
	<link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
	<style>
		.axis path,
		.axis line {
		    fill: none;
		    stroke: black;
		    shape-rendering: crispEdges;
		}
		.axis text {
		    font-family: sans-serif;
		}

		/* GridStack docked-card styling. Each card has a title bar (the
		   drag handle) and a body that hosts the panel content via a
		   stable id. */
		*, *::before, *::after { box-sizing: border-box; }
		body { margin: 0; background: #fafafa; }
		#layout-root { min-height: 100vh; }
		/* GridStack's own wrapper for each widget; Firefox otherwise
		   shows a phantom scrollbar even when the inner panel-body has
		   ``overflow: hidden``. */
		.grid-stack-item-content { overflow: hidden; }
		.panel-card {
			width: 100%; height: 100%;
			display: flex; flex-direction: column;
			background: white;
			border: 1px solid #ccc;
			border-radius: 4px;
			box-shadow: 0 1px 2px rgba(0,0,0,0.05);
			overflow: hidden;
		}
		.panel-header {
			padding: 4px 10px;
			background: #eef2f6;
			border-bottom: 1px solid #d0d7de;
			font-family: sans-serif;
			font-size: 13px;
			font-weight: 600;
			cursor: move;
			user-select: none;
		}
		.panel-body {
			flex: 1;
			/* Responsive cards (waterfall, spectrum) don't need scrolling.
			   The controls card still has fixed-pixel widgets that may
			   clip when the card is small -- enlarge that card if needed
			   until W-5 makes its contents reflow. */
			overflow: hidden;
			padding: 6px;
		}
		.toolbar {
			padding: 6px 10px;
			background: #f5f5f5;
			border-bottom: 1px solid #d0d7de;
			font-family: sans-serif;
			font-size: 12px;
		}
		.toolbar button {
			margin-left: 8px;
			font-size: 12px;
		}
	</style>

	<script type="text/javascript">
	// Bootstrap stage 1: synchronously inject library script/css tags.
	//
	//   Default: load JS/CSS dependencies straight from public CDNs.
	//   ?offline=1: load them from ./extlibs/ (pre-fetched by fetch_extfiles.sh).
	//
	// document.write at parse-time preserves load order without manual
	// onload chaining; everything is in place by the time DOMContentLoaded
	// fires.
	(function bootstrap_libs() {
		var offline = new URLSearchParams(location.search).has('offline');
		var libs = [
			{cdn: 'http://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js',
			 local: 'jquery.min.js'},
			{cdn: 'http://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/smoothness/jquery-ui.css',
			 local: 'jquery-ui.css', css: true},
			{cdn: 'http://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js',
			 local: 'jquery-ui.min.js'},
			{cdn: 'http://d3js.org/d3.v3.min.js', local: 'd3.v3.min.js'},
			{cdn: 'https://cdn.jsdelivr.net/npm/jquery-numeric@1.5.0/jquery.numeric.min.js',
			 local: 'jquery.numeric.min.js'},
			{cdn: 'https://cdn.jsdelivr.net/npm/tinycolor2@1.6.0/cjs/tinycolor.min.js',
			 local: 'tinycolor.min.js'},
			{cdn: 'https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.27.1/plotly-basic.min.js',
			 local: 'plotly-basic.min.js'},
			{cdn: 'https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.13.6/underscore-min.js',
			 local: 'underscore-min.js'},
			{cdn: 'https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css',
			 local: 'gridstack.min.css', css: true},
			{cdn: 'https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js',
			 local: 'gridstack-all.js'},
		];
		for (var i = 0; i < libs.length; i++) {
			var t = libs[i];
			var src = offline ? 'extlibs/' + t.local : t.cdn;
			if (t.css) {
				document.write('<link rel="stylesheet" href="' + src + '" />');
			} else {
				document.write('<script src="' + src + '"><\/script>');
			}
		}
		// In-tree viewer libs (always served by livebeam_server itself).
		document.write('<script src="lib/polyfit.js"><\/script>');
		document.write('<script src="lib/img_plotting.js"><\/script>');
	})();
	</script>

	<script type="text/javascript">
	// Bootstrap stage 2: load the ES6 viewer module. It is mode-aware --
	// the server's ``viewer_config`` message carries ``mode`` and the App
	// builds the autocorr or crosscorr UI from there. No per-mode script
	// selection needed at this layer any more.
	window.addEventListener('DOMContentLoaded', function () {
		var s = document.createElement('script');
		s.type = 'module';
		s.src = 'app/bootstrap.js';
		s.onerror = function () {
			console.error('Failed to load ' + s.src);
		};
		document.head.appendChild(s);
	});
	</script>
</head>

<body>
	<div class="toolbar">
		<span>Drag the title bar of any card to rearrange; drag the edges to resize. Layout is saved per-browser.</span>
		<button id="reset-layout">Reset layout</button>
		<!-- App fills + toggles this when the WebSocket drops or a protocol
		     mismatch is detected. -->
		<span id="ws-banner" style="display:none; margin-left:12px; padding:2px 8px;
			background:#fff3cd; color:#856404; border:1px solid #ffeeba;
			border-radius:3px; font-weight:600;"></span>
	</div>
	<div id="layout-root"></div>
	<script>
		document.addEventListener("DOMContentLoaded", function () {
			document.getElementById("reset-layout").addEventListener("click", function () {
				if (window.app && window.app.layout) window.app.layout.reset_layout();
				else { localStorage.removeItem("airspy_viewer_layout_v6"); location.reload(); }
			});
		});
	</script>
</body>

</html>
