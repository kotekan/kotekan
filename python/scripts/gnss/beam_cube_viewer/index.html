<!doctype html>
<meta charset="utf-8">
<title>CHORD GNSS beam cube</title>
<!--
  Beam-cube viewer: response vs (chain, subband, element, healpix), summed over any axis.

  DELIBERATELY A LOCAL PAGE, NOT A HOSTED ARTIFACT. It reads cube_<day>.bin straight off the
  NFS fixtures tree, which nothing outside this network can see, and the whole point is that
  the CUBE goes to the browser and the browser does the collapsing -- so there is nothing to
  host. Serve it and the cubes from one directory:

      cd /home/kvand/gnss/fixtures/beamcube/web
      ln -sf /home/kvand/gnss/kotekan/python/scripts/gnss/beam_cube_viewer/index.html .
      python3 -m http.server 877          # then open http://<host>:877/

  file:// will NOT work: fetching the .bin is a cross-origin read there and the browser
  blocks it. That failure looks exactly like a missing file, so it is called out here rather
  than left to be rediscovered.

  ⚠️ WHAT IS PLOTTED is probe-debiased |A_e|^2 -- received power per element, arbitrary zero,
  dB only meaningful WITHIN one chain. It is NOT C/N0 in any calibrated sense and it is NOT
  |u|/q (a ratio to the array mean, flat across the sky by construction). See
  docs/CHORD_BEAM_MAPS.md and the module docstring of gnss_beam_cube.py.
-->
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a; --panel: #1c1f26; --edge: #2b3039; --ink: #e6e9ef;
    --dim: #8b95a6; --accent: #4fd0c7; --warn: #f0a44a; --bad: #e8635a;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 var(--mono);
    display: grid; grid-template-columns: 310px 1fr; height: 100vh;
  }
  #side { background: var(--panel); border-right: 1px solid var(--edge);
          overflow-y: auto; padding: 14px 14px 40px; }
  #main { position: relative; display: flex; align-items: center;
          justify-content: center; overflow: hidden; }
  h1 { font-size: 13px; letter-spacing: .09em; text-transform: uppercase;
       color: var(--accent); margin: 0 0 2px; }
  .sub { color: var(--dim); font-size: 11px; margin-bottom: 16px; }
  fieldset { border: 1px solid var(--edge); border-radius: 5px;
             margin: 0 0 13px; padding: 9px 10px 11px; }
  legend { color: var(--dim); font-size: 10px; letter-spacing: .1em;
           text-transform: uppercase; padding: 0 5px; }
  label { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
  label:hover { color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  .row { display: flex; justify-content: space-between; align-items: baseline;
         gap: 8px; margin: 3px 0; }
  .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  .muted { color: var(--dim); font-size: 11px; }
  .note { border-left: 2px solid var(--warn); background: #2a2119;
          color: #f3cf9e; padding: 7px 9px; margin: 9px 0 0;
          font-size: 11px; line-height: 1.45; border-radius: 0 4px 4px 0; }
  .note.bad { border-left-color: var(--bad); background: #2b1a1a; color: #f0b3ae; }
  canvas { image-rendering: pixelated; }
  #hud { position: absolute; top: 14px; left: 18px; font-size: 11px;
         color: var(--dim); pointer-events: none; line-height: 1.7; }
  #hud b { color: var(--ink); font-weight: 600; }
  #readout { position: absolute; bottom: 14px; left: 18px; font-size: 11px;
             color: var(--accent); font-variant-numeric: tabular-nums; }
  #cbar { position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
          text-align: center; font-size: 10px; color: var(--dim); }
  #cbar canvas { display: block; border: 1px solid var(--edge); border-radius: 2px; }
  button { background: #262b34; color: var(--ink); border: 1px solid var(--edge);
           border-radius: 4px; padding: 4px 9px; font: inherit; font-size: 11px;
           cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.on { background: var(--accent); color: #10231f; border-color: var(--accent); }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  #boot { position: absolute; inset: 0; display: grid; place-items: center;
          color: var(--dim); font-size: 12px; text-align: center; padding: 30px; }
</style>

<div id="side">
  <h1>Beam cube</h1>
  <div class="sub">probe-debiased |A<sub>e</sub>|² &middot; dB, arbitrary zero</div>

  <fieldset>
    <legend>Days</legend>
    <div class="row"><span class="muted">from</span><span class="val" id="d0lab">—</span></div>
    <input type="range" id="d0" min="0" max="0" value="0">
    <div class="row"><span class="muted">to</span><span class="val" id="d1lab">—</span></div>
    <input type="range" id="d1" min="0" max="0" value="0">
    <div class="muted" id="dayinfo"></div>
  </fieldset>

  <fieldset>
    <legend>Chain</legend>
    <div id="chains"></div>
    <div id="bandwarn"></div>
  </fieldset>

  <fieldset>
    <legend>Subband</legend>
    <label><input type="checkbox" id="subsum" checked> sum over subbands</label>
    <div class="row"><span class="muted">index</span><span class="val" id="sublab">—</span></div>
    <input type="range" id="sub" min="0" max="0" value="0">
    <div class="muted" id="subinfo"></div>
  </fieldset>

  <fieldset>
    <legend>Element</legend>
    <label><input type="checkbox" id="elsum" checked> sum over elements</label>
    <div class="row"><span class="muted">antenna</span><span class="val" id="ellab">—</span></div>
    <input type="range" id="el" min="0" max="31" value="0">
    <div class="muted" id="elinfo"></div>
  </fieldset>

  <fieldset>
    <legend>Scale</legend>
    <div class="row"><span class="muted">dynamic range</span><span class="val" id="drlab">40 dB</span></div>
    <input type="range" id="dr" min="5" max="60" value="40">
    <label><input type="checkbox" id="peaknorm" checked> peak &rarr; 0 dB</label>
    <div class="row"><span class="muted">min samples/pixel</span><span class="val" id="mnlab">3</span></div>
    <input type="range" id="mn" min="1" max="50" value="3">
    <div class="btns">
      <button id="cmapbtn">colormap: turbo</button>
      <button id="gridbtn" class="on">grid</button>
    </div>
  </fieldset>

  <div id="status" class="muted"></div>
</div>

<div id="main">
  <canvas id="sky" width="720" height="720"></canvas>
  <div id="hud"></div>
  <div id="readout"></div>
  <div id="cbar"><span id="cbhi">—</span><canvas width="14" height="220"></canvas><span id="cblo">—</span></div>
  <div id="boot">loading index.json…</div>
</div>

<script src="beamcube.js"></script>
