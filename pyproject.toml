[project]
name = "kotekan-pyenv"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy>=7.1.1",
    "bitshuffle>=0.5.2",
    "breathe==4.35",
    "click==8.0.2",
    "cython>=3.1.6",
    "distro-info>=1.0",
    "flask>=2.2.5",
    "future>=1.0.0",
    "gmpy2>=2.2.1",
    "h5py>=3.15.1",
    "hdf5plugin>=6.0.0",
    "mpmath>=1.3.0",
    "msgpack>=1.1.2",
    "numpy>=2",
    "pip>=25.3",
    "pkgconfig>=1.5.5",
    "posix-ipc>=1.3.2",
    "requests>=2.32.5",
    "setuptools>=80.9.0",
    "tabulate>=0.9.0",
    "wheel>=0.45.1",
]

[dependency-groups]
dev = [
    "black==19.10b0",
    "cmake-format>=0.6.13",
    "pytest>=8.4.2",
    "pytest-cpp>=2.6.0",
    "pytest-localserver>=0.9.0.post0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "sphinx==6.2",
    "sphinx-rtd-theme==2.0",
    "sphinxcontrib-plantuml==0.25",
]

[tool.pytest.ini_options]
pythonpath = ["./python"]
