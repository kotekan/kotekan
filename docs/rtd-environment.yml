---
name: readthedocs

channels:
    - conda-forge
    - default

dependencies:
    - python=3.12
    - pip
    - cmake
    - doxygen
  # The versions of the Ubuntu 24.04 packages in the Docker image
    - sphinx=7.2.6
    - sphinx_rtd_theme=2.0.0
    - breathe=4.35.0
  # Feature libraries
    - pkg-config
    - gdal
    - hdf5
    - highfive
    - hdf5plugin
    - fftw
    - liblapacke
    - openblas
    - graphviz
    - julia
