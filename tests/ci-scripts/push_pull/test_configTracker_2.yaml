---
# configTracker test 2 (relay)
#
# Receives data from instance 1 on :11024 and forwards it to instance 3 on
# :11025. Acts as the middle node in the A -> B -> C chain so that
# instance 3 can exercise both steps of getUpstreamConfigs:
#   - step 1: fetches B's own local config via /config_tracker_local
#   - step 2: discovers and fetches A's config via B's
#             /config_tracker_upstream_hashes + /config_tracker_upstream_configs

# Participate in config tracking. The block must be a mapping; the older
# bare-bool `config_tracker: true` form is no longer accepted.
config_tracker:
    enabled: true

type: config
log_level: debug

cpu_affinity: [1, 2, 3, 4]

# Every kotekan mode instantiates the Telescope singleton, so even a test that
# only moves opaque frames needs a minimal one.
telescope:
    num_polarizations: 2
    num_dishes: 2

num_frame_samples: 2048
buffer_depth: 2

# Pool
main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 2 * buffer_depth

# Buffers
recv_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: num_frame_samples
    metadata_pool: main_pool

buffer_recv:
    log_level: debug
    recv:
        kotekan_stage: bufferRecv
        buf: recv_buffer
        listen_port: 11024
        cpu_affinity: [5, 6]
        num_threads: 2
        # A's REST server is on 12048 while this instance binds 12748, so the
        # default (this instance's own REST port) is not the right place to
        # fetch A's tracker state from.
        upstream_rest_port: 12048

# Forward received frames to instance 3
buffer_send:
    server_ip: 127.0.0.1
    reconnect_time: 1
    log_level: debug
    send:
        kotekan_stage: bufferSend
        buf: recv_buffer
        server_port: 11025
