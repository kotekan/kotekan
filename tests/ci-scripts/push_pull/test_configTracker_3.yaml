# configTracker test 3 (final receiver + writer)
#
# Receives data from instance 2 on :11025 and writes all tracked configs to
# disk. As the third hop in the A -> B -> C chain, it should accumulate three
# tracker entries:
#   - local: this node's own startup config
#   - upstream(127.0.0.1, 12748): B's local config (via step 1)
#   - upstream(127.0.0.1, 12048): A's config, discovered via B's upstream
#                                  hashes (via step 2)

# use the config tracker
config_tracker: true

type: config
log_level: debug

cpu_affinity: [1,2,3,4]

num_frame_samples: 2048
buffer_depth: 2

# Pool
main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 2 * buffer_depth

# Buffers
recv_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: num_frame_samples
    metadata_pool: main_pool

buffer_recv:
  log_level: debug
  recv:
    kotekan_stage: bufferRecv
    buf: recv_buffer
    listen_port: 11025
    cpu_affinity: [5, 6]
    num_threads: 2
    # B's REST server is on a non-default port; tell bufferRecv to dial
    # that port when fetching B's tracker state.
    upstream_rest_endpoints:
      - "127.0.0.1:12748"

# Consume frames so the receive buffer doesn't back up.
hex_dump:
    log_level: DEBUG
    kotekan_stage: hexDump
    in_buf: recv_buffer
    len: 64
    offset: 0

# Write tracked configs to disk when tracker hash changes
config_writer:
    log_level: DEBUG
    kotekan_stage: configTrackerWriter
    base_dir: config_writes
