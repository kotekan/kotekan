# Rotation for the GNSS stack's service logs on the gnss VM. The units write
# StandardOutput=append:, so the writers keep their descriptors open and copytruncate is the only
# safe rotation. Hourly cron, daily rotation or whenever a file passes 4 GB:
#   23 * * * *  /usr/sbin/logrotate -s /var/tmp/gnss-logs/.logrotate.state /home/kvand/gnss/kotekan/scripts/gnss/site/logrotate.conf
/var/tmp/gnss-logs/broker.log
/var/tmp/gnss-logs/aggregator.log
/var/tmp/gnss-logs/gather.log
/var/tmp/gnss-logs/viewer.log
/var/tmp/gnss-logs/rail.log
/var/tmp/gnss-logs/obs_*.log
/var/tmp/gnss-logs/*_cron.log {
    daily
    maxsize 4G
    rotate 10
    missingok
    notifempty
    compress
    copytruncate
    nocreate
}
