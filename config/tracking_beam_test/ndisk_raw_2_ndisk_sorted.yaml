raw_file_read:
  base_dir: /drives/scratch/B0329+54
  file_name: ""
  ndisk_wrote: true
  read0:
    kotekan_stage: rawFileRead
    file_ext: raw
    buf: merged_beam_buffer

merged_beam_split:
  kotekan_stage: splitMergedBeamBuffer
  in_buf: merged_beam_buffer
  out_buf: beam_recv_buffer
  has_metadata: False
  sub_frame_pre_frame: sub_frames_per_merged_frame
  sub_frame_metadata_size: freq_id_metadata_size
  sub_frame_data_size: samples_per_data_set * num_pol

sort_frame:
  kotekan_stage: BeamBufferSort
  has_freq_bin: true
  in_buf: beam_recv_buffer
  out_bufs:
    - sorted_buffer_0
    - sorted_buffer_1
      #  - sorted_buffer_2
      #  - sorted_buffer_3
      #  - sorted_buffer_4
      #  - sorted_buffer_5
      #  - sorted_buffer_6
      #- sorted_buffer_7
      # - sort_buffer_8
      # - sort_buffer_9

raw_file_write0:
  kotekan_stage: rawFileWrite
  in_buf: sorted_buffer_0
  base_dir: /drives/CHF/0/B0329+54_sorted4
  file_name: B0329+54_sorted4
  file_ext: raw
