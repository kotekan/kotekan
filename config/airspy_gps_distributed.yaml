---
##########################################
# airspy_gps_distributed.yaml
#
# Full distributed-band channelized GNSS pipeline (CHORD-mirroring), offline form:
#
#   rawFileRead -> fftwEngine(PFB) -> GnssSubbandSplit -> per subband:
#                                        { GnssChannelizedSearch (async) ,
#                                          GnssChannelizedTracker (lockstep) }
#                                     -> GnssCoherentCombiner -> rawFileWrite
#
# 200 kHz channelization (spectrum_length 50 @ 20 MSPS, ~CHORD 195 kHz). chordMetadata
# carries fpga_seq F-engine -> split -> searches/trackers, giving every (per-node)
# worker one absolute "sample 0" -- the multi-node reference the CHORD comb needs.
# Searches publish detections over REST; the broker
# (python/scripts/gps_distributed_broker.py) forms one consensus (cp,Doppler) per PRN
# and POSTs it to every tracker; the combiner recombines (sum G)/(sum E).
# Trackers are also CONFIG-seeded (PRN 10/23) so the graph runs without the broker.
# Feed: /tmp/gpsin_ref (20 MSPS L1 reference, (-1)^n flipped + 4-byte 0 header).
##########################################
type: config
log_level: info
instrument_name: airspy_gps

telescope: { name: ICETelescope, num_polarizations: 1, num_dishes: 1 }
rest_server: { cors_allow_origins: ["http://localhost:8080"] }

samples_per_data_set: 50000    # multiple of 2N=100 -> 500 hops/frame
bytes_per_sample: 2
buffer_depth: 16
sizeof_float: 4
cpu_affinity: [0, 1, 2, 3]

spectrum_length: 50            # 200 kHz channels @ 20 MSPS (~CHORD 195 kHz)
num_taps: 4
sample_rate: 20.0e6
f_offset: 5.0e6
n_prn: 2
record_floats: 11
hops_per_record: 200
doppler_margin_hz: 900000.0

gnss_pool:
    kotekan_metadata_pool: GnssChanMetadata
    num_metadata_objects: 8 * buffer_depth

input_buf: { kotekan_buffer: standard, metadata_pool: none,      num_frames: buffer_depth, frame_size: samples_per_data_set * bytes_per_sample }
chan_buf:  { kotekan_buffer: standard, metadata_pool: gnss_pool, num_frames: buffer_depth, frame_size: samples_per_data_set * sizeof_float }
subA_buf:  { kotekan_buffer: standard, metadata_pool: gnss_pool, num_frames: buffer_depth, frame_size: 100000 }
subB_buf:  { kotekan_buffer: standard, metadata_pool: gnss_pool, num_frames: buffer_depth, frame_size: 100000 }
recA_buf:  { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }
recB_buf:  { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }
out_buf:   { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }

read_in:
    kotekan_stage: rawFileRead
    buf: input_buf
    base_dir: "/tmp/gpsin_ref"
    file_name: "gpsin"
    file_ext: "raw"
    end_interrupt: true

fengine:
    kotekan_stage: fftwEngine
    in_buf: input_buf
    out_buf: chan_buf
    input_type: real
    pfb_window: hamming

split:
    kotekan_stage: GnssSubbandSplit
    in_buf: chan_buf
    out_bufs: [subA_buf, subB_buf]
    subband_lo: [0, 25]
    subband_hi: [25, 50]

# --- per-subband search (async) + tracker (lockstep) ---
search_a:
    kotekan_stage: GnssChannelizedSearch
    in_buf: subA_buf
    channel_offset: 0
    n_channels: 25
    acquire_snr: 12.0
    acquire_windows: 32
    doppler_min: -6000.0
    doppler_max: 6000.0
    doppler_step: 500.0
    prns: [5, 10, 23]
search_b:
    kotekan_stage: GnssChannelizedSearch
    in_buf: subB_buf
    channel_offset: 25
    n_channels: 25
    acquire_snr: 12.0
    acquire_windows: 32
    doppler_min: -6000.0
    doppler_max: 6000.0
    doppler_step: 500.0
    prns: [5, 10, 23]

track_a:
    kotekan_stage: GnssChannelizedTracker
    in_buf: subA_buf
    out_buf: recA_buf
    channel_offset: 0
    n_channels: 25
    prns: [10, 23]
    doppler_hz: [-1250.0, -2750.0]
    code_phase_chips: [647.0, 747.51]
track_b:
    kotekan_stage: GnssChannelizedTracker
    in_buf: subB_buf
    out_buf: recB_buf
    channel_offset: 25
    n_channels: 25
    prns: [10, 23]
    doppler_hz: [-1250.0, -2750.0]
    code_phase_chips: [647.0, 747.51]

combiner:
    kotekan_stage: GnssCoherentCombiner
    in_bufs: [recA_buf, recB_buf]
    out_buf: out_buf

write_records:
    kotekan_stage: rawFileWrite
    in_buf: out_buf
    base_dir: "/tmp/gpsdist"
    file_name: "gps"
    file_ext: "raw"
    prefix_hostname: false
    num_frames_per_file: 100000
    exit_after_n_files: 100000
