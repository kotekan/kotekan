---
# Centerpiece validation of the distributed coherent reassembly, at the CHORD-like
# 200 kHz channelization (spectrum_length 50 @ 20 MSPS), with chordMetadata fpga_seq
# flowing F-engine -> split -> trackers (multi-node absolute-sample reference).
#   rawFileRead -> fftwEngine(r2c PFB) -> two parallel paths:
#     FULL : GnssChannelizedTracker(all 50 ch)            -> combinerF -> recF
#     SPLIT: GnssSubbandSplit([0,25)+[25,50)) -> 2x tracker -> combinerS -> recS
# recF and recS must match per window: (G_A+G_B)/(E_A+E_B) == full despread.
# Feed: /tmp/gpsin_ref (20 MSPS L1 reference, (-1)^n flipped + 4-byte 0 header).
type: config
log_level: warn
instrument_name: airspy_gps

telescope: { name: ICETelescope, num_polarizations: 1, num_dishes: 1 }

samples_per_data_set: 50000    # multiple of 2N=100 -> 500 hops/frame
bytes_per_sample: 2
buffer_depth: 16
sizeof_float: 4
cpu_affinity: [0, 1, 2, 3]

# global F-engine + carrier geometry
spectrum_length: 50            # 200 kHz channels @ 20 MSPS (~CHORD 195 kHz)
num_taps: 4
sample_rate: 20.0e6
f_offset: 5.0e6
n_prn: 2
record_floats: 11
hops_per_record: 200           # one C/A period at 20 MSPS (20000 / 2N=100)
doppler_margin_hz: 900000.0    # ~9 covering channels (bins ~20..30) to split
prns: [10, 23]
doppler_hz: [-1250.0, -2750.0]
code_phase_chips: [647.0, 747.51]

# chordMetadata pool: carries fpga_seq from the F-engine through the split so each
# (per-node) tracker shares one absolute "sample 0".
gnss_pool:
    kotekan_metadata_pool: GnssChanMetadata
    num_metadata_objects: 8 * buffer_depth

input_buf: { kotekan_buffer: standard, metadata_pool: none,      num_frames: buffer_depth, frame_size: samples_per_data_set * bytes_per_sample }
chan_buf:  { kotekan_buffer: standard, metadata_pool: gnss_pool, num_frames: buffer_depth, frame_size: samples_per_data_set * sizeof_float }
# subband buffers: 500 hops * 25 ch * sizeof(cfloat32=8) = 100000 B
subA_buf:  { kotekan_buffer: standard, metadata_pool: gnss_pool, num_frames: buffer_depth, frame_size: 100000 }
subB_buf:  { kotekan_buffer: standard, metadata_pool: gnss_pool, num_frames: buffer_depth, frame_size: 100000 }
recF_buf:  { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }
recSa_buf: { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }
recSb_buf: { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }
outF_buf:  { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }
outS_buf:  { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }

read_in:
    kotekan_stage: rawFileRead
    buf: input_buf
    base_dir: "/tmp/gpsin_ref"
    file_name: "gpsin"
    file_ext: "raw"
    end_interrupt: true

fengine:
    kotekan_stage: fftwEngine
    in_buf: input_buf
    out_buf: chan_buf
    input_type: real
    pfb_window: hamming

# --- FULL path: one tracker over all 50 channels ---
trackerF:
    kotekan_stage: GnssChannelizedTracker
    in_buf: chan_buf
    out_buf: recF_buf
    channel_offset: 0
    n_channels: 50
combinerF:
    kotekan_stage: GnssCoherentCombiner
    in_bufs: [recF_buf]
    out_buf: outF_buf
writeF:
    kotekan_stage: rawFileWrite
    in_buf: outF_buf
    base_dir: "/tmp/gpscombine"
    file_name: "full"
    file_ext: "raw"
    prefix_hostname: false
    num_frames_per_file: 100000
    exit_after_n_files: 100000

# --- SPLIT path: fan into two channel halves, track each, recombine ---
split:
    kotekan_stage: GnssSubbandSplit
    in_buf: chan_buf
    out_bufs: [subA_buf, subB_buf]
    subband_lo: [0, 25]
    subband_hi: [25, 50]
trackerA:
    kotekan_stage: GnssChannelizedTracker
    in_buf: subA_buf
    out_buf: recSa_buf
    channel_offset: 0
    n_channels: 25
trackerB:
    kotekan_stage: GnssChannelizedTracker
    in_buf: subB_buf
    out_buf: recSb_buf
    channel_offset: 25
    n_channels: 25
combinerS:
    kotekan_stage: GnssCoherentCombiner
    in_bufs: [recSa_buf, recSb_buf]
    out_buf: outS_buf
writeS:
    kotekan_stage: rawFileWrite
    in_buf: outS_buf
    base_dir: "/tmp/gpscombine"
    file_name: "split"
    file_ext: "raw"
    prefix_hostname: false
    num_frames_per_file: 100000
    exit_after_n_files: 100000
