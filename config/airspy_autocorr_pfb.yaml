---
##########################################
#
# airspy_autocorr_pfb.yaml
#
# Same as airspy_autocorr.yaml (AirSpy -> F-engine -> autocorr -> viewer), but
# the F-engine runs as a 4-tap POLYPHASE FILTER BANK instead of a straight FFT
# (fftwEngine num_taps>1). The PFB gives flat-passband, deep-stopband channels
# in place of the straight FFT's sinc-shaped bins (~-13 dB sidelobes, ~3.9 dB
# scalloping) -- the spectrum should show sharper channel isolation, especially
# around any narrowband features. num_taps: 1 here would reproduce the straight
# FFT bit for bit.
#
# Author: Keith Vanderlinde
#
##########################################
type: config
log_level: info

instrument_name: airspy

# chord-branch framework builds a default ICETelescope needing these even though
# the airspy pipeline never uses it; trivial 1x1 stub.
telescope:
    name: ICETelescope
    num_polarizations: 1
    num_dishes: 1

rest_server:
    cors_allow_origins:
        - "http://localhost:8080"
        - "http://127.0.0.1:8080"

samples_per_data_set: 32768
bytes_per_sample: 2
buffer_depth: 10
cpu_affinity: [4, 5, 6, 7]
num_elements: 1
one: 1
two: 2
sizeof_float: 4

input_buf:
    kotekan_buffer: standard
    metadata_pool: none
    num_frames: buffer_depth
    frame_size: samples_per_data_set * bytes_per_sample

sample_bw: 2.5 #MHz device rate (Fs_real = 5 MSPS); R2 supports 10 and 2.5
freq: 1421.    #MHz
airspy_input:
    kotekan_stage: airspyInput
    out_buf: input_buf
    gain_lna: 10 #0-14
    gain_mix: 10 #0-15
    gain_if: 10  #0-15
    biast_power: false
#    serial: 0x744C60C821311C4F  # CHORD-feed dongle

spectrum_output:
    integration_length: 64
    power_integration_length: 64
    spectrum_length: 1024

    post_fengine_buf:
        kotekan_buffer: standard
        metadata_pool: none
        num_frames: buffer_depth
        frame_size: samples_per_data_set * sizeof_float # * 2 for complex / 2 for half-size

    fengine:
        kotekan_stage: fftwEngine
        # airspyInput produces real (RAW) int16 samples; use the real-input FFT.
        input_type: real
        # 4-tap polyphase filter bank instead of a straight FFT.
        num_taps: 4
        pfb_window: hamming
        in_buf: input_buf
        out_buf: post_fengine_buf

    post_corr_buf:
        kotekan_buffer: standard
        metadata_pool: none
        num_frames: buffer_depth
        frame_size: ( spectrum_length + one ) * sizeof_float

    xengine:
        kotekan_stage: simpleAutocorr
        in_buf: post_fengine_buf
        out_buf: post_corr_buf

    power_stream:
        kotekan_stage: networkPowerStream
        num_freq: 1024
        samples_per_data_set: 64
        destination_port: 23401
        destination_ip: "127.0.0.1"
        destination_protocol: TCP
        in_buf: post_corr_buf

    spawn_pyviewer:
        kotekan_stage: SpawnProcess
        in_buf: post_corr_buf
        exec: '${VIEWER_PYTHON:-python3} ../../python/scripts/js_viewer/livebeam_server.py'
