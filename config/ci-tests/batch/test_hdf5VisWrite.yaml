---
type: config
log_level: info

num_elements: 16
num_ev: 4
cpu_affinity: [0,1]

# Minimal CHORD telescope configuration (used by FakeN2 for timestamps/metadata)
telescope:
    name: CHORDTelescope
    require_gps: false
    # Site and orientation
    inst_long_deg: -119.62081125
    inst_lat_deg: 49.3207514444444444
    inst_alt_deg: 90.0
    inst_grid_x_axis: [1.0, 0.0, 0.0]
    inst_grid_y_axis: [0.0, 1.0, 0.0]
    inst_dish_alt_axis: [1.0, 0.0, 0.0]
    inst_dish_vert_axis: [0.0, 0.0, 1.0]
    dish_positions: [[0.0, 0.0, 0.0]]
    updatable_config: "/earth_rotation_data"

earth_rotation_data:
    kotekan_update_endpoint: json
    earth_orientation_parameter_table: [
        {
            time_inst_ns: 1578010000000000300,
            delta_UT1_inst: 0.0,
            x_pm: 0.0,
            y_pm: 0.0
        },
        {
            time_inst_ns: 1578010001000000300,
            delta_UT1_inst: 0.0,
            x_pm: 0.0,
            y_pm: 0.0
        }
    ]

# Set telescope time0 to align with EOP table to avoid early-time EOP warnings
gps_time:
    frame0_nano: 1578010000000000300

# Metadata pool for N2 frames
N2_pool:
    kotekan_metadata_pool: N2Metadata
    num_metadata_objects: 128

# N2 visibility buffer
fakevis_buf:
    kotekan_buffer: N2
    metadata_pool: N2_pool
    num_frames: 128

# Produce 5 time steps, 32 frequencies, 16 elements
fake_n2:
    kotekan_stage: FakeN2
    out_buf: fakevis_buf
    num_elements: 16
    num_total_freq: 32
    cadence: 0.2
    num_frames: 5
    wait: false
    mode: default

# Write out the visibilities
hdf5_vis_write:
    kotekan_stage: hdf5VisWrite
    in_buf: fakevis_buf
    base_dir: ./vis_ci_out
    file_name: ci_test
    prefix_hostname: false
    zip_compression: 0
    # Chunking: ensure positive chunk sizes
    blocksize_f: 1
    blocksize_t: 5
    file_seconds: 6
    late_frame_grace_seconds: 10

# TODO: check that the files were written?

buffer_monitor:
    kotekan_stage: monitorBuffer
    timeout: 2.0 # If no activity in this buffer for this many seconds,
    graceful_shutdown: true # trigger failure
    wait_for_first_frame: true
    bufs:
      - fakevis_buf
