---
##########################################
#
# verify_cuda_n2k.yaml
#
# Config to test Kendrick's cuda RFI S012 kernel
#
##########################################
type: config
# Logging level can be one of:
# OFF, ERROR, WARN, INFO, DEBUG, DEBUG2 (case insensitive)
# Note DEBUG and DEBUG2 require a build with (-DCMAKE_BUILD_TYPE=Debug)
log_level: INFO

num_gpus: 1
buffer_depth: 4
cpu_affinity: [0]
sizeof_float: 4
sizeof_int: 4
sizeof_long: 8

# For faster CHORD testing, we're using...
samples_per_data_set: 1024 * 32
frame_arrival_period: 5.12e-6 * samples_per_data_set
num_polarizations: 2
num_dishes: 64
num_elements: num_polarizations * num_dishes
num_local_freq: 8

rfi_downsampling_factor: 256
rfi_second_downsampling_factor: 32

# Pool
main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 20 * buffer_depth

# Buffers

host_rfi_s012_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: uint64
    extents: [samples_per_data_set / rfi_downsampling_factor, num_local_freq, 3, num_polarizations, num_dishes]
    metadata_pool: main_pool

host_rfi_s012bar_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: uint64
    extents: [samples_per_data_set / rfi_downsampling_factor / rfi_second_downsampling_factor, num_local_freq, 3, num_polarizations, num_dishes]
    metadata_pool: main_pool

simulated_rfi_s012bar_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: uint64
    extents: [samples_per_data_set / rfi_downsampling_factor / rfi_second_downsampling_factor, num_local_freq, 3, num_polarizations, num_dishes]
    metadata_pool: main_pool


# Ringbuffer signalling buffer
host_rfi_s012_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * (samples_per_data_set / rfi_downsampling_factor) * num_local_freq * 3 * num_elements * sizeof_long
    metadata_pool: main_pool

host_rfi_s012bar_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * (samples_per_data_set / rfi_downsampling_factor / rfi_second_downsampling_factor) * num_local_freq * 3 * num_elements * sizeof_long
    metadata_pool: main_pool

gen_rfi_s012:
    type: randomu64
    kotekan_stage: testDataGen
    out_buf: host_rfi_s012_buffer
    name: "S012"
    array_shape: [128, 8, 3, 2, 64]
    dim_name: ["Trfi", "F", "S", "P", "D"]
    num_frames: 2*buffer_depth  # Must be at least what check_data expects
    meta_time_downsample_factor: rfi_downsampling_factor

run_send_rfi_s012:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_rfi_s012_buffer_in: host_rfi_s012_buffer
        out_buffers:
            host_rfi_s012_ringbuffer_out: host_rfi_s012_ringbuffer
        commands:
            - name: cudaCopyToRingbuffer
              input_size: samples_per_data_set / rfi_downsampling_factor * num_local_freq * 3 * num_elements * sizeof_long
              ring_buffer_size: buffer_depth * input_size
              in_buf: host_rfi_s012_buffer_in
              signal_buf: host_rfi_s012_ringbuffer_out
              gpu_mem_output: rfi_s012_buffer

run_rfi_s012bar:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_rfi_s012_ringbuffer: host_rfi_s012_ringbuffer
        out_buffers:
            host_rfi_s012bar_ringbuffer: host_rfi_s012bar_ringbuffer
        commands:
            - name: cudaRFIS012bar
              rfi_S012_name: rfi_s012
              rfi_S012bar_name: rfi_s012bar
              num_times: samples_per_data_set
              num_frequencies: num_local_freq
              rfi_num_times: samples_per_data_set / rfi_downsampling_factor
              rfi_num_times_bar: samples_per_data_set / rfi_downsampling_factor / rfi_second_downsampling_factor

run_recv_rfi_s012bar:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_rfi_s012bar_ringbuffer_in: host_rfi_s012bar_ringbuffer
        out_buffers:
            host_rfi_s012bar_buffer_out: host_rfi_s012bar_buffer
        commands:
            - name: cudaCopyFromRingbuffer
              host_signal: host_rfi_s012bar_ringbuffer_in
              gpu_mem_input: rfi_s012bar_buffer
              output_size: (samples_per_data_set / rfi_downsampling_factor / rfi_second_downsampling_factor) * num_local_freq * 3 * num_elements * sizeof_long
              ring_buffer_size: buffer_depth * output_size
              out_buf: host_rfi_s012bar_buffer_out


cpu_rfi_s012bar:
    kotekan_stage: gpuSimulateRFIS012bar
    in_buf: host_rfi_s012_buffer
    out_buf: simulated_rfi_s012bar_buffer


check_rfi_data:
    kotekan_stage: testDataCheckUlong
    first_buf: host_rfi_s012bar_buffer
    second_buf: simulated_rfi_s012bar_buffer
    max_num_errors_logged: 384
    num_frames_to_test: 2*buffer_depth
    check_metadata: true
