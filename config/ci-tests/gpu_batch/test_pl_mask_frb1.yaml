# Standalone test of the FRB1 PL mask CUDA kernel: the testPLMaskFRB1 stage invents data, runs the
# GPU kernel and the CPU reference, and compares them byte for byte.
# All test parameters are hard-coded in the stage, so no config is required beyond the stage itself.

type: config
log_level: INFO

cpu_affinity: [0]

# Required by the default telescope setup (the stage itself reads no config).
num_polarizations: 2
num_dishes: 512

test_pl_mask_frb1:
    kotekan_stage: testPLMaskFRB1
    join_timeout: 60
log_config_usage: fatal_error
