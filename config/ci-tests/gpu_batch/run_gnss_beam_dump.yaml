---
##########################################
#
# run_gnss_beam_dump.yaml
#
# cudaGnssBeamDump on random 4+4b voltages through the ring: two channels of a 2048-sample
# frame, the beam frames written to /tmp by rawFileWrite (two files, then exit). Read the
# files back with scripts/gnss/beam_dump_read.py info to check the header and eigenvalues
# (random inputs: lambda1 ~ lambda2 ~ 1 + O(1/sqrt(T))).
#
##########################################
type: config
log_level: INFO

buffer_depth: 4
cpu_affinity: [2, 3, 4, 5, 8, 9, 10, 11]
frame_arrival_period: 5.12e-6 * samples_per_data_set

samples_per_data_set: 2048
num_times: samples_per_data_set
num_polarizations: 2
num_dishes: 64
num_elements: num_polarizations * num_dishes
num_local_freq: 8

main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 15 * buffer_depth

host_voltage_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: int4x2_swapped_withoffset
    extents: [samples_per_data_set, num_local_freq, num_polarizations, num_dishes]
    metadata_pool: main_pool

host_voltage_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * samples_per_data_set * num_elements * num_local_freq
    metadata_pool: main_pool

# gnss_cuda::beam_dump_layout(2, 2048): 64 + freq_ids -> 80, lambda -> 112, pw -> 1136,
# w -> 3184, samples 2 x 2048 x 4 -> 19568
host_test_beam_buf:
    kotekan_buffer: standard
    metadata_pool: main_pool
    num_frames: buffer_depth
    frame_size: 19568

gen_data_voltage:
    type: random_signed_offset
    value: 120
    kotekan_stage: testDataGen
    out_buf: host_voltage_buffer
    name: "E"
    array_shape: [2048, 8, 2, 64]
    dim_name: ["T", "F", "P", "D"]
    dim_scaling: [1, 1, 1, 1]
    num_frames: 4 * buffer_depth

run_send_voltage:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_buffer_in: host_voltage_buffer
        out_buffers:
            host_voltage_ringbuffer_out: host_voltage_ringbuffer
        commands:
            - name: cudaCopyToRingbuffer
              input_size: samples_per_data_set * num_local_freq * num_elements
              ring_buffer_size: buffer_depth * input_size
              in_buf: host_voltage_buffer_in
              signal_buf: host_voltage_ringbuffer_out
              gpu_mem_output: voltage_buffer

run_beam_dump:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_ringbuffer: host_voltage_ringbuffer
        out_buffers:
            host_gnss_beam: host_test_beam_buf
        commands:
            - name: cudaGnssBeamDump
              voltage_name: voltage
              beam_name: test_beam
              beam_local_channels: [1, 5]
              beam_freq_ids: [1, 5]   # testDataGen labels the channels by index
              beam_ref_input: 100
              beam_eig_iters: 4
            - name: cudaSyncOutput
            - name: cudaOutputData
              gpu_mem: test_beam_buffer
              out_buf: host_gnss_beam

beam_sink:
    kotekan_stage: rawFileWrite
    in_buf: host_test_beam_buf
    base_dir: /tmp/kotekan_gnss_beam_dump
    file_name: test_beam
    file_ext: raw
    prefix_hostname: false
    num_frames_per_file: 4
    allow_ndarray: true
    exit_after_n_files: 2
    create_base_dir: true
