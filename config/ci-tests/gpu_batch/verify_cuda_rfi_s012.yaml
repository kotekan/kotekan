---
##########################################
#
# verify_cuda_rfi_s012.yaml
#
# Config to test the cuda RFI S012 kernel
#
##########################################
type: config
# Logging level can be one of:
# OFF, ERROR, WARN, INFO, DEBUG, DEBUG2 (case insensitive)
# Note DEBUG and DEBUG2 require a build with (-DCMAKE_BUILD_TYPE=Debug)
log_level: INFO

num_gpus: 1
buffer_depth: 4
cpu_affinity: [0]
sizeof_float: 4
sizeof_int: 4
sizeof_long: 8

# For faster CHORD testing, we're using...
samples_per_data_set: 1024
frame_arrival_period: 5.12e-6 * samples_per_data_set
num_polarizations: 2
num_dishes: 64
num_elements: num_polarizations * num_dishes
num_local_freq: 8

rfi_downsampling_factor: 256

# Pool
main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 20 * buffer_depth

# Buffers
raw_voltage_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: int4x2_swapped_withoffset
    extents: [samples_per_data_set, num_local_freq, num_polarizations, num_dishes]
    metadata_pool: main_pool

host_voltage_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: int4x2_swapped_withoffset
    extents: [samples_per_data_set, num_local_freq, 2, num_elements / 2]
    metadata_pool: main_pool

host_pl_mask_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: uint1x8
    extents: [samples_per_data_set / 128, num_local_freq / 4, num_polarizations, num_dishes / 8, 8]
    metadata_pool: main_pool

host_rfi_s012_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: uint64
    extents: [samples_per_data_set / rfi_downsampling_factor, num_local_freq, 3, num_polarizations, num_dishes]
    metadata_pool: main_pool

simulated_rfi_s012_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: uint64
    extents: [samples_per_data_set / rfi_downsampling_factor, num_local_freq, 3, num_polarizations, num_dishes]
    metadata_pool: main_pool


# Ringbuffer signalling buffer
host_voltage_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * samples_per_data_set * num_local_freq * num_elements
    metadata_pool: main_pool

host_pl_mask_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * ((samples_per_data_set / 2) * (num_local_freq / 4) * (num_elements / 8)) / 8
    metadata_pool: main_pool

host_rfi_s012_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * (samples_per_data_set / rfi_downsampling_factor) * num_local_freq * 3 * num_elements * sizeof_long
    metadata_pool: main_pool

gen_data_voltage:
    type: random_signed_offset
    kotekan_stage: testDataGen
    out_buf: raw_voltage_buffer
    name: "E"
    array_shape: [1024, 8, 2, 64]
    dim_name: ["T", "F", "P", "D"]
    num_frames: 2*buffer_depth  # Must be at least what check_data expects

gen_pl_mask:
    type: random1x8
    kotekan_stage: testDataGen
    out_buf: host_pl_mask_buffer
    name: "pl_mask"
    array_shape: [8, 2, 2, 8, 8]    # = num_times/128, num_freq/4, 2, num_dishes/8, 8
    dim_name: ["T2hi64", "F4", "P", "D8", "T2lo64"]
    num_frames: 2*buffer_depth  # Must be at least what check_data expects
    meta_time_downsample_factor: 128  # The number of time samples represented by each coarse time index.

applyPL:
    kotekan_stage: applyGenPL
    voltage_in_buf: raw_voltage_buffer
    voltage_out_buf: host_voltage_buffer
    plmask_in_buf: host_pl_mask_buffer

run_send_voltage:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_buffer_in: host_voltage_buffer
        out_buffers:
            host_voltage_ringbuffer_out: host_voltage_ringbuffer
        commands:
            - name: cudaCopyToRingbuffer
              input_size: samples_per_data_set * num_local_freq * num_elements
              ring_buffer_size: buffer_depth * input_size
              in_buf: host_voltage_buffer_in
              signal_buf: host_voltage_ringbuffer_out
              gpu_mem_output: voltage_buffer

run_send_pl_mask:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_pl_mask_buffer_in: host_pl_mask_buffer
        out_buffers:
            host_pl_mask_ringbuffer_out: host_pl_mask_ringbuffer
        commands:
            - name: cudaCopyToRingbuffer
              input_size: (samples_per_data_set / 2) * (num_local_freq / 4) * (num_elements / 8) / 8
              ring_buffer_size: buffer_depth * input_size
              in_buf: host_pl_mask_buffer_in
              signal_buf: host_pl_mask_ringbuffer_out
              gpu_mem_output: pl_mask_buffer

run_rfi_s012:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_ringbuffer: host_voltage_ringbuffer
            host_pl_mask_ringbuffer: host_pl_mask_ringbuffer
        out_buffers:
            host_rfi_s012_ringbuffer: host_rfi_s012_ringbuffer
        commands:
            - name: cudaRFIS012
              voltage_name: voltage
              pl_mask_name: pl_mask
              rfi_S012_name: rfi_s012
              num_times: samples_per_data_set
              num_frequencies: num_local_freq
              rfi_num_times: samples_per_data_set / rfi_downsampling_factor

run_recv_rfi_s012:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_rfi_s012_ringbuffer_in: host_rfi_s012_ringbuffer
        out_buffers:
            host_rfi_s012_buffer_out: host_rfi_s012_buffer
        commands:
            - name: cudaCopyFromRingbuffer
              host_signal: host_rfi_s012_ringbuffer_in
              gpu_mem_input: rfi_s012_buffer
              output_size: (samples_per_data_set / rfi_downsampling_factor) * num_local_freq * 3 * num_elements * sizeof_long
              ring_buffer_size: buffer_depth * output_size
              out_buf: host_rfi_s012_buffer_out


cpu_rfi_s012:
    kotekan_stage: gpuSimulateRFIS012
    in_voltage_buf: host_voltage_buffer
    in_plmask_buf: host_pl_mask_buffer
    out_buf: simulated_rfi_s012_buffer


check_rfi_data:
    kotekan_stage: testDataCheckUlong
    first_buf: host_rfi_s012_buffer
    second_buf: simulated_rfi_s012_buffer
    max_num_errors_logged: 384
    num_frames_to_test: 2*buffer_depth
    check_metadata: true
