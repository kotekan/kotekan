---
##########################################
#
# test_shutdown_while_gpu_bound.yaml
#
# A shutdown requested while a GPU stage is GPU-bound must exit cleanly.
#
# run_n2k copies a 256 MiB padding region out to the host every frame, so its
# GPU work takes ~10 ms per frame while the host feeds it in ~1 ms: the host runs
# buffer_depth frames ahead and the stage's main thread waits for a FREE SLOT, not
# for ring data. That is how a loaded production GPU runs. exit_timer, a paced
# generator on an unrelated buffer, then requests the exit after ~2 s while both
# drains keep draining, so run_n2k is still slot-bound when the stop lands. (A
# drain requesting the exit itself would stop draining first, and main polls for
# the request once a second, long enough for the GPU stage to block on a full
# host buffer instead.) gpuProcess::results_thread skips finalize_frame() once
# stop is set, so the in-flight frames' ring claims stay held; the main thread
# must notice the stop when its slot comes free instead of starting another frame
# on it, or cudaCorrelator's precondition finds its claim still open ("valid read
# region is not empty") and a clean exit becomes a FatalError, after which the
# results thread is left waiting on a signal the destructor destroys. Fails on
# the code before this test was added.
#
# Author: Keith Vanderlinde
#
##########################################
type: config
# Logging level can be one of:
# OFF, ERROR, WARN, INFO, DEBUG, DEBUG2 (case insensitive)
# Note DEBUG and DEBUG2 require a build with (-DCMAKE_BUILD_TYPE=Debug)
log_level: INFO

buffer_depth: 4
cpu_affinity: [2, 3, 4, 5, 8, 9, 10, 11]
frame_arrival_period: 5.12e-6 * samples_per_data_set

# For faster CHORD testing, we're using...
sub_integration_ntime: 512
samples_per_data_set: 2048
# sub_integration_ntime: 8192  # ~40 ms for chord
# samples_per_data_set: 8192   # 
num_times: samples_per_data_set
num_polarizations: 2
num_dishes: 64
num_elements: num_polarizations * num_dishes
num_local_freq: 8

#counts matrix size

# vis matrix size
vis_blocksize: 16
vis_num_blocks_lin: num_elements / vis_blocksize
vis_num_blocks: vis_num_blocks_lin * (vis_num_blocks_lin + 1) / 2

# Pool
main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 15 * buffer_depth

# Buffers
host_voltage_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: int4x2_swapped_withoffset
    extents: [samples_per_data_set, num_local_freq, num_polarizations, num_dishes]
    metadata_pool: main_pool

host_rfi_RFImask_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: uint1x8
    extents: [samples_per_data_set / 1024, num_local_freq, 128]
    metadata_pool: main_pool

host_correlation_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: int32
    extents: [samples_per_data_set / sub_integration_ntime, num_local_freq, vis_num_blocks, vis_blocksize, vis_blocksize, 2]
    metadata_pool: main_pool

# Unrelated buffer for the exit timer.
timer_buffer:
    kotekan_buffer: ndarray
    metadata_pool: main_pool
    num_frames: buffer_depth
    value_type: uint1x8
    extents: [samples_per_data_set / 1024, num_local_freq, 128]

host_pad:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: 268435456  # 256 MiB copied out per frame (~10 ms): makes run_n2k GPU-bound
    metadata_pool: main_pool

host_voltage_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * samples_per_data_set * num_local_freq * num_elements
    metadata_pool: main_pool

host_rfi_RFImask_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * samples_per_data_set * num_local_freq / 8
    metadata_pool: main_pool

gen_data_voltage:
    wait: false          # unpaced: the host runs ahead of the GPU
    reuse_random: true
    type: const_offset
    value: 120
    kotekan_stage: testDataGen
    out_buf: host_voltage_buffer
    name: "E"
    array_shape: [2048, 8, 2, 64]
    dim_name: ["T", "F", "P", "D"]
    dim_scaling: [1, 1, 1, 1]

gen_data_rfi_RFImask:
    wait: false          # unpaced: the host runs ahead of the GPU
    reuse_random: true
    type: const1x8
    value: 255
    kotekan_stage: testDataGen
    out_buf: host_rfi_RFImask_buffer
    name: "RFImask"
    array_shape: [2, 8, 128]
    dim_name: ["T8hi128", "F", "T8lo128"]
    dim_scaling: [1024, 1, 8]
    meta_time_downsample_factor: 1024  # The number of time samples represented by each coarse time index.

# Requests the exit: paced at the telescope cadence, so ~2 s of running first.
exit_timer:
    type: const1x8
    value: 0
    kotekan_stage: testDataGen
    out_buf: timer_buffer
    name: "timer"
    array_shape: [2, 8, 128]
    dim_name: ["T8hi128", "F", "T8lo128"]
    dim_scaling: [1024, 1, 8]
    meta_time_downsample_factor: 1024
    wait: true
    num_frames: 400
    end_interrupt: true

drain_timer:
    kotekan_stage: dropAllFrames
    in_buf: timer_buffer

run_send_voltage:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_buffer_in: host_voltage_buffer
        out_buffers:
            host_voltage_ringbuffer_out: host_voltage_ringbuffer
        commands:
            - name: cudaCopyToRingbuffer
              input_size: samples_per_data_set * num_local_freq * num_elements
              ring_buffer_size: buffer_depth * input_size
              in_buf: host_voltage_buffer_in
              signal_buf: host_voltage_ringbuffer_out
              gpu_mem_output: voltage_buffer

run_send_rfi_RFImask:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_rfi_RFImask_buffer_in: host_rfi_RFImask_buffer
        out_buffers:
            host_rfi_RFImask_ringbuffer_out: host_rfi_RFImask_ringbuffer
        commands:
            - name: cudaCopyToRingbuffer
              input_size: samples_per_data_set * num_local_freq / 8
              ring_buffer_size: buffer_depth * samples_per_data_set * num_local_freq / 8
              in_buf: host_rfi_RFImask_buffer_in
              signal_buf: host_rfi_RFImask_ringbuffer_out
              gpu_mem_output: rfi_RFImask_buffer

run_n2k:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_ringbuffer: host_voltage_ringbuffer
            host_rfi_RFImask_ringbuffer: host_rfi_RFImask_ringbuffer
        out_buffers:
            host_correlation: host_correlation_buffer
            host_pad: host_pad
        commands:
            - name: cudaCorrelator
              n2k_correlation_name: correlation
              voltage_name: voltage
              rfi_RFImask_name: rfi_RFImask
            - name: cudaSyncOutput
            - name: cudaOutputData
              gpu_mem: correlation_buffer
              out_buf: host_correlation
            - name: cudaOutputData
              gpu_mem: pad_buffer
              out_buf: host_pad


# Drain both outputs so the pipeline is bound by the GPU, never by a full host buffer.
drain:
    kotekan_stage: dropAllFrames
    in_buf: host_correlation_buffer

drain_pad:
    kotekan_stage: dropAllFrames
    in_buf: host_pad

log_config_usage: fatal_error
