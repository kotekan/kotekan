---
##########################################
#
# verify_cuda_n2k_plexp.yaml
#
# Config to test Kendrick's cuda N2 tensor-core Packet Loss Expander kernel.
#
##########################################
type: config
# Logging level can be one of:
# OFF, ERROR, WARN, INFO, DEBUG, DEBUG2 (case insensitive)
# Note DEBUG and DEBUG2 require a build with (-DCMAKE_BUILD_TYPE=Debug)
log_level: INFO

num_gpus: 1
buffer_depth: 4
cpu_affinity: [2, 3, 4, 5, 8, 9, 10, 11]
sizeof_float: 4
frame_arrival_period: 5.12e-6 * samples_per_data_set
sizeof_int: 4

# For faster CHORD testing, we're using...
sub_integration_ntime: 2048
samples_per_data_set: 4096
# sub_integration_ntime: 8192  # ~40 ms for chord
# samples_per_data_set: 8192   # 
num_times: samples_per_data_set
num_polarizations: 2
num_dishes: 64
num_elements: num_polarizations * num_dishes
num_local_freq: 16

# Pool
main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 15 * buffer_depth

# Buffers
host_pl_mask_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: ((samples_per_data_set / 2) * (num_local_freq / 4) * (num_elements / 8)) / 8
    metadata_pool: main_pool

host_pl_mask_exp_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: (samples_per_data_set * num_local_freq * (num_elements / 8)) / 8
    metadata_pool: main_pool

simulated_pl_mask_exp_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: (samples_per_data_set * num_local_freq * (num_elements / 8)) / 8
    metadata_pool: main_pool

# Ringbuffer signalling buffer
host_pl_mask_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * ((samples_per_data_set / 2) * (num_elements / 8) * (num_local_freq / 4)) / 8
    metadata_pool: main_pool

host_pl_mask_exp_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * (samples_per_data_set * num_local_freq * (num_elements / 8)) / 8
    metadata_pool: main_pool

gen_pl_mask:
    type: random1x8
    value: 120
    kotekan_stage: testDataGen
    out_buf: host_pl_mask_buffer
    name: "pl_mask"
    array_shape: [32, 4, 2, 8, 8]    # = num_times/128, num_freq/4, 2, num_dishes/8, 8
    dim_name: ["T2hi64", "F4", "P", "D8", "T2lo64"]
    dim_scaling: [128, 4, 1, 8, 16]
    num_frames: buffer_depth  # Must be at least what check_data expects
    meta_time_downsample_factor: 128  # The number of time samples represented by each coarse time index.

run_send_pl_mask:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_pl_mask_buffer_in: host_pl_mask_buffer
        out_buffers:
            host_pl_mask_ringbuffer_out: host_pl_mask_ringbuffer
        commands:
            - name: cudaCopyToRingbuffer
              input_size: (samples_per_data_set/2) * (num_local_freq/4) * (num_elements/8) / 8
              ring_buffer_size: buffer_depth * input_size
              in_buf: host_pl_mask_buffer_in
              signal_buf: host_pl_mask_ringbuffer_out
              gpu_mem_output: pl_mask_buffer

run_pl_expand:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_pl_mask_ringbuffer: host_pl_mask_ringbuffer
        out_buffers:
            host_pl_mask_exp_ringbuffer: host_pl_mask_exp_ringbuffer
        commands:
            - name: cudaPLMaskExpander
              num_frequencies: num_local_freq
              pl_mask_name: pl_mask
              pl_expanded_mask_name: pl_mask_exp

run_recv_pl_mask:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_pl_mask_exp_ringbuffer: host_pl_mask_exp_ringbuffer
        out_buffers:
            host_pl_mask_exp_buffer: host_pl_mask_exp_buffer
        commands:
            - name: cudaCopyFromRingbuffer
              host_signal: host_pl_mask_exp_ringbuffer
              gpu_mem_input: pl_mask_exp_buffer
              output_size: samples_per_data_set * num_local_freq * (num_elements / 8) / 8
              ring_buffer_size: buffer_depth * output_size
              out_buf: host_pl_mask_exp_buffer

cpu:
    kotekan_stage: gpuSimulateN2kPLExpand
    in_buf: host_pl_mask_buffer
    out_buf: simulated_pl_mask_exp_buffer

check_data:
    kotekan_stage: testDataCheckUint
    first_buf: host_pl_mask_exp_buffer
    second_buf: simulated_pl_mask_exp_buffer
    num_frames_to_test: buffer_depth
    check_metadata: true
