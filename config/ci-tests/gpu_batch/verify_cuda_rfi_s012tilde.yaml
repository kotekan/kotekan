---
##########################################
#
# verify_cuda_rfi_s012tilde.yaml
#
# Config to test the cuda RFI S012tilde kernel
#
##########################################
type: config
# Logging level can be one of:
# OFF, ERROR, WARN, INFO, DEBUG, DEBUG2 (case insensitive)
# Note DEBUG and DEBUG2 require a build with (-DCMAKE_BUILD_TYPE=Debug)
log_level: INFO

buffer_depth: 4
cpu_affinity: [0]
sizeof_long: 8

# For faster CHORD testing, we're using...
samples_per_data_set: 1024
frame_arrival_period: 5.12e-6 * samples_per_data_set
num_polarizations: 2
num_dishes: 64
num_elements: num_polarizations * num_dishes
num_local_freq: 4

rfi_downsampling_factor: 256

updatable_config:
    bad_inputs:
        kotekan_update_endpoint: json
        # yamlfix:off
        bad_inputs: [3, 12, 46, 47, 48, 84, 99, 107, 120]
        # yamlfix:on
        start_time: 1535048997.
        update_id: "initial_flags"

# Pool
main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 20 * buffer_depth

# Buffers
host_bf_mask_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: int8
    extents: [num_polarizations, num_dishes]
    metadata_pool: main_pool

host_rfi_s012_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: uint64
    extents: [samples_per_data_set / rfi_downsampling_factor, num_local_freq, 3, num_polarizations, num_dishes]
    metadata_pool: main_pool

host_rfi_s012tilde_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: uint64
    extents: [samples_per_data_set / rfi_downsampling_factor, num_local_freq, 3]
    metadata_pool: main_pool

simulated_rfi_s012tilde_buffer:
    kotekan_buffer: ndarray
    num_frames: buffer_depth
    value_type: uint64
    extents: [samples_per_data_set / rfi_downsampling_factor, num_local_freq, 3]
    metadata_pool: main_pool


# Ringbuffer signalling buffer
host_rfi_s012_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * (samples_per_data_set / rfi_downsampling_factor) * num_local_freq * 3 * num_elements * sizeof_long
    metadata_pool: main_pool

host_rfi_s012tilde_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * (samples_per_data_set / rfi_downsampling_factor) * num_local_freq * 3 * sizeof_long
    metadata_pool: main_pool

gen_rfi_s012:
    type: randomu64
    kotekan_stage: testDataGen
    out_buf: host_rfi_s012_buffer
    name: "S012"
    array_shape: [4, 4, 3, 2, 64]
    dim_name: ["Trfi", "F", "S", "P", "D"]
    dim_scaling: [256, 1, 1, 1, 1] # rfi_downsampling_factor=256
    num_frames: 2*buffer_depth  # Must be at least what check_data expects
    meta_time_downsample_factor: rfi_downsampling_factor

set_bf_mask:
    kotekan_stage: bufferBadInputs
    updatable_config:
        bad_inputs: /updatable_config/bad_inputs
    out_buf: host_bf_mask_buffer

run_send_rfi_s012:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_rfi_s012_buffer_in: host_rfi_s012_buffer
        out_buffers:
            host_rfi_s012_ringbuffer_out: host_rfi_s012_ringbuffer
        commands:
            - name: cudaCopyToRingbuffer
              input_size: samples_per_data_set / rfi_downsampling_factor * num_local_freq * 3 * num_elements * sizeof_long
              ring_buffer_size: buffer_depth * input_size
              in_buf: host_rfi_s012_buffer_in
              signal_buf: host_rfi_s012_ringbuffer_out
              gpu_mem_output: rfi_s012_buffer

run_rfi_s012tilde:
    log_level: DEBUG
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_bf_mask_buffer: host_bf_mask_buffer
            host_rfi_s012_ringbuffer: host_rfi_s012_ringbuffer
        out_buffers:
            host_rfi_s012tilde_ringbuffer: host_rfi_s012tilde_ringbuffer
        commands:
            - name: cudaInputData
              do_once: false
              in_buf: host_bf_mask_buffer
              gpu_mem: bf_mask_buffer
            - name: cudaSyncInput
            - name: cudaRFIS012tilde
              rfi_S012_name: rfi_s012
              bf_mask_name: bf_mask
              rfi_S012tilde_name: rfi_s012tilde
              num_times: samples_per_data_set
              num_frequencies: num_local_freq
              rfi_num_times: samples_per_data_set / rfi_downsampling_factor

run_recv_rfi_s012tilde:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_rfi_s012tilde_ringbuffer_in: host_rfi_s012tilde_ringbuffer
        out_buffers:
            host_rfi_s012tilde_buffer_out: host_rfi_s012tilde_buffer
        commands:
            - name: cudaCopyFromRingbuffer
              host_signal: host_rfi_s012tilde_ringbuffer_in
              gpu_mem_input: rfi_s012tilde_buffer
              output_size: (samples_per_data_set / rfi_downsampling_factor) * num_local_freq * 3 * sizeof_long
              ring_buffer_size: buffer_depth * output_size
              out_buf: host_rfi_s012tilde_buffer_out


cpu_rfi_s012tilde:
    kotekan_stage: gpuSimulateRFIS012tilde
    in_rfi_s012_buf: host_rfi_s012_buffer
    in_bf_mask_buf: host_bf_mask_buffer
    out_rfi_s012tilde_buf: simulated_rfi_s012tilde_buffer


check_rfi_data:
    kotekan_stage: testDataCheckUlong
    first_buf: host_rfi_s012tilde_buffer
    second_buf: simulated_rfi_s012tilde_buffer
    max_num_errors_logged: 64
    num_frames_to_test: 2 * buffer_depth
    check_metadata: true
log_config_usage: fatal_error
