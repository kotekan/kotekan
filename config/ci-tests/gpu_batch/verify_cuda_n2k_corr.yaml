---
##########################################
#
# verify_cuda_n2k.yaml
#
# Config to test Kendrick's cuda N2 tensor-core kernel.
#
##########################################
type: config
# Logging level can be one of:
# OFF, ERROR, WARN, INFO, DEBUG, DEBUG2 (case insensitive)
# Note DEBUG and DEBUG2 require a build with (-DCMAKE_BUILD_TYPE=Debug)
log_level: INFO

num_gpus: 1
buffer_depth: 4
cpu_affinity: [2, 3, 4, 5, 8, 9, 10, 11]
sizeof_float: 4
frame_arrival_period: 5.12e-6 * samples_per_data_set
sizeof_int: 4

# For faster CHORD testing, we're using...
sub_integration_ntime: 512
samples_per_data_set: 2048
# sub_integration_ntime: 8192  # ~40 ms for chord
# samples_per_data_set: 8192   # 
num_times: samples_per_data_set
num_polarizations: 2
num_dishes: 64
num_elements: num_polarizations * num_dishes
num_local_freq: 8

#counts matrix size
counts_blocksize: 8
counts_num_blocks_lin: (num_elements / 8) / counts_blocksize
counts_num_blocks: (counts_num_blocks_lin * (counts_num_blocks_lin + 1)) / 2

# vis matrix size
vis_blocksize: 16
vis_num_blocks_lin: num_elements / vis_blocksize
vis_num_blocks: vis_num_blocks_lin * (vis_num_blocks_lin + 1) / 2

# Pool
main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 15 * buffer_depth

# Buffers
host_voltage_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: samples_per_data_set * num_local_freq * num_elements
    metadata_pool: main_pool

host_rfi_RFImask_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: samples_per_data_set * num_local_freq / 8
    metadata_pool: main_pool

host_correlation_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: (samples_per_data_set / sub_integration_ntime) * num_local_freq * vis_num_blocks * vis_blocksize * vis_blocksize * 2 * sizeof_int
    metadata_pool: main_pool

simulated_correlation_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: (samples_per_data_set / sub_integration_ntime) * num_local_freq * vis_num_blocks * vis_blocksize * vis_blocksize * 2 * sizeof_int
    metadata_pool: main_pool

# Ringbuffer signalling buffer
host_voltage_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * samples_per_data_set * num_local_freq * num_elements
    metadata_pool: main_pool

host_rfi_RFImask_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * samples_per_data_set * num_local_freq / 8
    metadata_pool: main_pool

gen_data_voltage:
    type: random_signed_offset
    value: 120
    kotekan_stage: testDataGen
    out_buf: host_voltage_buffer
    name: "E"
    array_shape: [2048, 8, 2, 64]
    dim_name: ["T", "F", "P", "D"]
    num_frames: buffer_depth  # Must be at least what check_data expects

gen_data_rfi_RFImask:
    type: random1x8
    value: 255
    kotekan_stage: testDataGen
    out_buf: host_rfi_RFImask_buffer
    name: "RFImask"
    array_shape: [2, 8, 128]
    dim_name: ["T8hi128", "F", "T8lo128"]
    num_frames: buffer_depth
    meta_time_downsample_factor: 1024  # The number of time samples represented by each coarse time index.

run_send_voltage:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_buffer_in: host_voltage_buffer
        out_buffers:
            host_voltage_ringbuffer_out: host_voltage_ringbuffer
        commands:
            - name: cudaCopyToRingbuffer
              input_size: samples_per_data_set * num_local_freq * num_elements
              ring_buffer_size: buffer_depth * input_size
              in_buf: host_voltage_buffer_in
              signal_buf: host_voltage_ringbuffer_out
              gpu_mem_output: voltage_buffer

run_send_rfi_RFImask:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_rfi_RFImask_buffer_in: host_rfi_RFImask_buffer
        out_buffers:
            host_rfi_RFImask_ringbuffer_out: host_rfi_RFImask_ringbuffer
        commands:
            - name: cudaCopyToRingbuffer
              input_size: samples_per_data_set * num_local_freq / 8
              ring_buffer_size: buffer_depth * samples_per_data_set * num_local_freq / 8
              in_buf: host_rfi_RFImask_buffer_in
              signal_buf: host_rfi_RFImask_ringbuffer_out
              gpu_mem_output: rfi_RFImask_buffer

run_n2k:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_ringbuffer: host_voltage_ringbuffer
            host_rfi_RFImask_ringbuffer: host_rfi_RFImask_ringbuffer
        out_buffers:
            host_correlation: host_correlation_buffer
        commands:
            - name: cudaCorrelator
              n2k_correlation_name: correlation
              voltage_name: voltage
              rfi_RFImask_name: rfi_RFImask
            - name: cudaSyncOutput
            - name: cudaOutputData
              gpu_mem: correlation_buffer
              out_buf: host_correlation

cpu:
    kotekan_stage: gpuSimulateN2kCorr
    network_in_buf: host_voltage_buffer
    rfimask_in_buf: host_rfi_RFImask_buffer
    corr_out_buf: simulated_correlation_buffer

check_data:
    kotekan_stage: testDataCheckInt
    first_buf: host_correlation_buffer
    second_buf: simulated_correlation_buffer
    num_frames_to_test: buffer_depth
    check_metadata: true
