# Metadata
main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 10 * buffer_depth

# Buffers
host_frb2_beam_positions_buffer:
    kotekan_buffer: ndarray
    num_frames: 1
    value_type: float32
    extents: [frb2_num_beams, 2]
    quantity_name: "frb2_beam_positions"
    dimnames: ["R", "X/Y"]
    dimscalings: [1, 1]
    metadata_pool: main_pool

host_frb2_beam_ids_buffer:
    kotekan_buffer: ndarray
    num_frames: 1
    value_type: uint64
    extents: [frb2_num_beams]
    quantity_name: "frb2_beam_ids"
    dimnames: ["R"]
    dimscalings: [1]
    metadata_pool: main_pool

host_frb2_weights_cpu_buffer:
    kotekan_buffer: ndarray
    num_frames: 1
    value_type: float16
    extents: [frb2_num_frequencies, frb2_num_beams, 2 * num_dishes_x, 2 * num_dishes_y]
    quantity_name: "W2"
    dimnames: ["Fbar", "R", "beamQ", "beamP"]
    dimscalings: [1, 1, 1, 1]
    metadata_pool: main_pool

host_frb2_weights_gpu_buffer:
    kotekan_buffer: ndarray
    num_frames: 1
    value_type: float16
    extents: [frb2_num_frequencies, frb2_num_beams, 2 * num_dishes_x, 2 * num_dishes_y]
    quantity_name: "W2"
    dimnames: ["Fbar", "R", "beamQ", "beamP"]
    dimscalings: [1, 1, 1, 1]
    metadata_pool: main_pool

# only used to get coarse frequencies from
host_dummy_voltage_buffer:
    kotekan_buffer: ndarray
    num_frames: 1
    value_type: int4x2_swapped_withoffset
    extents: [1, 1, 1 ]
    quantity_name: "E"
    dimnames: ["F", "T", "E"]
    dimscalings: [1, 1, 1]
    metadata_pool: main_pool

run_set_dummy_voltage:
    kotekan_stage: testDataGen
    type: const_offset
    value: 0x88
    array_shape: [1, 1, 1]
    dim_scaling: [1, 1, 1]
    dim_name: [ "F", "T", "E" ]
    num_local_freq: 4 # len of frequency_channels
    manual_freq_ids: *frequency_channels_list
    out_buf: host_dummy_voltage_buffer

# Stages
run_set_frb_beams:
    kotekan_stage: setFRBBeams
    out_pos_buf: host_frb2_beam_positions_buffer
    out_id_buf: host_frb2_beam_ids_buffer
    mode: grid_degrees
    num_beams: frb2_num_beams
    num_x: frb2_num_beams_x
    num_y: frb2_num_beams_y
    x_min: -0.5
    x_max: 0.5
    y_min: -5.0
    y_max: 5.0

run_calc_frb2_weights_cpu:
    kotekan_stage: calcFRB2Weights
    frb2_beam_positions: host_frb2_beam_positions_buffer
    frb2_weights: host_frb2_weights_cpu_buffer
    num_threads: 4
    metadata: host_dummy_voltage_buffer

run_calc_frb2_weights_gpu:
    kotekan_stage: cudaCalcFRB2Weights
    frb2_beam_positions: host_frb2_beam_positions_buffer
    frb2_weights: host_frb2_weights_gpu_buffer
    metadata: host_dummy_voltage_buffer

run_test_calc_frb2_weights:
    kotekan_stage: testCalcFRB2Weights
    weights_a: host_frb2_weights_cpu_buffer
    weights_b: host_frb2_weights_gpu_buffer
