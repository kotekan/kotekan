---
# Compare the FRB2 beamforming weights calculated on the CPU (calcFRB2Weights) and on the
# GPU (cudaCalcFRB2Weights). The setup is CHIME-like (frb1_swap_MN, a tall dish grid), but
# scaled down so that the CPU stage finishes quickly.

type: config
log_level: info
cpu_affinity: []
num_components: 2
num_polarizations: 2
buffer_depth: 1

# Dishes
num_dishes: 128
num_dishes_x: 4
num_dishes_y: 32

# FRB beamformer setup
frb1_swap_MN: true
frb2_num_beams_x: 4
frb2_num_beams_y: 16
frb2_num_beams: frb2_num_beams_x * frb2_num_beams_y

# Upchannelization schedule: 4 coarse channels, each upchannelized by 8
frequency_channels: &frequency_channels_list [1000, 2000, 3000, 4000]
upchan_factors: [8]
# ranges are [min, max)
upchan_channel_ranges:
    8: [0, 8192]
frb2_num_frequencies: 32

# Telescope
telescope:
    name: CHORDTelescope
    require_gps: false
    require_eop: false
    dish_grid_size_x: num_dishes_x
    dish_grid_size_y: num_dishes_y
    dish_separation_x_m: 6.3
    dish_separation_y_m: 8.5
    dish_inputs:
        - {dish_idx: 0, grid_x_idx: 0, grid_y_idx: 0, feed_pos_disp_m: [0.0, 0.0, 0.0], coelev_disp_deg: 0.0, type: ArrayDish, label: TEST-0000}
        - {dish_idx: 1, grid_x_idx: 0, grid_y_idx: 1, feed_pos_disp_m: [0.0, 0.0, 0.0], coelev_disp_deg: 0.0, type: ArrayDish, label: TEST-0001}
