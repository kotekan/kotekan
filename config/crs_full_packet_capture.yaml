##########################################
#
# crs_packet_capture.yaml
#
# Configuration for capturing packets from the CRS board.
# Set the buffer depth to match the size of the capture
#
# Author: Andre Renard
#
##########################################

---
type: config
# Logging level can be one of:
# OFF, ERROR, WARN, INFO, DEBUG, DEBUG2 (case insensitive)
# Note DEBUG and DEBUG2 require a build with (-DCMAKE_BUILD_TYPE=Debug)
log_level: debug

buffer_depth: 120
packets_per_frame: 65536
packet_size: 6208
num_crs_boards: 1
capture_n_frames: buffer_depth # Total number of frames to capture, 0 = unlimited
numa_node: 0

# Pool
main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 15 * buffer_depth

# Buffers
network_input_buffers:
    log_level: info
    num_frames: buffer_depth
    frame_size: packets_per_frame * packet_size
    metadata_pool: main_pool
    use_hugepages: true
    network_input_buffer_0:
        kotekan_buffer: standard
    network_input_buffer_1:
        kotekan_buffer: standard

cpu_affinity: [2, 3, 8, 9]
dpdk:
    kotekan_stage: dpdkCore
    # Format is index = lcore, value = cpu core
    lcore_cpu_map: [5, 6, 7] # [5,6,7]
    main_lcore_cpu: 4
    num_mbufs: 8192
    mbuf_cache_size: 256
    burst_size: 32
    # List of PCIe addresses to block from DPDK use
    pcie_block_list:
        - "0000:37:00.0"
        - "0000:37:00.1"
        - "0000:b5:00.0"
        - "0000:b5:00.1"
    worker_ring_map:
        - name: worker_ring_0
          num_slots: 128
          socket_id: 0
        - name: worker_ring_1
          num_slots: 128
          socket_id: 0
    # Format is index = lcore, value = array of port IDs
    # so [[0,1],[2,3]] maps lcore 0 to service ports 0 and 1,
    # and lcore 1 to service ports 2 and 3.
    lcore_port_map:
        - [0]
    # One handler must be given per port
    handlers:
        - dpdk_handler: crs1BoardDistributor
          worker_rings: [0, 1]
    # Exactly One worker must be given per worker ring
    workers:
        - dpdk_handler: crs1BoardCaptureWorker
          worker_ring: 0
          out_buf: network_input_buffer_0
        - dpdk_handler: crs1BoardCaptureWorker
          worker_ring: 1
          out_buf: network_input_buffer_1

raw_file_writers:
    ### UPDATE THIS PATH FOR EACH RUN ###
    base_dir: /data/20251127_0325_packetdump
    frames_per_file: 1
    prefix_hostname: false
    include_metadata: false
    #exit_after_n_files: capture_n_frames
    file_ext: raw
    writer_0:
        file_name: crs_0
        #kotekan_stage: rawFileWrite
        in_buf: network_input_buffer_0
    writer_1:
        file_name: crs_1
        #kotekan_stage: rawFileWrite
        in_buf: network_input_buffer_1
