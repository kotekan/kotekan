    # JUDGE ON q, PAIRED, AS A DUTY OVER HOURS -- never on deep_snr / cn0_coh / coh_frac (#66).
    # ⚠️ And judge it from /fleet_trim/get_dll's n_updates, at the LOOP's cadence: the 8 h
