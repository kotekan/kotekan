    dll-combiners: &b2a_cmb "http://cx19:12048/gnss{0..1}_b2a_n2combine,\
http://cx27:12048/gnss{0..1}_b2a_n2combine,http://cx42:12048/gnss{0..1}_b2a_n2combine,\
http://cx43:12048/gnss{0..1}_b2a_n2combine,http://cx44:12048/gnss{0..1}_b2a_n2combine,\
http://cx51:12048/gnss{0..1}_b2a_n2combine"
    n2-combiners: *b2a_cmb

