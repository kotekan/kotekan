        dll-combiners: "http://cx19:12048/gnss{0..1}_l3oc_n2combine,http://cx27:12048/gnss{0..1}_l3oc_n2combine,http://cx42:12048/gnss{0..1}_l3oc_n2combine,http://cx43:12048/gnss{0..1}_l3oc_n2combine,http://cx44:12048/gnss{0..1}_l3oc_n2combine,http://cx51:12048/gnss{0..1}_l3oc_n2combine"

  # -- 1268.52 and 1278.75 MHz, the third band: bds_b3i and gal_e6 --
