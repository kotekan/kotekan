# CHORD GNSS chains -- one broker process, every signal (task #27).
#
#   scripts/gnss/broker_multi.py config/gnss_chains_chord.yaml
#
# Replaces running scripts/gnss/broker_up.sh and scripts/gnss/broker_up_extra.sh e5a side
# by side. Those two chains sit on the SAME 1176.45 MHz carrier through the same feed and
# the same clock; splitting them across processes is what forced the receiver clock through
# a JSON file, fetched the F-engine time anchor twice, parsed BRDC twice, and needed two
# viewer instances. See docs/CHORD_BROKER_REFACTOR.md.
#
# Every key becomes a broker flag: `dll-gain: 0.25` -> `--dll-gain 0.25`, `true` -> a bare
# flag, `false`/null -> omitted. So this file reads as the command lines it replaces, and a
# mistyped key surfaces as argparse's "unrecognized arguments" instead of being ignored.
#
# ⚠️ The per-signal constants are NOT here on purpose. `signal: gps_l5` resolves carrier,
# chip rate, code length, long-code segments+epoch and overlay length from
# lib/stages/gnss/gnssSignal.hpp -- the same descriptors the trackers' replica bank is built
# from. Every one of those constants fails SILENTLY when mistyped, and this file is exactly
# the kind of place a wrong one would live forever.

common:
  # -- the RECEIVER: one telescope, one site, one F-engine ------------------------------
  rest-url: http://cx19:12048      # must name a real NODE; cf06 runs no gnss node itself
  time0-endpoint: telescope/time0_ns
  hops-per-sec: 195312.5           # F-engine record geometry -- not a signal property
  # #104 (2026-08-30): bound sibling clock adoption -- the unbounded path relayed gps's
  # poisoned clock fleet-wide in ~2 s during the #103 outage while JOINT-CLK's 5-chip
  # bound refused the same values. Fresh-local refusals only; stale local (>300 s) adopts.
  # #104 v2 (16:0x): the guard now exempts PRIMED clocks (a 0.00-chip startup placeholder
  # is not a measurement to defend -- v1 refused the sibling's real +149.44 against it and
  # locked both 1176 MHz chains out seedless, 15:51-15:56).
  dr-clock-adopt-max-chips: 5.0
  # #105 FIX 1 (2026-08-31): seeds ride a tau~30 min EMA of the raw clock-bias medians;
  # search hints keep the fast a=0.05 EMA. The shared number was the defect: the fast EMA
  # tracks the +-10 Hz wander of the median of bin-quantized detection sawtooths, and every
  # model-primary seed commanded that wobble into its replica code rate (k*cb ~ 0.08 chips/s)
  # -- the whole gps chain walked ~1 chip off-peak and q-crashed every ~5 min, per-sat
  # staggered snap-backs (the "funny q oscillations"). gal/bds were immune only because they
  # never solve a local bias. Set at common: a no-op on unsolved chains by construction.
  seed-bias-source: slow
  # #99 ROOT FIX (2026-08-29, KV-approved): the previous coordinates (49.32075144444,
  # -119.62081125 -- the array ORIGIN, likely the CHIME reference) sit ~155 m from the
  # dishes' effective phase centre. Solved by LSQ on 6,971 banked overnight integrity
  # residuals: dENU = (+132.0 +-0.3 E, +82.0 +-0.4 N, -5.6 +-0.9 U) m, out-of-sample rms
  # 96.4 -> 17.0 m (82%). 155 m = 5.3 chips = the chronic +-5-chip integrity residuals.
  # SIGN CALIBRATED BY THE APPLIED STEP (14:07): the first application (+132 E, +82 N,
  # from a code-read sign inference) DOUBLED q to (-268, -164) -- the step itself is the
  # commanded-step calibration, and the true mapping is truth = configured + q. The
  # dishes are ~132 m WEST, ~82 m SOUTH of the original reference point (which is
  # therefore probably not the CHIME marker -- site-plan identification pending).
  # The NODE configs' origin_itrs_* stay UNCHANGED on purpose -- that is the array
  # coordinate frame the element offsets are defined against; only the broker's point
  # approximation was wrong. Solve + verify (expect q ~ 0):
  #   SOLVE_LAT=<lat> SOLVE_LON=<lon> fixtures/gap3_position_solve.py <broker log>
  # alt kept (U weakly observed).
  lat: 49.32001414
  lon: -119.62262691
  alt: 545
  mask-deg: 0
  interval: 2
  # ONE PORT FOR EVERY CHAIN (M6). Select with /<chain>/get_status or ?chain=<id>.
  publish-port: 12060

  # -- shared loop settings (identical in both launch scripts today) ---------------------
  almanac: true
  almanac-source: brdc
  dead-reckon: true
  dr-clock-chips: 0.0
  # MEASURED CODE BIASES over the broadcast term (A0b part 2, 2026-08-23). Every chain:
  # the per-satellite spread is real on all three constellations, and for bds_b2a it is the
  # ONLY source there is (TGD_B2ap is B-CNAV2; RINEX 3 has nothing). ⚠️ Zero-mean per
  # constellation by construction -> per-sat only, never a common offset.
  dcb-bias: true
  carrier-from-code: true
  cl-assist: true
  seed-doppler: auto
  dll-gain: 0.25
  carrier-gain: 0.0
  # -- task #33 P3: the per-sat carrier state (rrate rows + receiver f_carrier) ----------
  # SHADOW ON EVERYWHERE (2026-08-13): measurement-only by construction -- with
  # rrate-command off this cannot change a seed or a POST. Every chain feeds so the
  # cross-band combination actually happens: gal_e5a + gal_e5b land each Galileo sat's
  # two carriers (1.0261 apart) on ONE m/s row, which is the point of the state. Watch
  # the JRR[...] log lines: per-sat rrate should be STABLE (the ~600 s plant oscillation
  # was per-sat model error of +-1-6 chips), and E5a/E5b must agree per sat.
  # NOISE PROBES -- the anchor the presence floor is measured against (#49, 2026-08-14).
  # The prototype set these and CHORD never has (default 0), which is why the same gate
  # code behaves differently on the two: fleet_dll builds the presence bar from the
  # tracked population and calls its median "the noise level". With no signal-free rows in
  # that population the median is a SIGNAL level, so the bar sits at the top of the signal
  # distribution -- measured before this change: gps_l5 2/9 satellites present, gal_e5a
  # 1/12, bds_b2a 1/9. A satellite fails the moment it drifts below its peers, i.e. exactly
  # when it needs trimming. 3 probes (deepest below-horizon PRNs, exempt from the
  # below-horizon drop, invisible to every other gate because their sig ~ 0).
  noise-probes: 3
  # ── RESPONSIVENESS (KV: updates "~every time a sat rises or sets") ──────────────────────
  # 900 s was right when a swap moved ONE slot and cost a re-acquisition each time. The
  # whole-map policy posts every needed move in a SINGLE scheduled swap, so the rate limit
  # now bounds how often the fleet crosses a discontinuity, not how fast the map can follow
  # the sky. 120 s tracks a rise or set closely while leaving every moved slot ample time to
  # acquire cold before the next post is even considered.
  prn-reconfig-interval-s: 120
  # ── FLEET-WIDE, 2026-08-28 (KV: "shouldn't we always want these?") ────────────────────
  # Yes. Neither is an experiment: probe-require-slot prevents the probe selector picking
  # PRNs the nodes have no slot for (which drops a chain under 3 reporting probes and into
  # PRESENCE UNANCHORED -- the failure chased all evening), and prn-reconfig keeps the slot
  # map on "3 below the horizon + all above" instead of whatever the config froze. They were
  # per-chain only because they were rolled out chain by chain behind a control.
  #
  # ⚠️ THEY WERE MISSING ON gps_l5 AND NOBODY NOTICED, because there they are NO-OPS: GPS has
  # 32 PRNs and gnss0_inject has 32 slots, so every PRN already holds one and desired_map
  # computes zero moves. A knob that does nothing on the chain you look at most is a knob
  # whose absence is invisible -- which is why it belongs in common rather than being
  # remembered per chain.
  probe-require-slot: true
  prn-reconfig: apply
  # ── THE HORIZON, 2026-08-27 (KV): "treat all sats at el>0 as up." ──────────────────────
  # The 10 deg admit mask was never motivated -- it arrived as a default and was never
  # measured against. It is not a sky property: mask-deg is already 0, so a satellite at
  # +3 deg is UP everywhere else in the broker (ctx.up, seeding, the drop gate) and only
  # the slot map refused it. That gap is where the +4 deg case in prnmap.desired_map's
  # comment lives: too low to admit, too high to be a probe, and holding no slot at all.
  #
  # ⚠️ THIS IS A MEASUREMENT, NOT A CONVENIENCE. KV: "if we have horizon sensitivity, I'd
  # like to know about it." Admitting to 0 puts low sats in slots so the chain can SAY
  # whether they track; a mask hides the answer and then cites its own silence as the
  # reason for the mask. Expect some of them not to lock -- that is the datum.
  #
  # ⚠️ THE PAIR MUST DIFFER (desired_map: "with admit == evict this degenerates to a
  # flapper"). Admit at 0, evict at -2: a satellite crossing the horizon is admitted once
  # and kept through 2 deg of setting, so a sat hovering at the horizon costs ONE cold
  # acquisition, not one per cycle. Capacity is self-reporting -- `unplaced` is logged as
  # "N satellite(s) waiting for a slot" and BeiDou b2a is the tight one at 24 slots.
  prn-reconfig-admit-deg: 0
  prn-reconfig-evict-deg: -2
  # ── ARMED 2026-08-27 15:1x: THE PRIOR GAUGE (#94/S2, KV) ──────────────────────────────
  # The joint filter's common mode was pinned by median(b)=0 over the ACTIVE sats -- a
  # POPULATION statement, so bare clk stepped when the middle element changed and b_i was
  # fleet-relative by construction. Now each b_i carries its own absolute prior
  # b ~ N(0, 2 chips) -- the physical envelope of a per-sat code bias -- Huber R-inflated so
  # a wild bias's weight falls as 1/y^2. Bench: at-event clk step on a satellite drop
  # 0.009 chips vs 1.05 under the median pin; rate masquerade 0.0007 chips/s.
  # COMMON, not per-chain, because the filter is RECEIVER-scoped (one object, five feeders):
  # a chain A/B does not exist for it. The standing in-poll control is the legacy
  # circular-median clock (SEED-OFFSET joint-vs-legacy line), plus every consumer's own
  # 5-chip refusal bound. Pre-registered: fixtures/expectations_20260827_prior_gauge.txt.
  # Revert: delete this line + broker restart.
  joint-gauge: prior
  # TASK #57 step 2: poll the combiners' /get_elements and serve the per-element complex
  # gain (amplitude AND phase per antenna, per instance -- the beam/peel coefficients) on
  # the publisher's /get_elements, with the raw parts archived to NFS for the offline beam
  # map. The node endpoint ships with the NEXT NODE RESTART; until then every poll 404s,
  # which the broker counts and skips (rate-limited log), so this is safe to leave on.
  element-poll: true
  element-archive-dir: /home/kvand/gnss/fixtures/obs
  rrate-state: true
  # #83 Phase 3 step 1 (2026-08-17): the fleet-coherent carrier-rate feed -- KCOH's
  # remaining rate (rate_hz + rate_resid_hz, #57's phase-progression estimator,
  # probe-calibrated) into the joint rrate state, sig-gated, coarse-deweighting like the
  # fine hold. The DR chains' first credible carrier-rate measurement.
  rrate-kcoh-feed: 1
  # ── JOINT GAUGE: a membership change is a change of COORDINATES (2026-08-21) ─────────
  # b_i -= mean(b); clk += mean(b); P through the same map. clk + b_i -- the only thing a
  # consumer reads -- is invariant, mean(b)=0 holds exactly, and NO uncertainty is injected
  # because none was created. Replaces the legacy P[0,0] += 4 per join, which made the
  # clock uncertain and let the next measurement yank it into clk_rate. Benched:
  # bench_mass_birth.py 11-sat birth steps clk +0.011 vs +1.794 chips; bench_gauge_churn.py
  # observable p95 2.77 -> 0.76. Receiver-wide state, so it belongs here, not per-chain.
  # Armed WITH the model-primary feed below -- mass birth is what it protects.
  # Reverted to the known-good baseline alongside the feed disarm (14:19). The gauge fix
  # itself is sound and benched (bench_mass_birth.py / bench_gauge_churn.py) -- it is
  # default-off code, not withdrawn -- but it is unobservable on a healthy state, so it
  # rides with the feed when the rebuild problem above is fixed.
  # ── ATTEMPT 6, ARMED 2026-08-21 22:1x (as attempt 4; rereference rides the birth)
  joint-rereference: true
  # #83 THE AXIS FIX (2026-08-17): dead-reckon time base from the F-engine hop counter.
  # Measured: node hop->utc is PPS-true to 3 us; the wall axis carries ~1.45 ms absolute
  # NTP error drifting ~1 us/min -- the 2(b) transport walk and the flip's 14865-chip
  # slew target, both = that number times 10.23 Mcps.
  dr-fengine-axis: 1
  # #83 2(d) re-validation: ⚠️ ARMED 22:11, FALSIFIED 22:30, DISARMED. The axis fix did
  # NOT make INNOV valid for dr-owned seeds. First flip after arming (PRN 4, 22:30:01):
  # INNOV +2201.31 chips, p95 2198.42, while every unflipped sat in the SAME line read
  # 2.39-2.64. Pre-registered falsification bar was "hundreds/thousands -> disarm", and
  # this is it.
  # WHY, and it is not the old reason: 2201 chips = 215 us, i.e. the SUB-MILLISECOND part
  # of the telemetry lag (integer ms vanish -- 1 ms = one L5 code period). t_now_abs rides
  # the newest pow_hop, which trails the sky by the gather/serve latency (-99.6 ms median,
  # 59 ms IQR measured; a +1.07 s excursion was caught live on gal_e5b at 22:24 by
  # --clock-step-guard-s, with chrony clean). So the dr axis is drift-free but STALE, and
  # its sub-ms residue lands straight in the chip domain of any cross-axis comparison.
  # The exclusion stands; MINNOV remains the referee for dr-owned/flipped sats. Re-arming
  # needs lag COMPENSATION on t_now_abs first, not a flag flip.
  innov-dr-seeds: 0
  # TASK #53: gather the per-channel spectra BY WINDOW INDEX, so every instance sums the
  # SAME records and each reply lands on one phase reference. Without this the per-instance
  # phase is free and the fit absorbs it -- which is #52's defect, not a modelling choice.
  # Nodes on a pre-#53 config are excluded from the gather (and named in the log) rather
  # than mixed in.
  # ⚠️ OFF (2026-08-14, within minutes of turning it on): the aligned gather is correctly
  # constructed and completely unusable as it stands. Live it served 12/12 instances on one
  # window index -- and then dropped EVERY point: "132 re-anchored" is 12 instances x 11
  # PRNs, i.e. 100%, with zero SPEC-FIT lines and 0 archive points where the legacy path
  # was producing both. The rule that drops a PRN whose phi0 accumulator re-anchored
  # MID-window is right in principle and can never pass here, because this broker re-pins
  # the seed essentially every window -- the same trap the carrier loop fell into (see the
  # gps_l5 note above: its continuity gate rejected 100% of measurements because on CHORD
  # THE SEED IS THE REFERENCE and it is refreshed every window).
  # THE REAL FIX IS IN C++, and it is the one we already know how to write: the spectrum
  # accumulator must FOLD the re-pin step out (the PrnCtl::dcyc treatment, in the Doppler
  # domain) instead of flagging it and forcing a drop. Until then the legacy gather is what
  # actually delivers data. #53.
  # ✅ RE-ENABLED 2026-08-14 ~15:2x, after the ROOT was fixed in C++ (5b4f450a3) and the
  # trackers cycled: n_reanchor counted the FOLDED re-pins (reanchored 2/3, whose phase step
  # the assembler removes exactly) instead of only the unfolded reset (1). It was therefore
  # pinned above zero for every PRN in every window, and this gather -- which drops any PRN
  # with n_reanchor > 0 -- discarded 100% of its points. Measured before/after the tracker
  # cycle on cx42: re-anchored fraction 1.00 -> 0.00 on gps_l5/gal_e5a/bds_b2a, 0.01 on
  # gal_e5b (one genuine re-acquisition in 99).
  spectrum-aligned: true
  # #84 THE SPEC-WINDOW PIN (2026-08-17): the aligned gather's common index was min(hi)
  # over ALL addressable instances, and cx19's bench-state n2assemble (frozen buffer, hi
  # never advancing) pinned SPEC-WINDOW at 605351 on all five chains -- 11/12 healthy
  # instances dropped every poll, spec_tau a noise fit over one dead instance (p/f ~1,
  # bit-identical amp/energy). This margin excludes instances trailing the fleet's newest
  # window by more than 8 (healthy lag is a few records, #46) before the min, naming them
  # in the dropped list. Expected on arming: SPEC-WINDOW advances again, 11/12 served,
  # cx19 named as stale; SPEC-FIT p/f rises off ~1; the BSAT feed (min_inst 6, innovation
  # 1.0, clamp 1.0) resumes its designed function -- watch BSAT lines and judge taus
  # against disc before anything new consumes them.
  spectrum-stale-margin: 8
  # TASK #59: the frame-synced telemetry gather. CONNECT ONLY -- this fills the store and logs
  # the TELEM line; it consumes NOTHING and changes no number this broker publishes. Turning
  # the feed on is a separate flag (--telem-coherent), deliberately, so the transport can be
  # watched for a while before anything depends on it.
  #
  # 127.0.0.1, not cf06: the gather binds its broker stream to LOCALHOST (the fleet's frames
  # come in on :11060 from the network; :11061 goes only to the process on this host). Naming
  # cf06 here would resolve to the external address the gather is NOT listening on.
  #
  # ONE reader thread serves all five chains -- the stream carries every chain on one
  # connection and the store is keyed by chain, so a client per chain would decode the same
  # 24 MB/s five times and discard four.
  # ⚠️ THE TRANSPORT COSTS ~5 s PER BROKER CYCLE, AND THE COST IS ON THE WIRE (2026-08-15).
  # A-B-A on all five chains: gather up 16.5 s median, PARKED 11.5 s, up again 17.8 s --
  # 11.5 s is the pre-transport baseline (11.8 s, 2026-08-12). Four of those chains never
  # touch the comb DLL, so this is the transport itself, not task #63's broker-side work.
  # Isolated further by dropping ONLY this subscription while leaving the gather running at
  # full NIC load: NO recovery (17.8-23.6 s), so it is not this process's Python ingest --
  # the nodes' pushes delay the broker's own REST polls to those same nodes. cf06 has ONE
  # 1 GbE (eno8303) carrying 620 Mbps of telemetry, and the senders are frame-synced by
  # design, so they burst together. See task #64: ~65% of every frame is zero-filled PRN
  # rows (max_prn 40 vs 11-14 live).
  telem-gather: 127.0.0.1:11061
  # ⚠️ MATCHED TO THE REST FEED, NOT LEFT AT THE DEFAULT. The combiners serve
  # `record_export: 128` records on /get_records, so 32 windows x 4 records/frame = 128 gives
  # the two feeds the SAME integration length. At the 8-window default the telemetry arm would
  # see a QUARTER of the records and score lower for a reason that has nothing to do with
  # alignment -- an unfair comparison that reads as "the new transport is worse". Change this
  # whenever record_export changes.
  telem-windows: 32
  # -- TASK #63: EVERY CHAIN'S CODE LOOP CLOSES ON THE COMB -------------------------------
  # The discriminator is formed HERE from the per-channel Early/Prompt/Late the #59 transport
  # ships, instead of from powers the trackers built by summing across each instance's own
  # channels. Same arithmetic (coherent over an instance's channels, then POWERS added across
  # instances), moved to the one place that can see the whole band.
  #
  # ⚠️ UNLIKE --telem-coherent, THIS ONE WAS MEASURED FIRST AND IT PASSED -- and it COULD be,
  # because the DLL is reproducible against itself where fleet_coherent is not (r = 0.077,
  # #61). scripts/gnss/comb_dll_ab.py, live, WITH the mandatory poll-vs-poll control:
  #
  #   gps_l5,  20 cycles, 240 paired PRNs
  #     disc  comb - poll  +0.0015 +- 0.0223   CONTROL (poll - poll)  +0.0014 +- 0.0472
  #     q     comb - poll  +0.0081 +- 0.0435   CONTROL                +0.0015 +- 0.0902
  #     presence 10/240 discordant, McNemar chi2 0.10 -- symmetric, churn not bias
  #   gal_e5a, 15 cycles, 210 paired PRNs
  #     disc  +0.0000 +- 0.0320   CONTROL  -0.0021 +- 0.0412
  #
  # The comb arm tracks the polled one MORE CLOSELY THAN THE POLLED ONE TRACKS ITSELF one
  # cycle later. gps_l5 then ran it alone on sky for ~80 min against the other four as a live
  # control, clean (median ddisc +0.001..+0.007, no fallbacks, no errors), so 2026-08-15 it
  # went fleet-wide.
  #
  # ⚠️ THE POLL IS STILL MADE, AND MUST BE. deep_snr / deep_floor / coherence_s and the
  # quadrature fallback come from the combiner's DEEP FOLD, which is not in the comb; they are
  # carried across verbatim (combdll.COH_KEYS). NOTHING tracker-side becomes deletable until
  # that fold also runs here -- the fold is the last consumer of the sum.
  # Watch the COMB-DLL log line: it prints the same paired comparison on the loop's own cycles,
  # so the swap keeps monitoring itself. Per-cycle fallback to the polled discriminator
  # whenever the gather has no windows for a chain.
  telem-dll: true
  # ⚠️ ARMED 2026-08-24. fleet_coherent now reads the GATHERED stream instead of polling
  # /get_records from twelve combiners. ONE ESTIMATOR, the other transport -- the flag only
  # chooses what fills `got`; when a source is passed the endpoint list is emptied and the
  # poll does not run at all.
  #
  # WHY IT IS BETTER, NOT JUST CHEAPER. Frame-synced records are addressed by absolute window
  # index, so all twelve instances contribute THE SAME WINDOWS. The polled arm's records are
  # "whatever accumulated since your last GET" (#53), so no two instances ever summed the same
  # sky and the cross-node combine was partly incoherent by construction.
  #
  # MEASURED, fresh and paired in one session, A-vs-B on the FLEET-COH line
  # (log10 of the fleet deep_snr ratio):
  #   TREATMENT  gathered vs polled   n=474  median +0.106 (+1.06 dB)  IQR 0.288  within2x 68%
  #   CONTROL    polled   vs polled   n=368  median -0.079 (-0.79 dB)  IQR 0.261  within2x 71%
  # Identical scatter, so the gathered feed is no noisier. The control shows the A slot runs
  # -0.79 dB low from POLL ORDER alone (B is polled second and has accumulated more), so the
  # gathered arm sits ~1.85 dB above where a polled A would -- the coherence the addressing
  # was built to buy. n_src median 12 on both arms: it sees the whole fleet.
  #
  # COST REMOVED: 439 ms per chain per cycle of JSON+HTTP, = 2.19 s of the 12.4 s cycle,
  # profiled live and attributed to fleet_coherent's own poll.
  # ⚠️ This does NOT remove fleet_dll's poll (0.53 s of cycle): deep_snr/deep_floor/
  # coherence_s and the quadrature fallback come from the combiner's DEEP FOLD, which is not
  # in the gathered stream. That poll still must be made.
  telem-coherent: true
  # ⚠️ SHADOW (1), NOT ARMED (2) -- 2026-08-23. Takes the comb DLL's per-instance and
  # per-channel taps from the gather's C++ reduction (<fleet-trim-url>/get_taps) instead of
  # rebuilding them here by walking every (window, instance, record, PRN, channel) of the
  # gathered stream: ~140k channel-tuples per chain per cycle, ~700k across the fleet, ~18% of
  # chain CPU by live profile. This process is pinned at 100% of ONE core by the GIL and its
  # CYCLE TIME IS the sum of the five chains' Python CPU, so that 18% is ~2 s of every cycle.
  #
  # The arithmetic is gated offline on IDENTICAL BYTES (scripts/gnss/fleetdll_gate.py:
  # e/p/l/n_chan to 1e-9, n_rec and hop exact, per instance AND per channel). What that gate
  # cannot see is a LIVE mismatch -- chain naming, window depth, instance tags -- which would
  # give two self-consistent answers about different things. Nor can broker_equiv: the gather
  # is a raw socket, not transport, so a replay carries no telemetry at all and falls back to
  # the polled discriminator. Shadow measures exactly that: watch the COMB-TAPS line's
  # |ddisc| / |dq| and its shared-PRN count before setting 2.
  # ⚠️ ARMED (2) 2026-08-23, on this evidence, and revert to 1 or 0 with one line:
  #   OFFLINE, identical bytes: e/p/l/n_chan agree to 1e-9, n_rec and hop EXACT, per instance
  #     AND per channel (fleetdll_gate.py TAPS + SPLIT-RING legs).
  #   LIVE shadow, all five chains: same PRN counts, ALL shared -- so chain naming, instance
  #     tags and window depth line up, which is the thing the offline gate cannot see.
  #   |ddisc| med 0.008-0.051 max 0.080, against the ESTABLISHED COMB-DLL control (the same
  #     estimator sampled two ways) at med -0.008..+0.010 max 0.041-0.091. Same distribution.
  #   And the difference is EXPLAINED: the C++ serves the gather's live ring while the Python
  #     arm averages the broker's ring as of its cycle start -- measured 772 records = 8.1 s
  #     apart. The C++ arm is FRESHER, which is the direction the code loop wants.
  # A failed GET falls back to the polled discriminator, as a failed comb always has.
  comb-taps-cpp: 2
  # rrate-command: true  -- P3 step 3, closes the carrier loop: carrier_correction_hz()
  # posted as carrier_trim_hz, REPLACING the trim loop (one controller, one state -- the
  # #52 fix). ⚠️ ENABLE PER CHAIN, HALF THE FLEET AT A TIME, so each arm has a same-poll
  # control: gal_e5a commanded vs bds_b2a open on the SAME carrier is the clean pair.
  # A before/after across restarts cannot resolve it -- the sky churns faster.
  code-bias-alpha: 0.05
  code-bias-min-sats: 2
  fit-gap-s: 3600
  # ARMED 2026-08-28 (#96), 0 -> 30. The cp-rate fit is the ONLY estimator here with no SNR
