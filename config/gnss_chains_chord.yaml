  # -- 1202.025 MHz: glo_l3oc --
  # GLONASS L3OC-p, the dataless pilot of GLONASS's CDMA signal (10230 chips at 10.23 Mcps with
  # the shared NH10, the B2b/B3I geometry), on the GLONASS-K generations and the modernised
  # M+ only. A fourth constellation at a carrier of its own: a GLONASS ray observed here alone
  # cannot separate tau_band from b_sat, so judge this chain on lock and presence. Like bds_b2b
  # it is model-primary with no detectors (the search runs on GPS L5 only) and carries bds_b2b's
  # key set; dataless, so coherent integration is the full 10 ms code with no nav-bit wipe.
  # The clock it adopts is GPS time; the GLONASS code epoch is UTC(SU)+3h, 18 s and 3 h behind
  # and ahead, both whole multiples of the 10 ms code, so only the sub-microsecond GLONASS-GPS
  # system offset remains, a chain-wide bias inside the spectrum fit's capture. The orbit model
  # is the ICD's integrated state vector, meant for +-15 min about a record's tb: against the
  # next record it errs 5 m line-of-sight at 1 h and 18 m (0.6 chip; p90 1.5 chips) at 2 h, so
  # the hourly BRDC merge's 35-95 min record age sits inside the spectrum fit's +-1.6 chips.
  # The daily file never covers today for R, so with the hourly supply down this chain drifts.
    glo_l3oc:
