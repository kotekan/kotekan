    joint-consume: clk,rate
    # #49 ARMED 2026-08-15 21:15Z -- see gal_e5b's note. All five chains now run the C++ code
    # loop; nothing is left on the 11.5 s Python cycle, which never had the authority to hold
    # a lock (0.0054 chips/s against a plant that moves at ~0.43).
    # ⚠️ This chain is also #48's open question ("why is b2b blind at all times?"). It had the
    # SMALLEST |disc| of the five (median 0.25, 0/12 railed) while tracking nothing -- small
    # disc with no peak is what NOISE looks like, not what on-peak looks like, so do not read
    # an improvement here as the loop working. Judge it on q, and on whether p_pow leaves the
    # noise floor at all.
    # ⚠️ DISARMED 2026-08-16 01:45 -- ARMING THIS REMOVED THE PULL-IN PATH AND KILLED THE
    # CHAIN. Setting fleet-trim-url makes the broker SKIP the Python slow trim entirely
    # (`if not args.fleet_trim_url:` in gps_distributed_broker.py), and the C++ fleet loop
    # only trims PRNs that are ARMED, i.e. that already passed presence. This chain has NO
    # detectors -- it is dead-reckon only -- so the slow trim was its ONLY route from
    # off-peak to on-peak. With both gone it observed 0 armed PRNs and no code loop at all.
    # gps_l5 survives the same config because its SEARCH re-acquires independently and hands
    # presence to the C++ loop; these four chains have nothing that can do that.
    # ⚠️ RE-ARM ONLY WITH A HANDOVER: the Python trim must keep running for NOT-YET-ARMED
    # PRNs (acquisition authority) and stand down once the C++ loop takes a PRN. Arming
    # without that is #49's latch made absolute.
    # ── ARMED 2026-08-23 ~11:3x AS THE B2a-OFFSET DISCRIMINATOR ─────────────────────
    # b2a (1176.45) carries a PERSISTENT +1.2 +- 0.4 chip common trim over 8.5 h while
    # gal_e5a/e5b (same band / same clock / same DR path) read ~0 and gps_l5 +0.005.
    # Ruled out with numbers: the clock (paired +0.001; trim-vs-clk regression r<0.33 at
    # all lags to 900 s), BDT (seconds), broadcast TGD (absent), MGEX DCB (+0.066), the
    # TRUE broadcast TGD_B2ap from RINEX 4 B-CNAV2 (+0.031 common over our birds).
    # Remaining suspects split exactly on THIS chain: a BDS model-path term follows the
    # CONSTELLATION (b2b would read ~+1.2); a B2a replica/code-phase convention follows
    # the SIGNAL (b2b would read ~0, like Galileo). The offline e2e closure is currently
    # non-discriminating (verdict 5.212 chips for BOTH _CS signals at ANY --dop -- a gate
    # that cannot fail; rebuild before trusting it).
    # ⚠️ This spends b2b's unarmed-control role from the 08-22 code-loop arming -- that
    # experiment concluded (locks 1->5, rails cleared, verdict banked), so the control's
    # residual value is smaller than this discriminator.
    fleet-trim-url: "http://127.0.0.1:12051/fleet_trim"
    fleet-trim-bandwidth: 2.5
    fleet-trim-readback: 1
    trackers: "http://cx19:12048/gnss{0..1}_b2b_inject,\
http://cx27:12048/gnss{0..1}_b2b_inject,\
http://cx42:12048/gnss{0..1}_b2b_inject,\
