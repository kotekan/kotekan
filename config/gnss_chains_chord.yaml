        dll-combiners: &b2a_cmb "http://cx19:12048/gnss{0..1}_b2a_n2combine,http://cx27:12048/gnss{0..1}_b2a_n2combine,http://cx42:12048/gnss{0..1}_b2a_n2combine,http://cx43:12048/gnss{0..1}_b2a_n2combine,http://cx44:12048/gnss{0..1}_b2a_n2combine,http://cx51:12048/gnss{0..1}_b2a_n2combine"

  # -- 1207.14 MHz, the second band: gal_e5b and bds_b2b --
  # Galileo E5b-Q, the E5b pilot. Like E5a-Q it carries a per-PRN CS100 secondary, so it is
  # model-primary with no detectors for gal_e5a's reason; being dataless, its trackers despread
