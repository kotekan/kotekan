  # -- 1227.60 MHz: gps_l2c --
  # GPS L2C CM, broadcast by every gps_l5 satellite and by Block IIR-M: a second GPS carrier,
  # a same-constellation equation for tau_band. CM and CL interleave chip by chip (comb_mult 2,
  # a 1.023 Mcps combined stream); code phases here are in CM chips (511.5 kcps, 10230 chips
  # per 20 ms). CM rather than CL: CM's 20 ms period fits the record geometry the fleet runs,
  # CL's 1.5 s does not. Model-primary with no detectors, like the chains above.
  # The generator's covering band (config/chord_band_plan.py: the CM chip rate plus Doppler
  # either side) is six freq_ids, 6283-6288, fewer than the 8-id comb stride, so a node holds
  # at most one, on one GPU. The fleet loop combines the instances that report, so sensitivity
  # is fleet-wide, and a PRN an instance never despreads is skipped by the combine.
    gps_l2c:
        signal: gps_l2c
    # As gps_l5's gate, cut for L2C (Block IIR-M and later): the PRNs it excludes are neither
    # predicted nor seeded, and the PRN map refuses them a slot from `signal` alone. The startup
    # line "signal-capability gps_l2c: N PRN(s) excluded by the IGS registry (...)" lists them.
        signal-capability: gps_l2c
    # gps_l5's clock is known only mod its 1 ms code, shorter than CM's 20 ms period, so the
    # adoption also takes the clock mod 20 ms from gps_l5's NH joint fit (nh-joint); without a
    # record under an hour old the clock stays primed.
        dr-clock-adopt: true
    # The phase ships in CM chips; the node's propagate_seed scales it by comb_mult.
        seed-phase-transport: true
    # E/L tap offset from prompt, in CM chips (the default 0.5 suits the chip-narrow chains).
    # Each L2C instance despreads one channel of width B = 195.3 kHz, and the fleet loop sums
    # the five contiguous channels coherently: a 5-channel Dirichlet whose first null is
    # 1/(5B) = 0.52 CM chips, not the single channel's |sinc|^2 null at 2.6. Taps beyond it sit
    # on sidelobes, where the discriminator reverses sign and the loop false-locks off peak.
    # Must match the node taps (config/gen_chord_gnss_config.py dll_spacing_chips); when
    # changing both, cycle the nodes before the broker so the taps lead the law. Re-derive both
    # if the count of contiguous channels changes (another node, or a wider covering band).
        dll-spacing: 0.4
        presence-admit-displaced: true
        joint-consume: clk,rate
        fleet-trim-url: "http://127.0.0.1:12051/fleet_trim"
        fleet-trim-bandwidth: 2.5
        fleet-trim-readback: 1
    # Enumerated, not gnss{0..1} on every node: the chain exists only on a GPU that holds an L2C
    # channel, and the pattern would 404 on the rest. freq_id % 16 picks the GPU
    # (gpu_offsets_mod16 in config/chord_gnss_node.yaml): 6286 cx19/1, 6284 cx42/1, 6287
    # cx43/1, 6285 cx51/1, 6288 cx27/0. 6283 is on cx47, outside this fleet, and cx44 holds
    # none. Re-derive the list if the comb offsets change.
        trackers: "http://cx19:12048/gnss1_l2c_inject,http://cx27:12048/gnss0_l2c_inject,http://cx42:12048/gnss1_l2c_inject,http://cx43:12048/gnss1_l2c_inject,http://cx51:12048/gnss1_l2c_inject"
        combiner: gnss1_l2c_n2combine # a bare name on rest-url (cx19), whose L2C GPU is 1
        spectrum-endpoints: "http://cx19:12048/gnss1_l2c_n2assemble,http://cx27:12048/gnss0_l2c_n2assemble,http://cx42:12048/gnss1_l2c_n2assemble,http://cx43:12048/gnss1_l2c_n2assemble,http://cx51:12048/gnss1_l2c_n2assemble"
        dll-combiners: "http://cx19:12048/gnss1_l2c_n2combine,http://cx27:12048/gnss0_l2c_n2combine,http://cx42:12048/gnss1_l2c_n2combine,http://cx43:12048/gnss1_l2c_n2combine,http://cx51:12048/gnss1_l2c_n2combine"

  # -- 1248.06 MHz: glo_l2oc --
  # GLONASS L2OC-p, the CDMA pilot on L2, broadcast by the K generations only (GLO-K1B, K1+, K2;
  # the M+ slots carry L3OC alone): a second GLONASS carrier, so tau_band and TEC for the K
  # satellites against glo_l3oc. BOC(1,1) under a data/pilot TDM, carried in the code table at
  # 2.046 Mcps (half its chips zero), so code phases here are 2.046 Mcps chips (146.5 m). The
  # tracker code bakes the shared 50-chip OC2 into one 1 s code (GLO_L2OC_P_OC): a 10.49 ms record
  # straddles a 20 ms period about half the time and OC2 flips at 24 of its 50 boundaries, so
  # with the bare code a record could cancel and successive records decorrelate. The ICD starts
  # each OC2 period on a second mark; GLONASS and GPS seconds coincide (both are whole seconds
  # from UTC), so the broker places the segment from absolute time, which must be good to
  # +-10 ms. The clock is kept mod the 20 ms primary, as gps_l2c's is. Model-primary with no
  # detectors, like the chains above.
  # The lobe, 1246.0-1250.1 MHz (freq_ids 6380-6401), gives every GPU one or two channels; the
  # power sits at +-0.8 MHz with a null at the carrier, and the six nodes hold 17 of the 22
  # channels (~60% of the power; 6385, 6387, 6393, 6395 and 6401 are on cx47 and cx52). The fleet
  # loop sums the instances coherently, as on L2C, so sensitivity is fleet-wide.
    glo_l2oc:
        signal: glo_l2oc
    # The K generations only, from the registry's block types (prnmap: L3OC rides K and M+, the
    # other OC signals K alone). The startup line "signal-capability glo_l2oc: N PRN(s)
    # excluded by the IGS registry (...)" lists the slots it drops.
        signal-capability: glo_l2oc
    # The noise probes are DARK satellites: the six GLO-M+ slots, with ephemeris but no L2OC,
    # signal-free at any elevation (the manifest gives them slots). Six live K satellites
    # leave fewer than the 3 probes presence needs below -15 deg about a third of the day,
    # when the chain would read UNANCHORED; the M+ slots never set.
        probe-dark: true
    # gps_l5's clock is known only mod 1 ms, shorter than the 20 ms primary, so the adoption
    # also takes the clock mod 20 ms from gps_l5's NH joint fit, as gps_l2c does; without a
    # record under an hour old the clock stays primed.
        dr-clock-adopt: true
        seed-phase-transport: true
    # E/L tap offset from prompt, in 2.046 Mcps chips. On the fleet's 17-channel BOC sum, at 0.4,
    # q on peak is 4.4 (the lock bars' 2.2 reads as on a BPSK chain at 0.5), the S-curve is
    # linear to +-0.23 chip and keeps its sign to +-0.91, outside which the BOC side peaks
    # (+-1.05) are stable false locks. Must match the node taps (config/gen_chord_gnss_config.py
    # dll_spacing_chips); when changing both, cycle the nodes before the broker. Re-derive if the
    # node set changes.
        dll-spacing: 0.4
        presence-admit-displaced: true
        joint-consume: clk,rate
        fleet-trim-url: "http://127.0.0.1:12051/fleet_trim"
    # The S-curve's slope at 0.4 is 1.8x what the trim law assumes (it scales a triangle's), so
    # 1.4 here is the other chains' 2.5 in closed-loop terms. At 2.5 this chain's loop would run
    # at ~4.5/s, past the round-trip stability bound (cli.py --fleet-trim-bandwidth).
        fleet-trim-bandwidth: 1.4
        fleet-trim-readback: 1
    # Every GPU holds a channel of the lobe, so the {0..1} pattern serves. The combiner is
    # cx19 GPU 0 (6388, ~6% of the power); its GPU 1 holds the near-empty lobe edges.
        trackers: "http://cx19:12048/gnss{0..1}_l2oc_inject,http://cx27:12048/gnss{0..1}_l2oc_inject,http://cx42:12048/gnss{0..1}_l2oc_inject,http://cx43:12048/gnss{0..1}_l2oc_inject,http://cx44:12048/gnss{0..1}_l2oc_inject,http://cx51:12048/gnss{0..1}_l2oc_inject"
        combiner: gnss0_l2oc_n2combine
    # No phase-slope fit (null overrides common's gps_l5 endpoints, which would otherwise be
    # inherited): only the five two-channel instances (16 ids apart) would inform it, its free
    # phase per instance leaves tau ambiguous by 0.65 chip, and its taus would feed b_sat as soon
    # as a sixth such instance exists (SatBiasFilter min_inst 6), past the DLL's +-0.9-chip
    # capture. L2C's fit returns nothing (one channel per instance).
        spectrum-endpoints: null
        dll-combiners: "http://cx19:12048/gnss{0..1}_l2oc_n2combine,http://cx27:12048/gnss{0..1}_l2oc_n2combine,http://cx42:12048/gnss{0..1}_l2oc_n2combine,http://cx43:12048/gnss{0..1}_l2oc_n2combine,http://cx44:12048/gnss{0..1}_l2oc_n2combine,http://cx51:12048/gnss{0..1}_l2oc_n2combine"
