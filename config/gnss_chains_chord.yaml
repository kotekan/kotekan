        rrate-cmd-min-sig: 100
        rrate-command: true
        carrier-max-hz: 10.0
        rrate-feed-applied: 0
        presence-admit-displaced: true
        trackers: "http://cx19:12048/gnss{0..1}_e5b_inject,http://cx27:12048/gnss{0..1}_e5b_inject,http://cx42:12048/gnss{0..1}_e5b_inject,http://cx43:12048/gnss{0..1}_e5b_inject,http://cx44:12048/gnss{0..1}_e5b_inject,http://cx51:12048/gnss{0..1}_e5b_inject"
