  # -- 1207.14 MHz, the SECOND BAND (2026-08-09) -------------------------------------
  # Same machinery as its 1176.45 MHz sibling above; the ONLY thing that differs is the
  # carrier, which is the entire point. Until these chains existed the instrument was
  # single-band, so `tau_band` (a declared state of the joint solve) had nothing to
  # measure it with, and a per-satellite bias could not be told apart from a per-BAND
  # instrumental delay. Same satellites, same rays, different carrier: the difference IS
  # the discriminator.
  # B2b-I is the PPP-B2b DATA channel: secondary_length = 0, no overlay at all (B-CNAV3
  # runs 1000 sps = exactly one symbol per 1 ms code period). That makes it the most
  # SEARCHABLE signal in the descriptor set -- there is no per-PRN CS to hunt, which is
  # precisely what makes E5a-Q/B2a-P structurally un-searchable -- and so the natural
  # first candidate for a searcher that is not GPS.
  # ⚠️ BUT IT IS DATA-ONLY: coherent integration past 1 ms needs nav-bit wipe, which
  # cudaGnssChordTrack does not have (task #31). Expect it to TRACK with modest deep until
  # that lands. It is here for the BAND, not yet for the sensitivity -- judge it on
  # tau/lock, not on deep_snr, and do not "fix" a low deep that is simply this.
  bds_b2b:
    # #83 2(b) ENABLED 2026-08-17 ~03:40 (audit sec4.6 fixed first, 5e4b93a17: the
    # trim now rides code_phase_at_ref_chips too, so a phase-preferring seed keeps
    # its code loop). DR/slew seeds now ship the PHASE at ref_hop; propagate_seed
    # prefers it and it carries NO t_abs back-reference -- this kills the ~5600
    # chips/Hz clock lever (root #2 churn: fleet clock wobble x lever = the INEXACT
    # large-step class in SEEDAUDIT). Judge on: SEEDAUDIT step census, INNOV p95,
    # q duty. Revert: delete this line on the affected chain + broker restart.
    # ⚠️ 2(b) REVERTED ON THIS CHAIN 08-17 ~04:00 after 11 min on sky: the C++ trims
    # climbed COMMON-SIGNED at ~0.6 chips/min toward the 3.0 clamp (gal_e5a 9/21/23/31
    # at +2.3-2.7 and rising; pre-flip they sat settled sub-1.3 mixed-sign), discs
    # one-signed -- the DR model WALKS under phase transport. ~0.6 chips/min = 0.009
    # ppm = the adopted (l-a) code-clock rate: suspected DOUBLE-COUNT (the clock in
    # the transported phase AND in code_phase_rate). gps_l5 keeps the flag (healthy,
    # search-backed). Investigate cp_predicted-vs-code_phase_rate accounting before
    # re-arming here.
# ✅ RE-ARMED 2026-08-17 ~15:05: the walk was the WALL-AXIS NTP DRIFT (the axis fix,
