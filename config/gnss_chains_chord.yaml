  gps_l2c:
    # ── THE FOURTH CARRIER: GPS L2C @ 1227.6 MHz (2026-08-31) ────────────────────────────
    # ⚠️ UNPARKED BY CORRECTING AN ERROR OF MINE, NOT BY NEW HARDWARE. L2C sat parked on the
    # verdict "0-1 covering channels per node", which is true and IRRELEVANT: fleet_dll sums
    # RAW POWERS across every instance reporting a window and forms ONE discriminator, so
    # sensitivity is fleet-wide. The number that matters is the fraction of the MAINLOBE the
    # fleet captures, and L2C's is only 6 freq_ids (6283-6288) because the signal is
    # narrowband. Five land on distinct instances -> ~83% captured, against L5's ~80%.
    # cx44 owns none and just does not report; a PRN an instance never despreads is skipped
    # by the combine, not blocked by it.
    #
    # ⚠️ FIRST TIME-MULTIPLEXED CHAIN. CM and CL interleave chip by chip, so comb_mult == 2
    # and the combined stream runs at TWICE the component rate. That found a real bug in
    # propagate_seed (phase advanced at the COMPONENT rate, then reduced as a COMBINED phase
    # -- identically zero for every comb_mult 1 signal we had ever flown, -4.167 chips/record
    # at 1000 Hz here). Fixed a5bb46bc0; e2e at the true carrier closes 0.000 at every record.
    # NOT the chip rate: E6-C at 5.115 Mcps reads 0.000 on the same invocation, which is the
    # control that kept this out of the morning's chips-are-a-unit trap.
    #
    # CM, not CL: 10230 chips / 20 ms fits the record geometry the fleet already runs; CL's
    # 767250 / 1.5 s is a different regime and gets its own bring-up. 28 capable PRNs from the
    # IGS registry (L2C is IIR-M and newer) -- MORE than gps_l5's 21.
    #
    # SAME satellites as gps_l5 at a DIFFERENT carrier, so the cross-band clock bootstrap runs
    # the rate conversion that this morning's gal_e6 root cause installed (511.5 kcps adopting
    # a 10.23 Mcps donor is exactly the case clock_chips_convert exists for). The settled DLL
    # residual against that bootstrap is tau_band(1227.6 vs 1176.45) -- a FOURTH equation, and
    # the first from a same-constellation pair.
    signal: gps_l2c
    dr-clock-adopt: true
    # REQUIRES THE propagate_seed comb_mult FIX (gnssSeedTransport.cpp 2fe49e77f, 2026-09-02) IN
    # THE NODE BINARY. Before it, nodes read code_phase_at_ref_chips as COMBINED chips while the
    # broker ships CM chips -- on a comb_mult-2 signal that put every L2C replica ~phase/2 mod
    # 10230 chips (milliseconds) from the sky, which is why this chain never locked. Running
    # with `false` (argument path only, which converted correctly on the old binary) gave the
    # first L2C locks at 15:28 UTC that day; flipped back to true for the restart that carries
    # the fix (the phase path is the better-conditioned one). If L2C goes dark after a restart
    # onto an OLDER binary, this flag is the first suspect.
    seed-phase-transport: true
    # E/L TAP OFFSET, CM chips: MUST MATCH the node's dll_spacing (config/gen_chord_gnss_config.py
    # dll_spacing_chips). Every L2C instance despreads ONE 195 kHz channel (the mainlobe is
    # narrower than the comb stride), so the correlation is |sinc|^2 with its null at 2.6 CM
    # chips; at the 0.5 default E and L sit 90% up the peak and q = 2P/(E+L) is PEGGED at 1.11
    # for a perfect lock -- which is what every q-gated instrument (fast-loop 2.2 gate, presence,
    # viewer) showed through the first locks. 2.0 chips: q on peak 6.7, discriminator slope
    # 1.10/chip (the shipped tau law assumes 1.0), monotonic to +-2 chips, jitter equal to 1.25.
    dll-spacing: 2.0
    presence-admit-displaced: true
    joint-consume: clk,rate
    fleet-trim-url: "http://127.0.0.1:12051/fleet_trim"
    fleet-trim-bandwidth: 2.5
    fleet-trim-readback: 1
    # ⚠️ ENUMERATED, NOT gnss{0..1} ON EVERY NODE. L2C's mainlobe is SIX freq_ids, so exactly
    # ONE GPU per node owns a covering channel and cx44 owns none -- the blanket pattern every
    # other chain uses produced 7 x "set_seeds ... 404 NOT_FOUND" per cycle here. The instance
    # per node is a BAND-PLAN FACT (freq_id % 16 -> gpu), not a preference: cx19/1 6284,
    # cx27/0 6288, cx42/1 6285, cx43/1 6286, cx51/1 6287. If the comb offsets ever change,
    # regenerate and re-read these from the node endpoints rather than guessing.
    trackers: "http://cx19:12048/gnss1_l2c_inject,\
http://cx27:12048/gnss0_l2c_inject,\
http://cx42:12048/gnss1_l2c_inject,\
http://cx43:12048/gnss1_l2c_inject,\
http://cx51:12048/gnss1_l2c_inject"
    combiner: gnss1_l2c_n2combine   # cx19/cx42/cx43/cx51 are gpu1; cx27 is gpu0
    spectrum-endpoints: "http://cx19:12048/gnss1_l2c_n2assemble,\
http://cx27:12048/gnss0_l2c_n2assemble,\
http://cx42:12048/gnss1_l2c_n2assemble,\
http://cx43:12048/gnss1_l2c_n2assemble,\
http://cx51:12048/gnss1_l2c_n2assemble"
    dll-combiners: "http://cx19:12048/gnss1_l2c_n2combine,\
http://cx27:12048/gnss0_l2c_n2combine,\
http://cx42:12048/gnss1_l2c_n2combine,\
http://cx43:12048/gnss1_l2c_n2combine,\
http://cx51:12048/gnss1_l2c_n2combine"
