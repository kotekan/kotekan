    # 2026-08-15, LATER: the Python fast trim is RETIRED on this chain and the loop has moved
    # to C++ (F1-F3 of #51, docs/CHORD_FAST_TRIM.md). It achieved ~3.1 Hz against the 1.94 Hz
    # break-even -- 1.6x, and only after an armed-PRN filter lifted it off 1.5 Hz, which is
