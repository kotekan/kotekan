    # Same satellite, same sky, differing only in loop bandwidth. That is the pairing that
    # defeats [[the sky moves faster than the investigation]], and it is worth more than any
    # duty-over-hours on this question -- so the remaining control is spent here rather than
    # held to re-measure a loop already known to be ~1100x too slow (KV's call, and correct:
    # a control group is for a question still open).
    #
    # ⚠️ THE E28 PLOT IS NOW THE RECORD. With all five chains armed there is no unarmed arm
    # left to re-run this against; re-creating it means deliberately disarming a chain.
    #
    # #33 GETS CLEANER, not worse. The carrier command is untouched by this -- still ON for
    # gal_e5a only, OFF here and on bds_b2a/bds_b2b. With every chain now code-armed, that
    # comparison differs in the carrier command ALONE, which is what it was always meant to
    # isolate. (Between 20:32Z and now it was briefly confounded; see gal_e5a's note.)
    # ⚠️ DISARMED 2026-08-16 01:45 -- ARMING THIS REMOVED THE PULL-IN PATH AND KILLED THE
    # CHAIN. Setting fleet-trim-url makes the broker SKIP the Python slow trim entirely
    # (`if not args.fleet_trim_url:` in gps_distributed_broker.py), and the C++ fleet loop
    # only trims PRNs that are ARMED, i.e. that already passed presence. This chain has NO
    # detectors -- it is dead-reckon only -- so the slow trim was its ONLY route from
    # off-peak to on-peak. With both gone it observed 0 armed PRNs and no code loop at all.
    # gps_l5 survives the same config because its SEARCH re-acquires independently and hands
    # presence to the C++ loop; these four chains have nothing that can do that.
    # ⚠️ RE-ARM ONLY WITH A HANDOVER: the Python trim must keep running for NOT-YET-ARMED
    # PRNs (acquisition authority) and stand down once the C++ loop takes a PRN. Arming
    # without that is #49's latch made absolute.
    # fleet-trim-url: "http://127.0.0.1:12051/fleet_trim"
    # fleet-trim-bandwidth: 2.5
    # ── BASELINE PARITY WITH gal_e5a (2026-08-21 12:5x, KV) ─────────────────────────────
    # "If we want to use E5b as a control we need to update which vector bits it consumes
    # to match E5a" -- until now e5b had NO code loop at all, so it read as "not good"
    # rather than as a control. This is also R7/#49, verdict already paid for (0.81 vs
    # 0.42 |disc| duty, paired), and its old blocker is gone: the Python->C++ trim
    # handover is per-PRN since eec1d2f12, so fleet-trim-url no longer silences the slow
    # integrator chain-wide and strands a dead-reckon chain with no code loop at all.
    # MATCHED to e5a: fleet code loop, joint CLOCK consumer, deep-gate opt-in, and the
    # command-safety gates (inert here -- nothing commands on this chain).
    # DELIBERATELY NOT MATCHED: rrate-command -- that is the variable under test on e5a.
    # ⚠️ REMAINING ASYMMETRY, on purpose: e5b keeps rrate-phase-feed TRUE (arm 15) while
    # e5a has it FALSE, because a fine feed under a MOVING command is what broke arm 13.
    # Rows are shared per (tag, prn), so e5b's fine feed is what makes e5a's rows quiet --
    # symmetry there would cost the precision the pair exists to exploit. Any carrier A/B
    # across this pair must account for it.
    fleet-trim-url: "http://127.0.0.1:12051/fleet_trim"
    fleet-trim-bandwidth: 2.5
