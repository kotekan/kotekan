---
# CHORD GNSS chains: one broker process runs every signal.
#
#   scripts/gnss/broker_multi.py config/gnss_chains_chord.yaml [--list] [extra broker flags]
#
# Each chain runs with `common:` overlaid by its own block, and every key becomes a broker flag
# (python/scripts/gnss/gnss_broker/cli.py): `dll-gain: 0.25` -> `--dll-gain 0.25`, `true` -> a
# bare flag, `false`/null -> omitted. A mistyped key fails at startup as argparse's
# "unrecognized arguments". --list prints each chain's resolved flags.
#
# Production runs this as gnss-broker.service. gnss-stack.target (scripts/gnss/site/systemd/)
# starts one gnss-obs@<chain> writer per chain and must list the same chains as this file.
#
# The per-signal constants are not here: `signal: gps_l5` resolves carrier, chip rate, code
# length, long-code segments and epoch, and overlay length from lib/stages/gnss/gnssSignal.hpp,
# the descriptors the trackers' replica bank is built from. A mistyped constant fails silently,
# so none is restated here.

common:
  # -- the receiver: one telescope, one site, one F-engine --
    rest-url: http://cx19:12048    # a gnss node: base for bare stage names and time0-endpoint
    time0-endpoint: telescope/time0_ns
    hops-per-sec: 195312.5         # F-engine record geometry, not a signal property
  # The dishes are tipped for site work (2026-10-17 until the realignment): there is no
  # boresight, so the D3 transit veto, the dead-reckon transit freeze and the assemblers'
  # model-formation freeze stay off. Delete this line and restart the broker at the realignment.
    boresight: none
  # Every ~30 s each chain posts its constellation's az/el (with rates) to its record
  # assemblers' /set_sat_geometry for the per-element steering. The generator arms steering on
  # every assembler; one without it replies {"steering":"off"}.
    post-sat-geometry: 1
  # Bound on adopting a sibling chain's receiver clock: a step of more than 5 chips from the
  # local clock is refused while that clock is fresh (taken from a source, or confirmed by
  # JOINT-CLK, within 300 s). A stale local clock adopts anyway, a primed placeholder clock is
  # not defended, and a step the sibling declares (a new clock epoch) is adopted at any size.
  # Across bands the bound is 5 of the donor's chips, converted as a time. JOINT-CLK applies
  # the same 5-chip bound.
    dr-clock-adopt-max-chips: 5.0
  # Seeds ride 0 Hz of clock-frequency bias; the search hints keep the solved bias. The F-engine
  # LO is locked to the site reference, so the solved bias is estimator noise, and with no
  # carrier loop a seeded bias becomes every satellite's residual carrier. A no-op on chains
  # without detections, which never solve a bias.
    seed-bias-source: zero
  # The dishes' effective phase centre, ~155 m (~5 L5 chips) from the array origin. The node
  # configs' origin_itrs_* stay at the array origin: that is the frame the element offsets are
  # defined in. scripts/gnss/viscap_metadata.py and the stack's GNSS_SITE_LL (obs writers,
  # viewer) carry the same numbers. alt is the ELLIPSOIDAL height (what the ECEF conversion
  # takes): 545 m above sea level less the EGM2008 geoid undulation at the site (-16.55 m); lat
  # moved 3.3 m south on the 2026-10-18 night re-survey (step 0b, scripts/gnss/gnss_resurvey.py).
    lat: 49.3199845
    lon: -119.62262691
    alt: 528.4
    mask-deg: 0
    interval: 2
  # One publisher serves every chain (broker_multi.py takes the first publish-port); select a
  # chain with /<chain>/get_status or ?chain=<id>.
    publish-port: 12060

  # -- loop settings shared by every chain --
    almanac: true
    dead-reckon: true
    dr-clock-chips: 0.0
  # MGEX measured code biases replace the broadcast TGD/BGD per satellite where the product
  # covers the signal; for bds_b2a they are the only source (TGD_B2ap is a B-CNAV2 parameter
  # that RINEX 3 does not carry). Zero-mean per constellation, so they correct the
  # per-satellite spread, never a common offset.
    dcb-bias: true
  # The 3 deepest PRNs below -15 deg stay seeded as noise probes, giving signal-free rows. They
  # are the presence gate's noise reference: its q floor needs >= 3 probes and its prompt-power
  # floor >= 2. With fewer, the chain reports UNANCHORED and no satellite counts as present.
    noise-probes: 3
  # -- the nodes' slot->PRN map (gnss_broker/prnmap.py) --
  # prn-reconfig apply keeps every node's map at "all satellites up + the noise probes", posted
  # as one whole-map swap at most every prn-reconfig-interval-s. A moved slot re-acquires cold;
  # 120 s follows a rise or set closely and leaves moved slots time to acquire before the next
  # swap. probe-require-slot picks probes only from PRNs the nodes hold a slot for, since a
  # probe without a slot never reports (unfiltered while there is no unanimous map). Both are
  # set here so no chain can miss them; on gps_l5 they do nothing, since its 32 slots hold
  # PRNs 1-32.
    prn-reconfig-interval-s: 120
    probe-require-slot: true
    prn-reconfig: apply
  # A satellite claims a slot at el >= 0 and keeps it until el < -2. Admitting at 0 matches
  # mask-deg, so every satellite the broker counts as up gets a slot and the chain shows whether
  # low satellites track. The pair must differ (admit <= evict leaves the map alone and logs
  # it): a satellite hovering at the horizon then costs one cold acquisition, not one per
  # cycle. Satellites that find no slot are logged as "want a slot and cannot have one".
    prn-reconfig-admit-deg: 0
    prn-reconfig-evict-deg: -2
  # Poll the combiners' /get_elements (every 20 s) and serve the per-element complex gains
  # (amplitude and phase per antenna, per instance) on the publisher's /get_elements. The raw
  # parts for present satellites and noise probes go to element-archive-dir as
  # elem_<chain>_<YYYYMMDD>.jsonl for the offline beam map. Instances without the endpoint are
  # skipped and counted.
    element-poll: true
    element-archive-dir: /home/kvand/gnss/fixtures/obs
  # Feed the receiver-wide joint state's per-satellite range-rate rows (m/s, shared across
  # bands) from this chain's carrier-rate residuals; the JRR log lines show them. Measurement
  # only unless the chain also sets rrate-command, which closes the carrier loop. Set on every
  # chain so gal_e5a and gal_e5b put each Galileo satellite's two carriers on one row.
    rrate-state: true
  # Also feed those rows the KCOH fold's remaining carrier rate (rate_hz + rate_resid_hz),
  # sig-gated, probes excluded; while a satellite has a fresh KCOH update its coarse rate
  # measurements are deweighted.
    rrate-kcoh-feed: 1
  # Dead-reckon time base from the F-engine hop counter (newest telemetry hop plus wall time
  # elapsed since) instead of wall clock minus the frame-0 anchor: hop->UTC is PPS-disciplined,
  # while the broker's wall clock carries drifting NTP error (1 ms is 10230 L5 chips).
    dr-fengine-axis: 1
  # Before taking the common spectrum window (the min over instances), drop instances whose
  # newest window trails the fleet's newest by more than 8, so one frozen instance cannot pin
  # it; they are named in the dropped list. Healthy lag is a few windows.
    spectrum-stale-margin: 8
  # -- the frame-synced telemetry gather --
  # The gather's local stream to the broker (GATHER_SERVE_HOST/PORT in
  # config/gen_chord_gnss_config.py). It binds 127.0.0.1, so the broker must run on the
  # gather's host. One reader thread serves every chain. Once connected, the fleet ADRs, the
  # tracker code residuals and the KCOH and prompt C/N0 estimators read the gathered records;
  # telem-dll and telem-coherent move the code loop and fleet_coherent onto them as well.
    telem-gather: 127.0.0.1:11061
  # 32 windows x 4 records = 128 records, the combiners' record_export, so the gathered and
  # polled feeds integrate the same length. The gather's /get_taps depth
  # (FLEET_TRIM_TAPS_WINDOWS in config/gen_chord_gnss_config.py) must match: change all three
  # together.
    telem-windows: 32
  # Close the code loop on the discriminator formed here from the gathered per-channel E/P/L
  # (gnss_broker/combdll.py): coherent over every channel of the lobe, all instances on one
  # phase reference, where the polled path sums each instance's channels and adds powers across
  # instances. The combiner poll must still be made: deep_snr, deep_floor, coherence_s and the
  # quadrature fallback come from its deep fold and are carried across (combdll.COH_KEYS). A
  # cycle with no gathered windows for the chain uses the polled discriminator; the COMB-DLL
  # log line compares the two.
    telem-dll: true
  # fleet_coherent reads the gathered stream instead of polling /get_records: the same
  # estimator, and the poll is skipped. Gathered records are addressed by absolute window index,
  # so every instance contributes the same windows, where polled records are whatever
  # accumulated since each GET. Falls back to /get_records when the gather has no windows for
  # the chain.
    telem-coherent: true
  # Take the comb DLL's per-PRN taps and the prompt C/N0's per-record series from the gather's
  # C++ reduction (<fleet-trim-url>/get_taps, /get_rec_taps) instead of walking the gathered
  # frames in Python. 0 = off, 2 = on; only chains that set fleet-trim-url use it.
  # scripts/gnss/fleetdll_gate.py checks that the two arms agree on identical bytes. A failed
  # GET leaves the polled discriminator in place.
    comb-taps-cpp: 2
  # Reset a PRN's cp and Doppler fit histories across a detection gap longer than this (s). The
  # cp fit unwraps to the nearest code period, which is unambiguous while the drift across a gap
  # stays under half a period: 5115 L5 chips at the uncalibrated clock's ~3.45-4.05 chips/s is
  # 21-25 min, and a longer gap unwraps onto the wrong branch.
    fit-gap-s: 1200
  # Detections below fit-min-snr stay out of the cp-fit history: a near-threshold phase is
  # noise, and one such point sets the slope rather than degrading it. 30 is gps_l5's
  # acquire-snr, the level at which its l-a feed already trusts this fit. Detections below
  # bias-min-snr stay out of the clock-frequency bias solve and the time-base check. Only gps_l5
  # has detections, so fit-gap-s, fit-min-snr and bias-min-snr act only there.
    fit-min-snr: 30
    bias-min-snr: 60

chains:

  # GPS L5, the only chain with a search: its detections solve the receiver clock that every
  # other chain adopts in-process (dr-clock-adopt).
    gps_l5:
    # Dead-reckon and slew seeds also carry the code phase at ref_hop
    # (code_phase_at_ref_chips), which the tracker's propagate_seed prefers over the sample-0
    # argument. The phase has no back-reference to sample 0, so a Doppler edit that does not
    # re-project cp0 cannot move the despread.
        seed-phase-transport: true
    # The search's measured overlay period can toggle by one on a strong satellite, and each
    # flip would step every node's seed by a whole code period. A changed period must hold for
    # 2 consecutive detections before it rewrites the seed; until then the seed carries the
    # measured fine phase with the standing period.
        nh-period-debounce: 2
    # The joint overlay fit. The NH overlay is synchronous at the transmitters, so a
    # satellite's alignment is its predicted transmit-time index plus one common unknown (the
    # receiver clock mod the overlay epoch). Detections at snr >= 60 vote on it; once >= 3
    # agree, every detection takes its overlay segment from the consensus and keeps only its
    # measured fine phase, overriding the debounce. A strong detection that disagrees is logged.
        nh-joint: apply
    # A satellite enters the cp_held seed freeze (anchor, rate and phase frozen; the DLL owns
    # the residual; CP_ERR referees) after 5 consecutive fleet-present cycles, as well as on
    # the amp_snr path, which flickers with the deep fold. fit_trusted is still required.
    # Presence also keeps a held satellite's 3-miss release count at zero.
        hold-on-present: 5
    # Snapshots kept for the cp and Doppler-rate fits, at most one per broker cycle. The fit is
    # trusted (hold admission, escape referee) only once >= 6 points span >= 30 s, which the
    # default 8 cannot do on a satellite detected every 2 s cycle; 256 points span >= ~8 min.
        fit-hist-len: 256
    # A fitted code rate more than 0.5 chips/s off the pooled l-a clock is rejected ("cp-rate
    # REJECTED"): the fit unwraps cp to the nearest code period, so one mis-wrap puts a whole
    # period into the slope. The rejections drive fit-flush-on-reject; the seeded rate is the
    # clock's anyway (cp-rate-model-primary).
        cp-rate-model-tol: 0.5
    # Every cp fit seeds the pooled l-a clock's code rate, not its own slope (which still feeds
    # that pool as a measurement); the fit's position is kept. The residual code rate is the
    # receiver clock, common to every satellite (propagate_seed carries each one's geometry),
    # so a per-satellite slope adds only fit error.
        cp-rate-model-primary: 1
    # After 3 consecutive rate rejections, drop the PRN's cp-fit history: the seed position is
    # evaluated from the same fit, and a wrap-poisoned history keeps poisoning it for as long
    # as the history lasts. The satellite rides the birth path while a clean fit rebuilds.
        fit-flush-on-reject: 3
        signal: gps_l5
    # Seed and hint only PRNs whose block transmits L5 (IIF and later), by the IGS registry's
    # block types (Celestrak block names only if the registry proves nothing; both fail open).
    # With the search's require_hint, an unhinted PRN is never scanned.
        signal-capability: gps_l5
    # The GPU acquisition search over every node's L5 lobe: the stack's aggregator on this host
    # (scripts/gnss/site/stack_components.sh).
        detectors: http://localhost:12050/gps_search
    # Stages are per GPU (gnss0, gnss1) on each node in config/gnss_fleet_chord.yaml `nodes:`;
    # a bare stage name resolves against rest-url. `combiner` is the one per-PRN status source
    # (amplitudes, drop decisions, nav bits). dll-combiners, every instance's combiner, is
    # polled for the fleet DLL, fleet_coherent and element-poll, and names the record
    # assemblers that post-sat-geometry posts to.
        trackers: "http://cx19:12048/gnss{0..1}_inject,http://cx27:12048/gnss{0..1}_inject,http://cx42:12048/gnss{0..1}_inject,http://cx43:12048/gnss{0..1}_inject,http://cx44:12048/gnss{0..1}_inject,http://cx51:12048/gnss{0..1}_inject"
        combiner: gnss0_n2combine
        dll-combiners: &l5_cmb "http://cx19:12048/gnss{0..1}_n2combine,http://cx27:12048/gnss{0..1}_n2combine,http://cx42:12048/gnss{0..1}_n2combine,http://cx43:12048/gnss{0..1}_n2combine,http://cx44:12048/gnss{0..1}_n2combine,http://cx51:12048/gnss{0..1}_n2combine"
    # Trim presence for these PRNs is judged on detection (deep_snr >= 3 x deep_floor) rather
    # than on summed prompt power. Prompt power falls when the tap is off-peak, so a
    # prompt-gated satellite that drifts off the peak is never trimmed back; the deep fold
    # re-searches rate and phase and sees the satellite wherever the tap sits.
        dll-deep-gate: "4 9 27"
    # Also deep-gate any PRN the search detects at snr >= 100, for dll-deep-gate-search-hold-s
    # (90 s) after the detection. The search re-derives code phase over the full period, so
    # it does not depend on where the tap sits, and unlike deep_snr it does not fire on noise.
    # 100 admits only strong detections, far above the acquire bar (30) and the pure-noise
    # ceiling the search logs each pass.
        dll-deep-gate-from-search: 100
    # The C++ fast code loop (GnssFleetTrim in the gather on this host, port 12051) forms the
    # comb discriminator and posts each armed PRN's trim once per telemetry window (~23.8/s),
    # fast enough to follow the code's motion where the policy cycle is not. Each cycle the
    # broker posts it /set_policy (armed PRNs, loop constants, probe-anchored floor, tracker
    # targets); presence, the floors and the deep gate stay in the broker.
        fleet-trim-url: "http://127.0.0.1:12051/fleet_trim"
    # Closed-loop bandwidth (1/s), not a per-update gain: the loop divides by its measured
    # update rate. Slew authority 2.5 x 0.25 chips (|tau| bound at 0.5 spacing) = 0.62 chips/s
    # covers the ~0.43 chips/s the tap must follow (the clock's +-1-chip, ~18 s breathing plus
    # drift). Stable while bandwidth x measurement delay < ~0.5, which needs the gather's
    # n_win 2 (gen_chord_gnss_config.py --fleet-trim-windows 2; the default is 4).
        fleet-trim-bandwidth: 2.5
    # Read the loop's standing per-PRN trims back (/get_dll) after each policy post, so the
    # innovation, the CP_ERR hold referee and the published rows see seed + trim, not the seed
    # alone.
        fleet-trim-readback: 1
    # Post each up, capable PRN's predicted Doppler plus the solved clock-frequency bias to the
    # search's /set_doppler_hints; the search scans only hinted PRNs, within the hint window.
        narrow-search: true
    # RF-path health from each GPU's search voltage tap: clip fraction and per-channel band
    # power, served on the publisher's /get_rf. On this chain only: the tap is per GPU and
    # watches every chain's channels, so the readings are the receiver's, and arming it on
    # several chains would poll the same endpoints and raise each alarm once per chain.
        rf-stats-endpoints: "http://cx19:12048/gnss{0..1}_srch_tap,http://cx27:12048/gnss{0..1}_srch_tap,http://cx42:12048/gnss{0..1}_srch_tap,http://cx43:12048/gnss{0..1}_srch_tap,http://cx44:12048/gnss{0..1}_srch_tap,http://cx51:12048/gnss{0..1}_srch_tap"
    # Fold spectral-kurtosis RFI metrics (URL derived per rf-stats instance) and each host's
    # /metrics drop counters into the same /get_rf payload.
        rfi-stats: true
        drop-stats: true
    # The stream-health panel's rows, as chain names (carriers from gnssSignal.hpp); each
    # monitored channel is labelled with the nearest declared carrier. List every band the
    # receiver flies: the ten chains share L5 1176.45, L3 1202.025, E5b 1207.14, L2 1227.60,
    # G2 1248.06, B3 1268.52 and E6 1278.75 MHz. Matching the full band table instead would name
    # a band CHORD does not fly (B1I); unset, the rows read "lobe N". With glo_l3oc declared the
    # channels below 1204.6 MHz, E5b's lower shoulder, are named L3: they are its lobe now.
        rf-bands: "gps_l5,gal_e5a,bds_b2a,glo_l3oc,gal_e5b,bds_b2b,gps_l2c,glo_l2oc,bds_b3i,gal_e6"
    # The record assemblers whose /get_spectrum (per-channel prompt sums before the
    # cross-channel combine) feed the fleet phase-slope delay fit (SPEC-FIT). Its tau updates
    # the per-satellite path-bias filter (b_sat) that dead-reckon seeds add to the clock.
        spectrum-endpoints: "http://cx19:12048/gnss{0..1}_n2assemble,http://cx27:12048/gnss{0..1}_n2assemble,http://cx42:12048/gnss{0..1}_n2assemble,http://cx43:12048/gnss{0..1}_n2assemble,http://cx44:12048/gnss{0..1}_n2assemble,http://cx51:12048/gnss{0..1}_n2assemble"
    # Hint each PRN's NH overlay alignment from the ephemeris plus the receiver-clock offset
    # any detection measures, so the search scans nh_hint_span alignments either side instead
    # of all 20. Works for a satellite never detected.
        nh-hint: true
    # Detections below this are ignored; the search's own acquire_snr is the same 30
    # (ACQUIRE_SNR in config/gen_chord_gnss_config.py).
        acquire-snr: 30
    # Doppler hint half-windows (Hz): wide until the clock-frequency bias is solved, and while
    # it is stale.
        search-margin-wide-hz: 200
        search-margin-hz: 100
    # A satellite whose code-phase integrity residual marks its model untrusted keeps its BRDC
    # Doppler; only a stale ephemeris also demotes the Doppler. Demoting it on the residual
    # would switch the seed between two BRDC evaluations (dr and pred) at every trust flip, and
    # the seed Doppler is the replica's carrier. Integrity residuals need detections, so only
    # this chain computes them.
        dr-doppler-ignores-integrity: true
    # Live consumers of the receiver-wide joint state ([clk, clk_rate, b_sat], solved from the
    # detections' integrity residuals). rate: the seeded code-rate clock is the joint clk_rate
    # instead of the l-a EMA while the state holds >= 4 satellites and reads <= 0.01 ppm.
    # slew: dead-reckon seed offsets take the joint clk + b_sat instead of the clock EMA plus
    # the path-bias filter (the SEED-OFFSET line's "legacy"), refused per satellite where the
    # two differ by more than 5 chips.
        joint-consume: rate,slew
    # Rotating coast test: withhold the best-established satellite from the joint solve for
    # 600 s, log its residual against age (P2C lines), then rotate to one not tested recently.
    # The residual's growth measures how well the shared state carries a satellite it is not
    # told about. The withheld satellite is still seeded, but the joint solve that joint-consume
    # reads runs without it. The residual needs detections, so only this chain can run it.
        joint-p2c-rotate: true
    # Up to 32 PRNs (no cap in practice) run model-primary: the seed comes from the dead-reckon
    # slew (BRDC + joint clk + b_sat) and detections only feed the joint filter and the MINNOV
    # referee, since the model forecasts an established satellite better than a re-anchor on
    # the search's per-fix scatter. Entry: 10-min MINNOV p95 < 2.0 chips over >= 30 samples;
    # back to the search above 3.0, or after 600 s without a detection.
        model-primacy-max: 32

  # Galileo E5a-Q, model-primary with no detectors: the per-PRN CS100 secondary does not fit
  # the replica bank's single-sequence overlay slot, so the search cannot blind-acquire it
  # (docs/CHORD_MULTIBAND.md section 5). Every visible satellite is seeded from BRDC plus the
  # receiver clock. Apart from signal and the endpoints this block matches gal_e5b key for key:
  # the two bands carry the same satellites, so each is the other's control, and a comparison
  # between them should differ in one key.
    gal_e5a:
    # Build dead-reckon seeds for an exact hop 1.0 s ahead of now rather than for now. A seed is
    # a forecast labelled with its ref_hop, so the telemetry lag (~0.2-0.3 s) then costs margin
    # instead of entering the arithmetic. The lead must exceed transport plus install; at 1.0 s
    # the linear range-rate propagation errs by ~0.003 chips.
        dr-forecast-lead-s: 1.0
    # As gps_l5. With an adopted clock nothing re-solves wall-clock drift out of a transported
    # phase, so this relies on dr-fengine-axis (common:) keeping NTP drift out of the seed epoch.
        seed-phase-transport: true
        signal: gal_e5a
    # #191 step 1 (10-18): the aggregator's E5a search (`--aggregator-extra-search GAL_E5A_Q`,
    # stage e5a_search on the merged L5/E5a comb) is read for the record only: SEARCH-MONITOR
    # logs the search's clock against the joint clock and nothing seeds, holds, escapes or
    # feeds from it; Doppler and nh hints are still posted so the search runs. The aggregator
    # must carry the stage before the broker points here. Delete both keys to end it.
        detectors: http://localhost:12050/e5a_search
        detectors-monitor: true
    # The search scans only hinted PRNs (require_hint), and hints go out only under
    # --narrow-search, which this chain never carried (model-primary, no search): without it
    # e5a_search reports "0/36 PRNs hinted" and the monitor never prints (10-18 18:30Z).
        narrow-search: true
    # This chain cannot solve a receiver clock, so it adopts the one gps_l5 solves, through the
    # shared in-process Receiver (same band). A chain with detections ignores the flag (under
    # --detectors-monitor the detections never become offsets, so it adopts as before).
        dr-clock-adopt: true
    # The fast code loop, as gps_l5 (same clock and 10.23 Mcps chip rate, so the same
    # bandwidth). It acts only on PRNs that passed presence, and with no search to bring a PRN
    # onto the peak the broker's per-cycle DLL stays the pull-in path: it trims every PRN outside
    # the last posted armed set and stands down for each one the fast loop takes.
        fleet-trim-url: "http://127.0.0.1:12051/fleet_trim"
        fleet-trim-bandwidth: 2.5
        fleet-trim-readback: 1
    # -- the carrier loop (rrate-command below) --
    # A row may command only while its satellite's KCOH significance this cycle is >= 100; no
    # KCOH row means no command. The row-sigma gate (rrate-cmd-max-sigma) describes the fit, and
    # a confident row on a marginal satellite (KCOH sig in the tens) can pass it; well-tracked
    # satellites read in the thousands. A satellite that loses any command gate slews its
    # command back to 0 at rrate-cmd-slew-hz.
        rrate-cmd-min-sig: 100
    # Clamp on the command (default 40 Hz). True residuals are a few Hz, so 10 Hz bounds a row
    # that chases noise without limiting a real correction.
        carrier-max-hz: 10.0
    # The record assembler folds the applied carrier trim out of every record, so the deep-fold
    # and KCOH rates already read the whole residual. Adding the command back (the default 1)
    # would make each row integrate its own actuation and ramp at the slew rate. The fine feed
    # takes its own reference either way.
        rrate-feed-applied: 0
    # Also feed the rows from the fine ADR phase rate (res_cycles per adr_records, differenced
    # over rrate-phase-span-s) when the arc is unbroken, the record counter advanced and agrees
    # with wall time, the command moved <= 0.6 Hz over the span, the satellite is cohering
    # (coherence_s > 0 or coh_frac >= 0.3) and |rate| < 20 Hz. Its reference is the trim the
    # tracker applied over the same span (trim_cycles), so a moving command does not bias it.
    # Needs rrate-phase-sign.
        rrate-phase-feed: true
    # Close the carrier loop: post each satellite's carrier_trim_hz from the joint state's
    # carrier_correction_hz (receiver f_carrier plus the satellite's range-rate model error,
    # scaled to this band). Implies rrate-state. A command needs the row sigma <=
    # rrate-cmd-max-sigma (0.5 m/s), the gates above and deep_rate_full_* in this poll; each
    # step is bounded by rrate-cmd-slew-hz, and probes never command. Poll-to-poll command churn
    # follows the row noise: judge the loop by per-satellite q scatter against an uncommanded
    # chain in the same poll.
        rrate-command: true
    # Maps the combiner's res_cycles rate (its internal, r2c-flipped sign) onto the
    # deep_rate_full_hz convention. Per chain: calibrate it on sky from the JRRP log line's
    # fine|coarse response to a commanded carrier step, since a passive fine-vs-coarse
    # regression can read the sign backward. 0 keeps the fine feed off; JRRP logs either way.
        rrate-phase-sign: 1.0
    # 1.0 keeps coarse rate measurements at full weight; the default 8 inflates their sigma 8x
    # while a fine or KCOH update is fresh (rrate-fine-hold-s). Between sparse fine samples a row
    # deweighted that far stops following the carrier drift, and the command wanders with it.
        rrate-coarse-deweight: 1.0
        trackers: "http://cx19:12048/gnss{0..1}_e5a_inject,http://cx27:12048/gnss{0..1}_e5a_inject,http://cx42:12048/gnss{0..1}_e5a_inject,http://cx43:12048/gnss{0..1}_e5a_inject,http://cx44:12048/gnss{0..1}_e5a_inject,http://cx51:12048/gnss{0..1}_e5a_inject"
        combiner: gnss0_e5a_n2combine
    # Difference res_cycles against the newest snapshot at least 16 s old instead of the last
    # poll's. The phase error sits at the two endpoints, so the rate noise falls as 1/span,
    # while the span-mean lags a drifting rate by span/2; the feed's sigma carries both terms.
    # On sky the two combined are smallest at 16-32 s; much longer spans lose to the lag. Each
    # satellite feeds at most once per span, so fed values share no data; the JRRP line shows
    # the unthrottled per-poll value.
        rrate-phase-span-s: 16
        spectrum-endpoints: "http://cx19:12048/gnss{0..1}_e5a_n2assemble,http://cx27:12048/gnss{0..1}_e5a_n2assemble,http://cx42:12048/gnss{0..1}_e5a_n2assemble,http://cx43:12048/gnss{0..1}_e5a_n2assemble,http://cx44:12048/gnss{0..1}_e5a_n2assemble,http://cx51:12048/gnss{0..1}_e5a_n2assemble"
        dll-combiners: &e5a_cmb "http://cx19:12048/gnss{0..1}_e5a_n2combine,http://cx27:12048/gnss{0..1}_e5a_n2combine,http://cx42:12048/gnss{0..1}_e5a_n2combine,http://cx43:12048/gnss{0..1}_e5a_n2combine,http://cx44:12048/gnss{0..1}_e5a_n2combine,http://cx51:12048/gnss{0..1}_e5a_n2combine"
    # clk: each cycle, move the adopted clock's level onto the joint filter's clock, as a
    # wrapped delta. The adopted clock is gps_l5's circular median over its detected
    # satellites, which steps whenever that set changes; the filter solves the clock jointly
    # with per-satellite biases and does not. The adopted clock is kept when the state holds
    # fewer than 4 satellites, its clock sigma exceeds 0.5 chips or the delta 5 chips, and,
    # when the joint clock steps more than 0.3 chips from the level last adopted, until the
    # new level has held 30 s. The JOINT-CLK line prints both clocks.
    # rate: as gps_l5; the l-a rate it replaces is the one adopted from gps_l5.
    # Not slew, which needs this chain's satellites in the joint state: only search detections
    # feed it, since a model-primary chain's code residual is measured against its own seed and
    # feeding it while consuming would close a loop with no sky reference.
        joint-consume: clk,rate
    # E33's trim presence is judged on the deep fold alone (deep_snr >= 3 x deep_floor), as on
    # gps_l5, and while the combiner reports a floor that verdict overrides the q, prompt and
    # displaced gates for it. Not widened: deep_snr can fire on noise, and this gate has no
    # pedestal or offset test; presence-admit-displaced gives every PRN the same offset-blind
    # evidence with both tests.
        dll-deep-gate: "33"
    # q and prompt power both fall with the code offset the DLL exists to remove, so without
    # this a displaced satellite is never armed for its own correction. A row that fails them
    # is admitted when the (E/P, L/P) fit reads the deficit as an offset rather than weakness
    # (pedestal <= 0.3 of the peak, |offset| <= 0.6 chips, inside the DLL's pull-in) and the
    # satellite is evidently there: prompt power over the probe floor, or deep_snr >=
    # 3 x deep_floor from the combiner's deep fold, which re-searches code phase and so needs
    # no search. Needs the probe-anchored floors. A displacement over 0.1 chip is refused while
    # the chain is browned out, or when 3 or more PRNs share it in one cycle: that is a chain
    # event, not N detections. Admissions log "PRESENCE +displaced" and carry present_gate
    # '...+disp'. An admitted row is armed for the fast loop, which steps it only in windows
    # whose prompt power clears the same probe floor.
        presence-admit-displaced: true

  # BeiDou B2a pilot: the same 1176.45 MHz channels, 10.23 Mcps primary and per-PRN 100 ms
  # secondary as gal_e5a, so it is model-primary with no detectors for the same reason. Apart
  # from signal and the endpoints, every key below that gal_e5a also sets has gal_e5a's value,
  # for the reasons given there. It sets no dr-forecast-lead-s, so its dead-reckon seeds are
  # built for the current time rather than for a hop 1 s ahead.
    bds_b2a:
        presence-admit-displaced: true
        seed-phase-transport: true
    # Besides the code constants this sets constellation C and signal-capability bds_b2a. B2a
    # is BDS-3 only: the IGS registry's block types decide which PRNs carry it (C11-C14 are
    # BDS-3 MEOs on re-used BDS-2 PRNs); if it proves nothing, PRNs below 19 are not seeded.
        signal: bds_b2a
        dr-clock-adopt: true
        joint-consume: clk,rate
    # The carrier loop as on gal_e5a without the fine feed (rrate-phase-feed and its keys), so
    # this chain feeds the rows only from the KCOH fold and the coarse deep-fold rate. Two more
    # keys stay at their defaults: rrate-coarse-deweight 8 deweights the coarse rate while a
    # KCOH update is fresh, and rrate-feed-applied 1 makes both feeds add the standing command
    # back to each measurement (gal_e5a sets 0; see its note).
        rrate-command: true
        rrate-cmd-min-sig: 100
        carrier-max-hz: 10.0
        fleet-trim-url: "http://127.0.0.1:12051/fleet_trim"
        fleet-trim-bandwidth: 2.5
        fleet-trim-readback: 1
        trackers: "http://cx19:12048/gnss{0..1}_b2a_inject,http://cx27:12048/gnss{0..1}_b2a_inject,http://cx42:12048/gnss{0..1}_b2a_inject,http://cx43:12048/gnss{0..1}_b2a_inject,http://cx44:12048/gnss{0..1}_b2a_inject,http://cx51:12048/gnss{0..1}_b2a_inject"
        combiner: gnss0_b2a_n2combine
