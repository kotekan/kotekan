    trackers: "http://cx19:12048/gnss{0..1}_b2a_inject,http://cx27:12048/gnss{0..1}_b2a_inject,\
http://cx42:12048/gnss{0..1}_b2a_inject,http://cx43:12048/gnss{0..1}_b2a_inject,\
http://cx44:12048/gnss{0..1}_b2a_inject,http://cx51:12048/gnss{0..1}_b2a_inject"
    combiner: gnss0_b2a_n2combine
    spectrum-endpoints: "http://cx19:12048/gnss{0..1}_b2a_n2assemble,\
http://cx27:12048/gnss{0..1}_b2a_n2assemble,http://cx42:12048/gnss{0..1}_b2a_n2assemble,\
http://cx43:12048/gnss{0..1}_b2a_n2assemble,http://cx44:12048/gnss{0..1}_b2a_n2assemble,\
