        combiner: gnss0_e6_n2combine
        spectrum-endpoints: "http://cx19:12048/gnss{0..1}_e6_n2assemble,http://cx27:12048/gnss{0..1}_e6_n2assemble,http://cx42:12048/gnss{0..1}_e6_n2assemble,http://cx43:12048/gnss{0..1}_e6_n2assemble,http://cx44:12048/gnss{0..1}_e6_n2assemble,http://cx51:12048/gnss{0..1}_e6_n2assemble"
