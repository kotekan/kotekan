# CHORD GNSS chains -- one broker process, every signal (task #27).
#
#   scripts/gnss/broker_multi.py config/gnss_chains_chord.yaml
#
# Replaces running scripts/gnss/broker_up.sh and scripts/gnss/broker_up_extra.sh e5a side
# by side. Those two chains sit on the SAME 1176.45 MHz carrier through the same feed and
# the same clock; splitting them across processes is what forced the receiver clock through
# a JSON file, fetched the F-engine time anchor twice, parsed BRDC twice, and needed two
# viewer instances. See docs/CHORD_BROKER_REFACTOR.md.
#
# Every key becomes a broker flag: `dll-gain: 0.25` -> `--dll-gain 0.25`, `true` -> a bare
# flag, `false`/null -> omitted. So this file reads as the command lines it replaces, and a
# mistyped key surfaces as argparse's "unrecognized arguments" instead of being ignored.
#
# ⚠️ The per-signal constants are NOT here on purpose. `signal: gps_l5` resolves carrier,
# chip rate, code length, long-code segments+epoch and overlay length from
# lib/stages/gnss/gnssSignal.hpp -- the same descriptors the trackers' replica bank is built
# from. Every one of those constants fails SILENTLY when mistyped, and this file is exactly
# the kind of place a wrong one would live forever.

common:
  # -- the RECEIVER: one telescope, one site, one F-engine ------------------------------
  rest-url: http://cx19:12049      # must name a real NODE; cf06 runs no gnss node itself
  time0-endpoint: telescope/time0_ns
  hops-per-sec: 195312.5           # F-engine record geometry -- not a signal property
  lat: 49.32075144444
  lon: -119.62081125
  alt: 545
  mask-deg: 0
  interval: 2
  # ONE PORT FOR EVERY CHAIN (M6). Select with /<chain>/get_status or ?chain=<id>.
  publish-port: 12060

  # -- shared loop settings (identical in both launch scripts today) ---------------------
  almanac: true
  almanac-source: brdc
  dead-reckon: true
  dr-clock-chips: 0.0
  carrier-from-code: true
  cl-assist: true
  seed-doppler: auto
  dll-gain: 0.25
  carrier-gain: 0.0
  code-bias-alpha: 0.05
  code-bias-min-sats: 2
  fit-gap-s: 3600
  fit-min-snr: 0
  bias-min-snr: 60
  nh-period-offset: 0

chains:

  # GPS L5 -- the only chain with a SEARCH. Its detections are what solve the receiver
  # clock, which every other chain here now consumes in-process.
  gps_l5:
    signal: gps_l5
    detectors: http://localhost:12050/gps_search
    # -- PATH B (task #26, 2026-08-09). GPS L5 ran on BOTH paths simultaneously: path A
    # (gnss*_track / gnss*_assemble / gnss*_combine) and a fully-built path B
    # (gnss*_inject / gnss*_n2assemble / gnss*_n2combine). Measured, path A costs 7x path B
    # per tracker kernel, so that duplicate was the single largest GPU consumer on every
    # node -- ~7 of ~10 units, which is what kept the fleet at 62-79% with only three
    # chains and made a second band look unaffordable.
    #
    # The record-cadence worry from the path-B plan does NOT apply to this deployment: the
    # plan describes sub_integration_ntime 8192 (frame-length records), but the generator
    # drives BOTH paths from --hops-per-record, and every stage in the live config -- path A
    # and path B alike -- reads 2048. Same cadence, so --coh-min-records, the DLL hop window
    # and fit-gap all see exactly what they saw before. Path B at this cadence is already
    # proven in production by E5a/B2a, which have run on nothing else.
    trackers: "http://cx19:12049/gnss{0..1}_inject,\
http://cx27:12049/gnss{0..1}_inject,\
http://cx42:12049/gnss{0..1}_inject,\
http://cx43:12049/gnss{0..1}_inject,\
http://cx44:12049/gnss{0..1}_inject,\
http://cx51:12049/gnss{0..1}_inject"
    combiner: gnss0_n2combine
    # NOT uniform: cx19 and cx51 were regenerated with --combine-gpus and expose ONE merged
    # 14-channel combiner; the rest predate it and expose two 7-channel ones. Regenerate all
    # node configs and this collapses to the {0..1} form everywhere.
    # Path B's combiners are uniform {0..1} on every node -- the --combine-gpus asymmetry
    # that forced the hand-written list below was a path-A artefact and dies with it.
    dll-combiners: &l5_cmb "http://cx19:12049/gnss{0..1}_n2combine,\
http://cx27:12049/gnss{0..1}_n2combine,\
http://cx42:12049/gnss{0..1}_n2combine,\
http://cx43:12049/gnss{0..1}_n2combine,\
http://cx44:12049/gnss{0..1}_n2combine,\
http://cx51:12049/gnss{0..1}_n2combine"
    n2-combiners: *l5_cmb
    narrow-search: true
    # Task #32: per-channel spectra for the fleet phase-slope delay fit (measurement-only).
    # Path B's assemblers; same node set as the trackers.
    spectrum-endpoints: "http://cx19:12049/gnss{0..1}_n2assemble,http://cx27:12049/gnss{0..1}_n2assemble,\
http://cx42:12049/gnss{0..1}_n2assemble,http://cx43:12049/gnss{0..1}_n2assemble,\
http://cx44:12049/gnss{0..1}_n2assemble,http://cx51:12049/gnss{0..1}_n2assemble"
    nh-hint: true
    nh-hint-span: 2
    acquire-snr: 30
    search-margin-wide-hz: 200
    search-margin-hz: 100
    # ONLY THIS CHAIN NEEDS IT, because only this chain has detectors: the integrity check
    # that populates dr_untrusted needs measured code phases, so on E5a/B2a/E5b/B2b it never
    # fires and their Doppler already comes straight from BRDC every cycle. That is exactly
    # why those four sit at 0.002-0.006 Hz of commanded-Doppler jitter while gps_l5 carries
    # 0.478 Hz -- and why gps_l5's deep fold inflates scatter +5.55 dB against their
    # +0.36..+0.77 (docs/CHORD_JOINT_TRACKING.md 3d). This makes GPS's Doppler behave like
    # theirs. Revert by deleting this line.
    dr-doppler-ignores-integrity: true
    # P2b CONSUMER 1 of 3 (task #33), enabled 2026-08-11 00:1x after the shadow
    # re-qualified post-divergence-fix: 36 min, clk 150.8 sigma ~0.07 stable, rate
    # +-0.0006 chips/s, 14/2198 rejections (0.64%), b_sat +-5, zero guard firings,
    # through the 6->11 mass-birth wave. Replaces the l-a EMA as the seeded code-rate
    # clock -- the EMA measured ~80x biased (call site) and its a=0.05 stepping against
    # a 35 Hz-spread raw solve is the measured GPS seed-jitter floor. The consumer has
    # its own plausibility bound (--joint-max-rate-ppm) and falls back to the EMA when
    # the joint state is thin or implausible. Revert by deleting this line.
    # P2b CONSUMER 2 (slew) added 2026-08-11 00:4x: the seed's clock+bias offset from
    # clk + b_sat instead of the clock EMA + SatBiasFilter. Gate (12 SEED-OFFSET lines,
    # 6 min): per-PRN joint-vs-legacy stable and chips-scale (PRN26 -3.4..-5.0, PRN6
    # +3.3..+4.7, PRN4 -1.44..-1.65 at sigma 0.09), median +1.4..+2.8. Per-sat REFUSED
    # fallback beyond --joint-slew-max-chips 5.0. Motivation: G4's search-anchored cp
    # wanders chips-scale between passes (disc railed at 0.94, level swinging 16-49 dB).
    # ⚠️ THE SECOND HALF OF THAT MOTIVATION WAS WRONG and is retracted (2026-08-11): it
    # said "the model-primary chains never do this because their cp is slewed to the
    # model", generalising from G4 alone. The population statistic says the opposite --
    # railed-discriminator fraction at MATCHED C/N0 (38-41 dB-Hz) is 2-3% on search-
    # anchored gps_l5 (PRN 10, 23) against 55-58% on gal_e5a PRN 25 and bds_b2a PRN 22.
    # The model-primary chains do it MORE, by 20x, and that is what the E5a feed below is
    # meant to attack. The gate that qualified this consumer on GPS stands on its own
    # measurements and is unaffected.
    joint-consume: rate,slew
    # PER-SUBBAND ARCHIVE (task #25). fleet_spectrum already computes per-channel,
    # per-instance amplitudes for the tau fit and then discards them; this persists the
    # raw points before the collapse. The per-freq x per-element axis IS the science
    # product -- a combined number rebuilds from the parts, never the reverse -- and every
    # combine (beam map, band health, per-element gain) becomes an offline function of it.
    # A few kB/poll, no recomputation, no node-side change. Rolls by UTC day.
    spectrum-archive: /home/kvand/gnss/fixtures/spectra/gps_l5_%Y%m%d.jsonl

  # Galileo E5a -- path B, and NO DETECTORS by design: E5a-Q carries a PER-PRN secondary,
  # which the replica bank's single-sequence overlay slot cannot hold, so blind
  # multi-period acquisition does not exist (CHORD_MULTIBAND.md section 5). Purely
  # model-primary, every visible satellite seeded from BRDC plus the receiver clock.
  #
  # --dr-clock-adopt STAYS -- it is the switch that says "this chain may take a sibling's
  # clock", and a chain that can solve its own is unaffected by it either way. What is gone
  # is the PLUMBING it used to need: --state-read-dir /tmp/gnss_state --state-dongle l5
  # here, and --state-file/--state-dongle on the GPS chain purely to feed this one. gps_l5
  # is in this process and has already contributed the clock to the Receiver, so the
  # transfer is an attribute read rather than a JSON file with a flush cadence, an age gate
  # and a two-read slew test. (Those still exist, unchanged, for cross-PROCESS siblings.)
  gal_e5a:
    signal: gal_e5a
    dr-clock-adopt: true
    trackers: "http://cx19:12049/gnss{0..1}_e5a_inject,http://cx27:12049/gnss{0..1}_e5a_inject,\
http://cx42:12049/gnss{0..1}_e5a_inject,http://cx43:12049/gnss{0..1}_e5a_inject,\
http://cx44:12049/gnss{0..1}_e5a_inject,http://cx51:12049/gnss{0..1}_e5a_inject"
    combiner: gnss0_e5a_n2combine
    spectrum-endpoints: "http://cx19:12049/gnss{0..1}_e5a_n2assemble,\
http://cx27:12049/gnss{0..1}_e5a_n2assemble,http://cx42:12049/gnss{0..1}_e5a_n2assemble,\
http://cx43:12049/gnss{0..1}_e5a_n2assemble,http://cx44:12049/gnss{0..1}_e5a_n2assemble,\
http://cx51:12049/gnss{0..1}_e5a_n2assemble"
    dll-combiners: &e5a_cmb "http://cx19:12049/gnss{0..1}_e5a_n2combine,\
http://cx27:12049/gnss{0..1}_e5a_n2combine,http://cx42:12049/gnss{0..1}_e5a_n2combine,\
http://cx43:12049/gnss{0..1}_e5a_n2combine,http://cx44:12049/gnss{0..1}_e5a_n2combine,\
http://cx51:12049/gnss{0..1}_e5a_n2combine"
    n2-combiners: *e5a_cmb
    # ── P2b STEP 1 for the model-primary chains (task #33), 2026-08-11 ──────────────────
    # FEED ONLY. There is deliberately no `joint-consume` here: this puts E5a's satellites
    # INTO the shared receiver state and changes no seed. Consume is a separate commit,
    # gated on what this measures.
    #
    # WHY FEED FIRST, AND WHY THIS ORDER. Adding `joint-consume: slew` here without this
    # line would be a test that cannot succeed. The slew path requires `not detectors`, so
    # only the model-primary chains reach it -- but the joint state is fed exclusively by
    # search-anchored chains unless --joint-model-primary is set, so every (tag, prn) on
    # this chain misses _idx, _joff comes back None, and the consumer silently never fires.
    # Verified on sky before writing this: the state held n=5 sats, ALL of them G.
    #
    # WHAT RE-OPENED IT. --joint-model-primary was turned off 2026-08-10 02:17 (53a94cae2)
    # after a measured regression -- clk walked to +445 chips against a true ~150, biases
    # -427/-330/+281, tau_band +792, 67-82% of updates rejected -- because the model-primary
    # measurement had NO quality gate (a detection has an SNR to threshold on, a
    # dead-reckoned seed does not). That gate landed 9 hours later in 2d5bccacd: _track_ok
    # requires coherence_s > 0 AND deep_snr >= --joint-min-deep-snr (10) AND coh_frac >=
    # --joint-min-coh-frac (0.3). The stated precondition for re-enabling is therefore met;
    # the flag was simply never flipped back. (Its --help still claims the gate does not
    # exist. Fixed in the same commit as this line.)
    #
    # ⚠️ THE SHARED-STATE EXPOSURE, because "feed only" is not the same as "cannot reach
    # sky". joint_receiver() is ONE `__receiver__` object for the whole process, and gps_l5
    # CONSUMES it (rate + slew). So a state corrupted by this feed does have a path to the
    # GPS seeds. Two things bound it: the consumers' own plausibility gates
    # (--joint-slew-max-chips 5.0, --joint-max-rate-ppm) refuse an implausible offset rather
    # than apply it, and GPS's own SEED-OFFSET lines print REFUSED when that happens -- so
    # the early-warning signal is free and already in the log. Watch it.
    #
    # ⚠️ AND THE RISK THAT IS NOT BOUNDED: mass birth. This admits ~11 Galileo satellites at
    # once, and the filter's known divergence trigger is exactly that (6 sats in 13 s stepped
    # everything ~9 chips; _membership_changed() is sized for ONE join, #39). escape_max_step
    # and rate_max bound the damage but the trigger is still unconfirmed. If the first
    # minutes look wrong, delete these two lines -- that is the whole revert.
    #
    # WHAT THIS IS FOR: the 15-25 dB C/N0 fades on this chain are the prompt tap walking off
    # the correlation peak ((E+L)/2P = 3.27 in the faded quartile vs 0.312 bright), and the
    # railed-discriminator fraction is 55-58% here against 2-3% on search-anchored GPS at
    # MATCHED brightness. Those two numbers are the before/after metric for consume.
    joint-shadow: true
    joint-model-primary: true
    # ── P2b STEP 2: CONSUME (2026-08-11 16:2x) ─────────────────────────────────────────
    # THE FIRST THING TODAY THAT CHANGES A SEED. Everything above is measurement; this
    # line makes the seed's clock+bias offset come from the joint clk + b_sat instead of
    # the clock EMA + SatBiasFilter, per satellite.
    #
    # WHY NOW, and not four hours ago when it was first proposed: the state was not fit to
    # consume. It held n=5 satellites, all GPS, so on this chain every (tag, prn) missed
    # _idx and the consumer could not have fired at all; then with the feed on it sat at
    # clk = -1.2 against a true +151 with 100% of updates rejected, and the 9 Galileo
    # b_sat were degenerate at +0.44 +- 0.005 -- consuming THAT would have handed every
    # satellite the same offset, which is exactly the per-sat correction this is for.
    # Fixed by 3afff78b9 (warm start + corroborated escape). State as deployed:
    # clk +151.24 +- 0.063, 72% accepted, Galileo b_sat spread 1.63 chips over 7 sats.
    #
    # WHAT IT IS AIMED AT: the ~600 s plant oscillation. Live E/P/L on E16 caught a full
    # cycle -- the correlation peak walks prompt -> late -> clean OUT of the E/P/L span
    # (all three taps collapse, deep_snr 95 -> 15) -> back in on early -> prompt, with disc
    # sweeping -0.97 to +0.85 through zero. The "bi-stable" C/N0 is that sweep sampled
    # through the prompt tap: high only during the passage through alignment. Slew-to-model
    # fighting trim-to-sky, and b_sat is the term that makes the model right per satellite.
    #
    # THE CONTROL ARM IS gal_e5b, DELIBERATELY LEFT ALONE. It tracks the SAME satellites on
    # the other band and does not consume, so E16-on-E5a vs E16-on-E5b is a paired A/B at
    # the same instant on the same sky -- which a before/after across a restart is not
    # (the sky moves faster than the investigation). bds_b2a is a second control.
    # Pre-registered baseline 15:57-16:20 UTC, median over sats, rail% / low-state%:
    #     gal_e5a (treated)  2.5 / 25.1      gal_e5b (control)  7.9 / 31.5
    #     bds_b2a (control) 10.4 / 25.3      -- scratchpad baseline.txt
    # Judge on the DIFFERENCE of differences, never on the treated arm alone.
    #
    # REVERT IS THIS ONE LINE. Per-sat fallback beyond --joint-slew-max-chips 5.0 already
    # applies, so a bad offset is refused per satellite rather than shipped.
    joint-consume: slew
    # ...AND UNRAIL THE RATE LIMIT, or the line above cannot show anything. The flat
    # 0.05 chips/event cap had 47% of steps sitting exactly on it while satellites were
    # 5-8 chips from their model -- of order an hour to close, against a ~600 s
    # oscillation -- so moving the target changed the step not at all.
    #
    # ACQUISITION AUTHORITY, TRACKING RESTRAINT (KV's design): a seed far from its target
    # may move at 0.5 chips/event (the E/P/L span), and reverts to the 0.05 crawl once
    # inside 0.2 chips. Keyed on DISTANCE rather than track age so it re-arms when an
    # established track drifts off -- which is the oscillation case itself, and the one an
    # age-based schedule would tighten and then strand.
    #
    # DELIBERATELY NOT SET ON gal_e5b / bds_b2a: they are the control arms.
    dr-slew-cap-acq: 0.5
    dr-slew-near-chips: 0.2
    dr-slew-trust-sigma: 0.5

  # BeiDou B2a -- structurally identical to E5a: same 1176.45 MHz carrier, same 1023000-chip
  # code, same 100 ms CS secondary, so it rides the SAME voltage tap and the same clock. Model-
  # primary for the same reason (a per-PRN secondary has no blind acquisition,
  # CHORD_MULTIBAND.md 5), hence no detectors and --dr-clock-adopt.
  #
  # `signal: bds_b2a` implies constellation C AND --dr-min-prn 19: B2a is a BDS-3 signal and
  # the BDS-2 birds below 19 do not broadcast it. Seeding them would be a confident request for
  # something that is not on the air.
  #
  # ⚠️ THE NODE SIDE IS ONLY 24 PRNs (19-42), NOT the 38 BDS-3 sats in the BRDC: 43-52 and
  # 56-60 are IGSO/GEO over Asia and never clear the horizon at 49.3N (max elevation < 0 over
  # a full day). The broker will predict them, find them below the mask, and never seed them --
  # but the node's lane budget is spent at generation time, so the trim lives in
  # config/gnss_fleet_chord.yaml.
  bds_b2a:
    signal: bds_b2a
    dr-clock-adopt: true
    trackers: "http://cx19:12049/gnss{0..1}_b2a_inject,http://cx27:12049/gnss{0..1}_b2a_inject,\
http://cx42:12049/gnss{0..1}_b2a_inject,http://cx43:12049/gnss{0..1}_b2a_inject,\
http://cx44:12049/gnss{0..1}_b2a_inject,http://cx51:12049/gnss{0..1}_b2a_inject"
    combiner: gnss0_b2a_n2combine
    spectrum-endpoints: "http://cx19:12049/gnss{0..1}_b2a_n2assemble,\
http://cx27:12049/gnss{0..1}_b2a_n2assemble,http://cx42:12049/gnss{0..1}_b2a_n2assemble,\
http://cx43:12049/gnss{0..1}_b2a_n2assemble,http://cx44:12049/gnss{0..1}_b2a_n2assemble,\
http://cx51:12049/gnss{0..1}_b2a_n2assemble"
    dll-combiners: &b2a_cmb "http://cx19:12049/gnss{0..1}_b2a_n2combine,\
http://cx27:12049/gnss{0..1}_b2a_n2combine,http://cx42:12049/gnss{0..1}_b2a_n2combine,\
http://cx43:12049/gnss{0..1}_b2a_n2combine,http://cx44:12049/gnss{0..1}_b2a_n2combine,\
http://cx51:12049/gnss{0..1}_b2a_n2combine"
    n2-combiners: *b2a_cmb

  # -- 1207.14 MHz, the SECOND BAND (2026-08-09) -------------------------------------
  # Same machinery as its 1176.45 MHz sibling above; the ONLY thing that differs is the
  # carrier, which is the entire point. Until these chains existed the instrument was
  # single-band, so `tau_band` (a declared state of the joint solve) had nothing to
  # measure it with, and a per-satellite bias could not be told apart from a per-BAND
  # instrumental delay. Same satellites, same rays, different carrier: the difference IS
  # the discriminator.
  # E5b-Q is a PILOT with a per-PRN CS100 secondary -- structurally identical to E5a-Q, so
  # it rides the baked-CS dead-reckon path that already works and needs no nav-bit wipe.
  # `dr-clock-adopt` because, like every model-primary chain, it runs no detectors and
  # consumes the receiver clock GPS solves (receiver.py: ONE clock, and now genuinely
  # across two bands -- the code clock is per BAND by doctrine, and this is the first
  # configuration that can actually test that claim rather than assert it).
  gal_e5b:
    signal: gal_e5b
    dr-clock-adopt: true
    trackers: "http://cx19:12049/gnss{0..1}_e5b_inject,\
http://cx27:12049/gnss{0..1}_e5b_inject,\
http://cx42:12049/gnss{0..1}_e5b_inject,\
http://cx43:12049/gnss{0..1}_e5b_inject,\
http://cx44:12049/gnss{0..1}_e5b_inject,\
http://cx51:12049/gnss{0..1}_e5b_inject"
    combiner: gnss0_e5b_n2combine
    spectrum-endpoints: "http://cx19:12049/gnss{0..1}_e5b_n2assemble,\
http://cx27:12049/gnss{0..1}_e5b_n2assemble,\
http://cx42:12049/gnss{0..1}_e5b_n2assemble,\
http://cx43:12049/gnss{0..1}_e5b_n2assemble,\
http://cx44:12049/gnss{0..1}_e5b_n2assemble,\
http://cx51:12049/gnss{0..1}_e5b_n2assemble"
    dll-combiners: &e5b_cmb "http://cx19:12049/gnss{0..1}_e5b_n2combine,\
http://cx27:12049/gnss{0..1}_e5b_n2combine,\
http://cx42:12049/gnss{0..1}_e5b_n2combine,\
http://cx43:12049/gnss{0..1}_e5b_n2combine,\
http://cx44:12049/gnss{0..1}_e5b_n2combine,\
http://cx51:12049/gnss{0..1}_e5b_n2combine"
    n2-combiners: *e5b_cmb

  # -- 1207.14 MHz, the SECOND BAND (2026-08-09) -------------------------------------
  # Same machinery as its 1176.45 MHz sibling above; the ONLY thing that differs is the
  # carrier, which is the entire point. Until these chains existed the instrument was
  # single-band, so `tau_band` (a declared state of the joint solve) had nothing to
  # measure it with, and a per-satellite bias could not be told apart from a per-BAND
  # instrumental delay. Same satellites, same rays, different carrier: the difference IS
  # the discriminator.
  # B2b-I is the PPP-B2b DATA channel: secondary_length = 0, no overlay at all (B-CNAV3
  # runs 1000 sps = exactly one symbol per 1 ms code period). That makes it the most
  # SEARCHABLE signal in the descriptor set -- there is no per-PRN CS to hunt, which is
  # precisely what makes E5a-Q/B2a-P structurally un-searchable -- and so the natural
  # first candidate for a searcher that is not GPS.
  # ⚠️ BUT IT IS DATA-ONLY: coherent integration past 1 ms needs nav-bit wipe, which
  # cudaGnssChordTrack does not have (task #31). Expect it to TRACK with modest deep until
  # that lands. It is here for the BAND, not yet for the sensitivity -- judge it on
  # tau/lock, not on deep_snr, and do not "fix" a low deep that is simply this.
  bds_b2b:
    signal: bds_b2b
    dr-clock-adopt: true
    trackers: "http://cx19:12049/gnss{0..1}_b2b_inject,\
http://cx27:12049/gnss{0..1}_b2b_inject,\
http://cx42:12049/gnss{0..1}_b2b_inject,\
http://cx43:12049/gnss{0..1}_b2b_inject,\
http://cx44:12049/gnss{0..1}_b2b_inject,\
http://cx51:12049/gnss{0..1}_b2b_inject"
    combiner: gnss0_b2b_n2combine
    spectrum-endpoints: "http://cx19:12049/gnss{0..1}_b2b_n2assemble,\
http://cx27:12049/gnss{0..1}_b2b_n2assemble,\
http://cx42:12049/gnss{0..1}_b2b_n2assemble,\
http://cx43:12049/gnss{0..1}_b2b_n2assemble,\
http://cx44:12049/gnss{0..1}_b2b_n2assemble,\
http://cx51:12049/gnss{0..1}_b2b_n2assemble"
