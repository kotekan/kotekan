    fleet-trim-bandwidth: 2.5
    fleet-trim-readback: 1
    trackers: "http://cx19:12048/gnss{0..1}_b3i_inject,\
http://cx27:12048/gnss{0..1}_b3i_inject,\
http://cx42:12048/gnss{0..1}_b3i_inject,\
http://cx43:12048/gnss{0..1}_b3i_inject,\
http://cx44:12048/gnss{0..1}_b3i_inject,\
http://cx51:12048/gnss{0..1}_b3i_inject"
    combiner: gnss0_b3i_n2combine
    spectrum-endpoints: "http://cx19:12048/gnss{0..1}_b3i_n2assemble,\
http://cx27:12048/gnss{0..1}_b3i_n2assemble,\
