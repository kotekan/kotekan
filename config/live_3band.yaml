# ---- GLONASS L3OC-d DATA component ----
# The CDMA nav message is 100 bps through a rate-1/2 code = 200 sym/s, so a symbol is
# 5 ms = FIVE 1 ms code periods, and the 5-chip BARKER secondary covers exactly one
# symbol. That is the composed wipe B2a-D / E5a-I / L5-I proved: secondary_overlay
# L3OC_BC5 (one chip per 1 ms period) AND navwipe_bit_records 5 (5 records = 1 symbol).
# ⚠️ Same length as B2A_CS5 but a DIFFERENT sequence -- Barker 11101, not B2a's CS5.
# ★ Before building any message decoder, CHECK THE MODULATION EXISTS with the symbol
# transition rate on a satellite already proven above floor (~0.5 = real message, ~0 =
# unmodulated). That is the lesson GPS L1C-D cost us: a perfectly correct codec spent
# against an empty carrier.
l3oc_d_n_prn: 63
l3oc_d_rec_buf: { kotekan_buffer: standard, metadata_pool: none, num_frames: 1200, frame_size: l3oc_d_n_prn * 24 * 4 }
l3oc_d_out_buf: { kotekan_buffer: standard, metadata_pool: none, num_frames: 16, frame_size: l3oc_d_n_prn * 24 * 4 }
l3oc_d_epl_buf: { kotekan_buffer: standard, metadata_pool: none, num_frames: 16, frame_size: 176 + 1024 * l3oc_d_n_prn + 15360 * l3oc_d_n_prn }
