# integration_length 1000, navwipe_bit_records 20 -> navwipe: integrate ~1 s
# (50 nav bits) coherently; deep |A| in slot 8. (Restored to 1000 once the
# Doppler-rate feed-forward removed the zenith ramp.)
# peel_depth: deep-integrate the peel residual (slots 20-23) beside the prompt ->
# peel_deep / peel_deep_snr on REST; depth_db = 20*log10(deep/peel_deep), valid
# only when deep_snr AND peel_deep_snr clear deep_floor.
# bit_export: publish the navwipe's per-bit sign decisions (nav_obs) for the
# broker's LNAV decode-and-predict -> predicted nav_bits back to the tracker =
