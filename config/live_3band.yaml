# ★ PHASE 2 (2026-07-29): secondary_overlay AND navwipe_bit_records TOGETHER -- the
# COMPOSED wipe. This is the only chain on the node that sets both, and the combiner
# branch that handles it exists for this signal: NH10 comes off each 1 ms l5_record
# first, then the nav-bit wipe runs over 20-l5_record CNAV symbols on the result
# (navwipe_bit_records 20 = 20 ms / 1 ms records -- a TIME expressed in records, so
# it is band-specific; L2C sets 1 because its records ARE 20 ms).
# The NH alignment is searched by the NAVWIPE statistic, not a coherent sum: a
# coherent phase search is meaningless on a data channel past 20 ms. It is searched
# ONCE on the longest window and reused across rungs (the alignment is a property of
# the GPS_L5_Q, not the window).
# THE PRIZE, measured in phase 1: L5-I ran ~14 dB below its L5-Q sibling at the 1 s
# rung, and the deficit GREW with rung length -- the signature of a hard 20 ms
# coherence cap. Wiping the symbols is what lifts it. bit_export then feeds the
# broker's CNAV decoder, giving a second independent decode of the SAME message set
# L2C already decodes -> eph cross-checkable three ways (L2C vs L5 vs BRDC).
#
# PHASE 1 (superseded) = OVERLAY PATH ONLY. L5-I is a DATA channel that ALSO carries a secondary
# overlay (NH10, one +-1 chip per 1 ms l5_record, 10 ms cycle) -- no other chain on
# this node is both, and the combiner treats secondary_overlay and
# navwipe_bit_records as MUTUALLY EXCLUSIVE branches. That crux only bites when we
# want coherence PAST the 20 ms CNAV symbol boundary and the bit export;
# acquisition and tracking do not need it. Wiping NH10 alone coheres to the symbol
# boundary -- the same situation L1 C/A lives in with its 20 ms bits -- so phase 1
# runs the EXISTING overlay path (the one L5-Q runs with NH20) and defers the
# branch merge to phase 2. L5_NH10 was already in the overlay registry bound to
# GPS_L5_I (gnssOverlay.cpp:54). NO navwipe_bit_records, NO bit_export: phase 2.
# ★ integration_length 4000 (= 4 s at 1 ms records) IS NOT ABOUT COHERENCE -- the
# ladder still finds its knee near 1 s. It sets the EMIT SPAN, and the emit span is
# what the CNAV decoder consumes. nav_obs is exported on the FULL window only, so
# the span of one emit is integration_length x l5_record period. The decoder's window
# constants (WIN_EMITS 7, COLD_EMITS 5) are COUNTS OF EMITS, and its cold bootstrap
# is 2^COLD_EMITS Viterbis, so the count cannot simply be raised: 12 emits would be
# 4096. A CNAV message is 600 symbols (12 s), so an emit must carry enough symbols
# that a handful of them span one. L2C gets this for free (200 records x 20 ms =
# 4 s); at 1 s L5-I would have offered 350 symbols per 7-emit window against the 600
# needed and would have decoded NEVER, silently. Matching the span (4 s here too)
# makes the decoder's emit counts mean the same thing on both bands.
# Same COUNT-vs-TIME trap as 16 / coherence_s / navwipe_bit_records: the
# constant is dimensionless, the bands disagree about what the unit is worth.
# Cost is linear in the window -- l5_i duty ~0.008 at 1 s -> ~0.03 at 4 s, still
# negligible beside the 1.56 the missing buffer clear used to cost.
#
# THE PHASE-1 MEASUREMENT, still UNANSWERED: the auto-coherence ladder should knee
# AT 20 ms -- the data-bit limit. The 07-29 trial could not answer it because the
# rungs were read while frames were dropping (climbing valves invalidate every
# depth number). This run, with the peel off, is the first chance to read it.
