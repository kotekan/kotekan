# ---- BeiDou-3 B2a-DATA component (S5 D-component #3: B-CNAV2, first LDPC) ----
# DERIVED from B2a-P exactly as E5a-I is from E5a-Q and L5-I from L5-Q: no search stage.
# B2a-D (data) and B2a-P (pilot) share the SAME 10230-chip primary period and epoch
# (their codes differ only in the generator polys) -- so a B2a-D row is the B2a-P row
# VERBATIM: no code-phase lift, no broker flag. run_live adds b2a_d_track to the BDS
# broker's --trackers so it gets the same consensus seeds as bds_track (B2a-P). The
# combiner wipes the 5-chip CS5 secondary AND exports the per-5ms-symbol signs
# (secondary_overlay B2A_CS5 + navwipe_bit_records 5 + bit_export -- the composed wipe
# E5a-I/L5-I proved, since a B-CNAV2 symbol is 5 ms = one CS5 period). run_live hands
# l5_b2a_d_combiner to the broker as --bcnav2-combiner so its nav_obs reach the
# Bcnav2Predictor (beidou_bcnav2's GF(64) NON-BINARY LDPC codec) and the decoded
# B-CNAV2 ephemeris is cross-checked against BRDC -- BeiDou's first nav-message decode
# here, beside the two Galileo ones (E1B I/NAV, E5a F/NAV).
# GPU BUDGET: 6th L5 chain -- MEASURE l5_valve after enabling (loaded band; peel OFF).
# l5_rec_buf sized in TIME (the L5-I / count-vs-time lesson).
