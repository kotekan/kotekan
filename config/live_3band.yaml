    commands:
        - name: cudaInputData
          in_buf: l1_q_buf
          gpu_mem: l1_gal_chan_frame
        - name: cudaGnssTrack
          # Re-pin the replica carrier EVERY l1_record (0 = no anchor age at all). Safe only
          # because the re-pin is now CONTINUOUS in both currencies: the code-phase step is
          # translated into the new f_ref (cudaGnssTrack) and the df*t_abs carrier-phase step
          # is folded into the NCO (GnssGpuRecordAssemble). With a stale f_ref the despread
          # carrier drifts off the truth at dop_rate between re-pins, and the resulting
