# ---- GPS L5-I DATA component (S4 part 2, PHASE 1: acquire/track only) ----
# The second Mechanism-A chain (docs/gnss_shared_knowledge_framework.md, S4).
# NO SEARCH STAGE, deliberately: like CL, L5-I is DERIVED, not acquired.
# ★ SIMPLER THAN CL. CM->CL needed a code-phase lift (cp + k*10230) because CM and
# CL are chip-interleaved on a 1.5 s period. L5-I and L5-Q share the SAME 10230-chip
# primary code, the SAME 1 ms period and the SAME code epoch -- only the XB advance
# differs -- so an L5-I row is the L5-Q row VERBATIM: no lift, no segment index k,
# and no broker flag at all. The endpoint is named `i_track` precisely so it lands in
# run_live.sh's auto-detected --trackers list (that grep excludes only
# ^(gal|bds|l1c|cl)_), and the GPS broker POSTs it the same consensus payload it
# sends L5-Q. Verified the trackers list is used ONLY to POST seeds -- no per-tracker
# status reads a derived chain could confuse. L5-Q stays as the in-run control.
# ★ PROVEN ON SKY 2026-07-29 00:56-01:08Z: acquired + certified within ~3 min off the
# derived seeds (PRN 27 deep_snr 40, 26 38, 3 26, 28 21). That trial was REVERTED not
# because the chain failed but because it did not fit real time ON TOP of three
# PEELING L5 chains (/l5_valve 0 -> 2931 in ~3 min). The L5 peel is now OFF (see the
# gps chain note), which is what buys the budget for this.
# NO peel on this chain either -- so NO epl_frame override (ROWS_PLAIN 4 -> the shared
# 15360 default). Overriding it to the peel-sized 23040 is what failed the first
# launch: the buffer asked 770224 while the tracker allocated 524464.
