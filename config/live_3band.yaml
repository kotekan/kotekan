    bytes_per_sample: 2
    buffer_depth: 16
    sizeof_float: 4
    spectrum_length: 10
    num_taps: 4
    sample_rate: 20.0e6
    f_offset: 5.0e6
    code_doppler_sign: 1.0
    record_floats: 20
