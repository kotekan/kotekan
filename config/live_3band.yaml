# SHARED-INPUT tri-constellation GPU stage. All three L5 signals despread the SAME
# channelized voltage, so ONE cudaInputData copies l5_q_buf -> gnss_chan_frame per frame
# and all three cudaGnssTrack commands read it (previously 3 stages = 3x the H2D
# traffic on the GB10's bandwidth-limited unified memory). Sequencing: cudaInputData
# runs on stream 0 (COPY_IN default); every cudaGnssTrack waits the shared input event
# (pre_events[0] explicitly, NOT its own stream's), then the three tracker+output pairs
# run CONCURRENTLY on streams 1/2/3, joined back on stream 0 by cudaProcess. The
# trackers keep their own seed_endpoints so the per-constellation brokers are unchanged
# (run_live detects them by seed_endpoint, not a top-level gal_track:/bds_track: stage).
#
# PER-CHAIN STREAMS (2026-07-27), the L1 arrangement adopted here. L5 is the band with
# the least slack -- 2.496 ms of frame period against 0.91 ms of tracker work, where L1
# has 9.984 ms -- and all three chains were serialized on one stream (0.32 + 0.30 +
# 0.29 ms). Nothing needs them serialized: they read the same input and write disjoint
# outputs. One launch is ~32 x 10 blocks x 256 threads, ~20% of the GB10's 48 SMs,
# so the three overlap nearly free and the tracker phase collapses toward its longest
