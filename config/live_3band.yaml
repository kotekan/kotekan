# ---- Galileo E1-C parallel chain (same channelized stream, second consumers) ----
# E1-C = the dataless BOC(1,1) pilot, 4 ms primary (4000 hops/l1_record), CS25
# secondary wiped deterministically (secondary_overlay). Tracking on the shared GPU
# process (the CPU tracker burned 90% of a core on ONE held sat at 4000-hop
# records). Stage names keep the gal_ prefix so the broker REST prefix +
# run_live's auto-launch keep working unchanged.
l1_gal_rec_buf: { kotekan_buffer: standard, metadata_pool: none, num_frames: 16, frame_size: 3456 }
l1_gal_out_buf: { kotekan_buffer: standard, metadata_pool: none, num_frames: 16, frame_size: 3456 }
l1_gal_epl_buf: { kotekan_buffer: standard, metadata_pool: none, num_frames: 16, frame_size: 866480 }
# E1-C budget vs GPS C/A: pilot -3 dB, band truncation ~-2.5 dB, Interplex
# alpha/sqrt2 -1.3 dB => strongest sats ~6-7 dB below GPS equivalents. 4 ms
# windows recover +3 dB/window; deepen the incoherent stack + lower the gate to
# compensate (the drop-tolerant snapshot makes long windows safe).
