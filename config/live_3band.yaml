# flag. run_live adds l1c_d_track to the L1C broker's --trackers so it gets the same
# consensus seeds as l1c_track (L1C-P). PURE DATA channel with NO secondary:
# navwipe_bit_records 1 (one 10 ms code period = one CNAV-2 symbol) + bit_export, no
# secondary_overlay (the 1800-symbol overlay is the L1C-P PILOT's). run_live hands
# l1_l1c_d_combiner to the broker as --cnav2-combiner so its nav_obs reach the Cnav2Predictor
# (binary LDPC) and the decoded CNAV-2 ephemeris is cross-checked vs BRDC -- completing the
# GPS L1C pilot+data pair (only ~10 Block-III sats broadcast it).
# ⚠️ CNAV-2's frame is 18 s (like B-CNAV1): needs a phase-CONTINUOUS run to decode. GPU:
