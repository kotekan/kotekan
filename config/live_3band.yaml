# ---- GPS L1C-DATA component (CNAV-2) ----
# DERIVED from L1C-P exactly as B1C-D is from B1C-P: no search stage. L1C-D (data) and
# L1C-P (pilot) share the SAME 10230-chip BOC(1,1) primary period and epoch (codes differ
