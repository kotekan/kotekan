    cpu_affinity: [12]
    kotekan_stage: airspyInput
    out_buf: l3oc_input_buf
    # PIN THE DEVICE BY SERIAL (0 / absent = "open whichever enumerates first" -- a silent
    # coin-flip with three dongles plugged in: the wrong board tunes, never acquires, looks
    # like a bad antenna). Written in HEX exactly as airspy_info prints it. THE TRAP: a
    # serial that fails to parse becomes 0 = "open any", which still WORKS with one dongle
    # -- verify a new pin by BREAKING it (a wrong serial must fail AIRSPY_ERROR_NOT_FOUND).
    serial: 0x744C60C821692F4F  # ASSIGNED from the dongle pool: unit B (historically L2C) (slot 1 of BANDS='l1 l3oc'). Not a pin -- see the `dongles:` note.
    freq: 1202.025
    sample_bw: 10  # airspy 10 MSPS mode -> 20 MSPS real (10.23 Mcps L3OC needs the wide mode)
    gain_lna: 11
    gain_mix: 11
    gain_if: 11
    # OFF as of the 3-airspy rework (2026-07-14): the ACTIVE antenna is powered by a
    # SEPARATE inline bias tee, not the dongle. Three dongles pushing DC into a common
    # splitter is the failure mode to avoid. HISTORY: this was `true` and had to be (antenna
    # dead without bias, A/B confirmed) -- if the external supply is removed, back to true.
    biast_power: false
    # Disable the R820T fractional-N PLL dither (reg 0x12 bit4) for COHERENT multi-unit
    # work: all three airspys share ONE GPSDO, dither off = deterministic LO across restarts
    # (phase-coherent), at the cost of deterministic frac-N spurs.
    dither_disable: true
