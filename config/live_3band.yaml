    samples_per_data_set: 199680
    bytes_per_sample: 2
    buffer_depth: 16
    valve_depth: 51
    sizeof_float: 4
    spectrum_length: 10
    num_taps: 4
    sample_rate: 20.0e6
    f_offset: 5.0e6
    signal: GPS_L1CA
    code_doppler_sign: 1.0
    n_prn: 32
    record_floats: 26
