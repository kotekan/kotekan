---
# Minimal airspy streaming test: airspyInput -> rawFileWrite (raw int16).
# Isolates the F-engine from the correlator. A healthy stream writes ~5 MB/s
# (2.5 MSPS x 2 bytes). Run: kotekan -c airspy_capture.yaml -b 0.0.0.0:12055
type: config
log_level: info
instrument_name: airspy_gps

telescope:
    name: ICETelescope
    num_polarizations: 1
    num_dishes: 1

samples_per_data_set: 50000
bytes_per_sample: 2
buffer_depth: 10
cpu_affinity: [0, 1, 2, 3]

sample_bw: 2.5
freq: 1575.42
gain_lna: 14
gain_mix: 15
gain_if: 15
# OFF: the active antenna is powered by a SEPARATE inline bias tee as of the 3-airspy
# rework (2026-07-14). Three dongles pushing DC into a shared splitter is the failure
# mode to avoid; the antenna LNA wants exactly one supply. Set true ONLY if the feed is
# ever back on a single dongle with no external supply (the antenna IS active -- it is
# dead without bias from somewhere; A/B confirmed).
biast_power: false
dither_disable: false

input_buf:
    kotekan_buffer: standard
    metadata_pool: none
    num_frames: buffer_depth
    frame_size: samples_per_data_set * bytes_per_sample

airspy_input:
    kotekan_stage: airspyInput
    out_buf: input_buf
    serial: 8380179419296242767   # 0x744C60C821311C4F (per user)

capture:
    kotekan_stage: rawFileWrite
    in_buf: input_buf
    base_dir: "./cap"
    file_name: "raw"
    file_ext: "bin"
    prefix_hostname: false
