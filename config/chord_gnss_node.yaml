---
# =============================================================================================
# chord_gnss_node.yaml -- SINGLE SOURCE OF TRUTH for the CHORD-side GNSS instrument.
#
#   Mirrors the role gnss_node.yaml plays for the airspy node: every per-node config is
#   GENERATED from this table. Hand-editing a generated config is a bug.
#
#   Unlike the airspy node, a CHORD node cannot run a second kotekan instance -- DPDK owns
#   the NICs exclusively -- so a generated config is the LIVE PRODUCTION CONFIG PLUS a GNSS
#   branch. The generator takes the production config as its base and injects; it never
#   restates the production pipeline, so upstream changes to config/chord/pathfinder.j2 are picked
#   up automatically.
#
# PROVENANCE. Every value below is either measured on cx19 (2026-07-28/29), read out of the
# kotekan source, or quoted from the CRS F-engine paper (arXiv:2607.01625).
# =============================================================================================

fengine:
  # arXiv:2607.01625 s2.2.2 -- and cross-checked against the live config + kotekan source.
    sampling_rate_MHz: 3200.0   # pure real sampling, Nyquist zone 1 -> 0..1600 MHz
    fft_length: 16384           # M real samples per frame (one hop = 5120 ns)
    num_bins: 8192              # positive-frequency bins
    channel_width_hz: 195312.5  # 1600 MHz / 8192
  # ── THE RECORD EPOCH IS NO LONGER PINNED HERE (2026-08-18) ────────────────────────
  # frame0_utc used to hold the GPS-disciplined UTC of absolute sample 0, hand-copied from
  # telescope/time0_ns. It is now taken at runtime from Telescope::to_time_ns(0) -- the same
  # number, fetched live from the FPGA controller at startup, with the GPS week-rollover
  # correction that a pasted constant does not carry. The generator emits no frame0_utc
  # unless a value is set here or --frame0-nano is passed.
  #
  # ⚠️ IT WENT STALE TWICE AND BOTH TIMES NOTHING DOWNSTREAM COULD SEE IT: 13.78 days from
  # 2026-07-24, and 9.165 days on 2026-08-18 when the F-engine restarted at 18:30 UTC during
  # site work. /telescope served the truth throughout while every GNSS record would have been
  # stamped days in the past -- invisible because every cross-record estimator works in
  # DIFFERENCES, so a uniformly-wrong epoch stays uniform. A value the process can look up
  # should never be pasted into a config.
  #
  # SET IT AGAIN ONLY TO OVERRIDE the telescope deliberately -- e.g. replaying without
  # chive's timing service, the case --frame0-nano exists for. An explicit value WINS over
  # the telescope (an operator who sets it means it) and the stage logs a loud conflict if
  # the two disagree, so a forgotten pin cannot masquerade as agreement.
    pfb_taps: 4                 # "Ntaps=4-tap Hamming window ... 18-bit coefficient resolution"
    pfb_window: hamming         # critically sampled (CASPER pfb_fir_real block)
  # The FFT emits bins in decimation-in-frequency (bit-reversed) order and the reordering is
  # "compensated for in downstream software" UPSTREAM of our tap point. Confirmed two ways:
  # CHORDTelescope::to_freq_id reproduces the measured comb exactly, and the eigenvalue
  # spectrum is smooth in freq_id (neighbour/scatter 0.086 vs 0.221 shuffled). So:
  #     centre_hz(freq_id) = freq_id * channel_width_hz
  # Sample encoding at host_voltage_buffer: int4x2_swapped_withoffset, 1 byte per complex
  # sample, HIGH nibble = REAL, LOW nibble = IMAG, each stored as value+8. The "swapped" in
  # the type name means exactly this: component [0] is imag, [1] is real.
  #   real = ((b & 0xf0) >> 4) - 8      imag = (b & 0x0f) - 8
  # Authoritative source is lib/testing/gpuSimulate.cpp, the correlator reference model the
  # CHIME/CHORD X-engine is validated against (and lib/cuda/cudaGnssDespreadKernel.hpp
  # states the same contract).
  # TRAP: external/n2k/src_lib/s12_kernel.cu names the LOW nibble "real". That kernel only
  # forms square(re)+square(im), which is symmetric, so the mislabel is invisible there --
  # but copying its naming into a correlation conjugates the data. Magnitudes and the DLL
  # would still look correct while carrier phase ran backwards.
  # The F-engine clips to -7..+7, so a stored nibble of 0 must NEVER appear -- assert on it.

clock:
  # arXiv:2607.01625 s2 -- GNSS-disciplined 10 MHz + IRIG-B (Spectrum Instruments TM-4),
  # dual-PLL/TCXO. The ADC clock is frequency-locked to GNSS, so the +2.6 ppm LO-vs-ADC
  # offset (l-a) that gated the airspy node should start at ~0 here. MEASURE, don't assume.
    profile: gpsdo

signals:
  # All three share the 1176.45 MHz carrier and therefore the SAME covering channels --
  # adding E5a/B2a costs no extra bandwidth, nodes, or GPU input, and roughly triples
  # source density. That matters because GPS's 55 deg inclination leaves a coverage hole
  # toward the north from latitude 49.3 N.
    primary: GPS_L5_Q           # dataless pilot, 10230 chips, 1 ms primary, NH20 secondary
  # TRACKER-ONLY signal: the NH20 overlay baked into a 204600-chip / 20 ms code, so a
  # multi-period record despreads coherently (a 10.5 ms record of the bare primary spans
  # ~10 NH chips whose signs mostly cancel -- measured 2026-07-31, snr-40 sat invisible per
  # record). The search keeps `primary` + its nh_search; seeds' cp lives mod 204600.
    tracker: GPS_L5_Q_NH
    also_available: [GAL_E5A_Q, BDS_B2A_P]
    carrier_hz: 1176.45e6
    chip_rate_hz: 10.23e6
  # Worst-case |Doppler| used to widen the occupied band. GPS geometric Doppler is
  # ~+/-4.5 kHz at L1 for a stationary receiver; scaled to L5 that is ~+/-3.4 kHz.
  # 5 kHz carries margin for clock error. (Negligible next to a 10.23 MHz half-band, but
  # the band-plan math takes it, so state it explicitly rather than pass 0.)
    max_doppler_hz: 5000.0
  # f_offset FOR THE REPLICA BANK = THE SKY CARRIER, not an intermediate frequency.
  # This differs from the airspy node and it is the single easiest thing to get wrong here.
  # The airspy DOWNCONVERTS, so its f_offset is the post-mixer IF (1.25 MHz, 5 MHz, ...).
  # CHORD does not downconvert: the RFSoC samples 0-1600 MHz directly and L5 lands at bin
  # 6023 of 8192. ChannelizedReplicaBank places the replica at f_offset and covering_bins()
  # sets local.carrier_hz = f_offset, so the default 0.0 builds the replica at DC, puts its
  # covering bins at -51..52, and every correlation against real data (bins 5971..6076) is
  # noise. It fails SILENTLY in both directions: the search reports "carrier not in this
  # subband" and publishes nothing, and the tracker reports amp_snr 0 with a railed DLL --
  # which looks exactly like an unknown instrumental delay, and cost a full debugging cycle
  # chasing one.

science_band:
  # freq_id = min_science_freq_id + index*128 + stream_id, index 0..47, stream_id 0..127
  # (CHORDTelescope::to_freq_id). So the science band is exactly 48*128 = 6144 channels.
    min_freq_id: 1536           # 300.000 MHz
    max_freq_id: 7679           # 1499.805 MHz

nodes:
  # MEASURED from each node's /metrics on 2026-07-29 (eigencalc freq_id sets).
  # A node holds every freq_id == comb_offset_mod8 (mod 8) within the science band: 768
  # channels, split across its two GPUs as two stride-16 combs. Pairwise overlap between
  # all four nodes is exactly zero, as expected -- each node owns 16 of the 128 stream_ids.
  #
  # These offsets are a SITE WIRING FACT, not something the config declares, so the
  # generator emits a runtime assertion that the observed freq_ids match what is claimed
  # here. If the wiring is ever changed, that assertion is what will catch it.
    cx19: {comb_offset_mod8: 4, gpu_offsets_mod16: [4, 12]}
    cx27: {comb_offset_mod8: 0, gpu_offsets_mod16: [0, 8]}
    cx42: {comb_offset_mod8: 5, gpu_offsets_mod16: [5, 13]}
    cx43: {comb_offset_mod8: 6, gpu_offsets_mod16: [6, 14]}
    cx44: {comb_offset_mod8: 2, gpu_offsets_mod16: [2, 10]}
    cx47: {comb_offset_mod8: 3, gpu_offsets_mod16: [3, 11]}
    cx51: {comb_offset_mod8: 7, gpu_offsets_mod16: [7, 15]}
    cx52: {comb_offset_mod8: 1, gpu_offsets_mod16: [1, 9]}
  # ALL EIGHT mod-8 offsets are present and pairwise disjoint, so the eight nodes TILE the
  # science band exactly: 8 x 768 = 6144 channels = freq_id 1536..7679, nothing missing and
  # nothing duplicated (verified against live /metrics from all eight, 2026-07-29). The comb is
  # therefore not a sampling limitation at full deployment -- only a limitation on how few nodes
  # we run.

  # Bring-up order. cx19+cx27 first: offsets {0,4} are equally spaced, so their union is a clean uniform stride-4
  # comb with an analytic delay response -- worth more during bring-up than extra channels. Then
  # widen. At all eight the comb closes completely: no channel loss, no aliasing, and ~8.8 dB more
  # despread SNR than one node, which converts directly into beam-map dynamic range.
    bringup_order: [cx19, cx27, cx42, cx43, cx44, cx47, cx51, cx52]

array:
  # 32 of 128 elements carry data (SK ~1.0); the rest read flat.
  # element index -> dish = e % 64, pol = e / 64  (64 dishes x 2 pols; CHORDBeamformer order,
  # which is the fiducial order -- NOT the dish*2+pol of CHORDEarly).
  # ⚠️ NOT CONTIGUOUS SINCE 2026-08-31. The production config's dpdk gained
  # crs_board_remap [0,2,4,...,1,3,5,...] (pol grouping) and missing_source_ids moved to
  # [2,3,4,5,6,7,10,11,12,13,14,15], so the four live CRS boards land at OUTPUT LOCATIONS
  # 0,1,8,9 -- pol 0 of dishes 0-15 at elements 0-15, pol 1 of the same dishes at 64-79.
  # The element axis is now properly [P][D] (it was pol-interleaved-per-board before).
  # Element 0 is the SAME PHYSICAL FEED either way (remap[0] == 0), which is the only
  # reason the GPS search reference did not move.
    live_element_ranges: [[0, 15], [64, 79]]
  # Rows A and B only (16 dual-pol dishes); rows C/D are configured but not instrumented.
  # Authoritative liveness is per-feed despread SNR, computed live.
  #
  # F-ENGINE DIGITAL GAINS (not read by any tool; for reference). Per-bin, per-input gain
  # applied in firmware before the 4+4 bit requantization, served as hdf5 by
  # http://10.222.0.54:54321/get-current-gain-file (gain_coeff[1, 8192, 128]). Stored complex64
  # but PURELY REAL; gain_exp == -1 uniformly. They are part of the sky-to-bits chain and are
  # absorbed into the end-to-end gain we solve for -- they are NOT divided out.

runtime:
  # Cores verified free on cx19: unclaimed by the production config AND measured idle.
  # DPDK poll cores (5-7, 21-23 and their isolcpus siblings 37-39, 53-55) are at 0% idle
  # and must never be touched. NUMA1 keeps us on the same domain as host_voltage_buffer_1.
  #
  # ⚠️ SPLIT PER GPU 2026-08-31, AND THE OLD SINGLE LIST WAS ALL NUMA1. `nvidia-smi topo`:
  # GPU0 is NUMA node 0 (cpus 0-15, 32-47), GPU1 is NUMA node 1 (16-31, 48-63). Every core
  # in the list below the split -- 19, 24, 31, 57-63 -- is on node 1, so the gnss1_* stages
  # were right and EVERY gnss0_* stage drove GPU0 from the wrong domain, crossing the
  # interconnect on every submission. Worse, both halves' stages shared those ten cores, so
  # node 1 carried all 14 cudaProcess instances (4 of them colliding outright on the same
  # LOGICAL cpu, violating the "two cudaProcess stages must not share a core" rule below --
  # unsatisfiable once the third band took us from 5 chains to 7).
  #
  # So: one pool per GPU, each on that GPU's own node. HT sharing with production is
  # accepted (KV, 2026-08-31) -- what must never be shared is a LOGICAL cpu with another
  # cudaProcess, and a DPDK physical core with anything. Hence node0 skips 5-7 AND their
  # siblings 37-39, node1 skips 21-23 AND 53-55.
  # gpu0 (NUMA0): 4 plus 32-36,40-47 -- siblings of production's 0-3,8-15, which is fine.
  # gpu1 (NUMA1): the proven ten, unchanged, now carrying HALF the stages it used to.
    cpu_affinity_gpu0: [4, 32, 33, 34, 35, 36, 40, 41, 42, 43]
    cpu_affinity_gpu1: [19, 24, 31, 57, 58, 59, 60, 61, 62, 63]
  # Legacy/node-level pool: the aggregator and gather are not per-GPU and keep using this.
    cpu_affinity: [19, 24, 31, 57, 58, 59, 60, 61, 62, 63]
  # ⚠️ MOVED 12049 -> 12048 ON 2026-08-19, AND THE REASON IS THE CONTROL PLANE, NOT A
  # PREFERENCE. Earth-orientation data is PUSHED to each node over REST
  # (telescope.eop_updatable_config = /earth_rotation_data), and that push targets 12048.
  # Sitting on 12049 meant we never received it: our EOP table froze at 2026-08-01 and
  # cx19 logged 17,085,672 "Requesting EOP later than in table" warnings against stock node
  # cx47's ZERO. The consequence was not cosmetic -- dUT1 was 5.007 ms wrong, which put the
  # same error into every frame's time_center_ut1_ns and bin_t_inst_ns and killed recv1's
  # hdf5 writer the moment we sent it N^2 (2026-08-19 01:45).
  #
  # THE OLD COMMENT SAID "production owns 12048", and that was true of stock nodes but not
  # of ours: nothing answers on 12048 across cx19/27/42/43/44/51, while cx47/cx52 do. Our
  # kotekan REPLACED production's on these six rather than joining it, so the port was free
  # all along and the separation was costing us the updates we needed.
    rest_port: 12048
  # PINNED, not derived. The search aggregator runs on cf06 and used to be rest_port + 1;
  # moving the node port would have dragged it from 12050 to 12049 and broken the
  # `detectors:` URL for no reason. Two different hosts should not share one number.
    aggregator_rest_port: 12050
  # STOCK nodes to fall back on when asking the fleet for a current Earth-orientation table
  # (see live_eop_table). Ours are asked first; these are the ones production keeps refreshed,
  # and after a long outage of our own they are the only current source on site. Not in
  # `nodes:` because we do not generate or run anything on them.
    eop_reference_nodes: [cx47, cx52]
  # /home is NFS (shared across all four nodes -- good for code/config, wrong for records).
  # /tmp/gnss, NOT /data/gnss. /data exists ONLY on cx19 -- the other seven nodes have no
  # such path, and rawFileWrite takes base_dir straight from the config and dies on a
  # directory that is not there (all eight nodes SIGSEGV'd ~46 s in, 2026-08-02). /tmp is on
  # the same 3.5 TB nvme as / (3.2 TB free), so this is the same disk, not a ramdisk.
  # Deliberately NOT fixed by creating /data on the other nodes: a /data that exists only
  # because we made it is exactly the path people start dumping into by accident.
    record_dir: /tmp/gnss
