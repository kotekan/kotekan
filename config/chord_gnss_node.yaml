---
# =============================================================================================
# chord_gnss_node.yaml -- the source of truth for the CHORD-side GNSS instrument.
#
#   config/gen_chord_gnss_config.py generates every per-node GNSS config from this table;
#   hand-editing a generated config is a bug. DPDK owns a CHORD node's NICs, so a node cannot
#   run a second kotekan: a generated config is the production config (--base,
#   config/chord/pathfinder.j2) plus an injected GNSS branch, so upstream changes carry through.
#   Values come from the kotekan source, the site wiring, or arXiv:2607.01625 (CRS F-engine).
# =============================================================================================

fengine:
    # arXiv:2607.01625 s2.2.2.
    sampling_rate_MHz: 3200.0   # real sampling, Nyquist zone 1 -> 0..1600 MHz
    fft_length: 16384           # real samples per FFT (one hop = 5.12 us)
    num_bins: 8192              # positive-frequency bins
    channel_width_hz: 195312.5  # 1600 MHz / 8192
    # frame0_utc (UTC of absolute sample 0, the record epoch) is unset on purpose: the stages take
    # it from Telescope::to_time_ns(0), read at startup. A pinned value goes stale at the next
    # F-engine restart and only the stage's conflict warning shows it, since cross-record
    # estimators work in differences. Set it only to override the telescope, e.g. for a replay
    # without chive's timing service; it then wins, and the generator refuses a value that
    # disagrees with the running fleet.
    pfb_taps: 4                 # "Ntaps=4-tap Hamming window ... 18-bit coefficient resolution"
    pfb_window: hamming         # critically sampled (CASPER pfb_fir_real block)
    # Bins arrive in natural order (the FFT's bit-reversed output is reordered upstream), so
    #     centre_hz(freq_id) = freq_id * channel_width_hz
    # Samples at host_voltage_buffer are int4x2_swapped_withoffset, one byte per complex sample
    # ("swapped": component [0], the low nibble, is imag), decoded as in gpuSimulate.cpp and
    # gnss44::unpack:
    #     real = ((b & 0xf0) >> 4) - 8      imag = (b & 0x0f) - 8
    # The F-engine's output is conjugated relative to this decode (the same, up to a constant
    # phase, as swapped nibbles), which power and magnitude checks cannot see; every GNSS leg
    # conjugates the data or the replica (`conjugate: true`). The F-engine clips to -7..+7, so a
    # stored nibble of 0 does not occur.

clock:
    # The ADC clock is GNSS-disciplined (arXiv:2607.01625 s2). `gpsdo` is the only /clock_profile
    # name GnssChannelizedSearch accepts; it sets the Doppler search range (clockProfile.hpp).
    profile: gpsdo

signals:
    # The primary chain's and the search's signal; other chains come from --extra-signal
    # (config/gnss_fleet_chord.yaml).
    primary: GPS_L5_Q           # dataless pilot, 10230 chips, 1 ms primary, NH20 secondary
    # The primary chain's tracker code: NH20 tiled into one 204600-chip, 20 ms code, so a 10.5 ms
    # record despreads coherently instead of summing ~10 NH chips that largely cancel. The search
    # uses `primary` with nh_search.
    tracker: GPS_L5_Q_NH
    # Same carrier, so the same covering channels. Printed by chord_band_plan.py only.
    also_available: [GAL_E5A_Q, BDS_B2A_P]
    # Also the replica's f_offset, which is the sky carrier, not an IF: CHORD samples 0-1600 MHz
    # directly (L5 is freq_id ~6023). An f_offset of 0 puts the replica at DC, where it overlaps
    # no data channel, and the search and tracker see only noise without an error.
    carrier_hz: 1176.45e6
    chip_rate_hz: 10.23e6
    # Worst-case |Doppler| for every chain: it widens the band plan's occupied band and is the
    # search's doppler_margin_hz. GPS geometric Doppler is ~+/-3.4 kHz at L5 for a stationary
    # receiver; 5 kHz leaves margin for clock error.
    max_doppler_hz: 5000.0

science_band:
    # freq_id = min_science_freq_id + index*128 + stream_id, index 0..47, stream_id 0..127
    # (CHORDTelescope::to_freq_id), so the science band is 48*128 = 6144 channels.
    min_freq_id: 1536           # 300.000 MHz
    max_freq_id: 7679           # 1499.805 MHz

nodes:
    # A node holds two stride-16 combs of science-band freq_ids, one per GPU (gpu_offsets_mod16,
    # GPU0 first), 768 channels; the sixteen combs tile the band. The second comb is not always
    # the first + 8: which comb reaches which NIC port is a site wiring fact that no stage
    # checks against the frames, so copy a rewiring here by hand from each GPU's tap
    # (gnss<g>_srch_tap/rf_stats freq_ids, labelled from the frame metadata). A wrong entry
    # leaves that GPU's chains despreading channels 195 kHz per step off their replicas: ~1/7
    # power at one step, nothing at two. comb_offset_mod8 is the GPU0 comb's residue mod 8,
    # chord_band_plan.py's report order only. cx47 and cx52 run production only and are listed
    # for their combs; cx27's GPU1 comb is as wired before 2026-10-17 (its port was down at
    # the F-engine return) and needs reading when the port is back.
    cx19: {comb_offset_mod8: 4, gpu_offsets_mod16: [4, 14]}
    cx27: {comb_offset_mod8: 0, gpu_offsets_mod16: [0, 8]}
    cx42: {comb_offset_mod8: 5, gpu_offsets_mod16: [5, 12]}
    cx43: {comb_offset_mod8: 6, gpu_offsets_mod16: [6, 15]}
    cx44: {comb_offset_mod8: 2, gpu_offsets_mod16: [2, 10]}
    cx47: {comb_offset_mod8: 3, gpu_offsets_mod16: [3, 11]}
    cx51: {comb_offset_mod8: 7, gpu_offsets_mod16: [7, 13]}
    cx52: {comb_offset_mod8: 1, gpu_offsets_mod16: [1, 9]}

    # chord_band_plan.py's default report order. cx19 and cx27 (offsets 4, 0) first: together
    # they form a uniform stride-4 comb with an analytic delay response.
    bringup_order: [cx19, cx27, cx42, cx43, cx44, cx47, cx51, cx52]

array:
    # Element e -> dish = e % 64, pol = e / 64 ([P][D], CHORDBeamformer order). Production's
    # crs_board_remap (config/chord/pathfinder.j2) puts dish slot d (config/chord/telescope.j2:
    # rows A-H, eight dishes each) at elements d (pol 0) and 64 + d (pol 1). Rows A-F are live:
    # 0-47 and 64-111. Row G (48-55) delivers too but cannot join alone, since ranges must be
    # 16-aligned (live_tile_columns) and 48-63 would bring row H, which is silent. The two ranges
    # must be one pol each and equal in length: the shared model splits pols at n/2. The search
    # taps the first element of the first range.
    live_element_ranges: [[0, 47], [64, 111]]
    # The F-engine's per-bin, per-input digital gains (applied before requantization, served at
    # http://10.222.0.54:54321/get-current-gain-file) stay part of the end-to-end gain: nothing
    # here divides them out.

runtime:
    # One pool per GPU on that GPU's NUMA node (GPU0: cpus 0-15, 32-47; GPU1: 16-31, 48-63), ten
    # cores, coprime to dual_core()'s stride of 3. Production (pathfinder.j2: numa_halves and
    # the DPDK lcores) uses every core in 0-31, so the pools hold only HT siblings (32-63), which
    # are fine; never a DPDK RX lcore's sibling (37-39, 53-55), and never one logical cpu for two
    # cudaProcess stages. pool[0] is the core of the GPU's merged cudaProcess (dual_core).
    cpu_affinity_gpu0: [44, 32, 33, 34, 35, 36, 40, 41, 42, 43]
    cpu_affinity_gpu1: [48, 49, 50, 57, 58, 59, 60, 61, 62, 63]
    # Cores of the node's REST server and the cube archiver, and the default for the aggregator
    # and gather (--aggregator-cores, --gather-cores): GPU1's pool, clear of production's cores
    # on the same rule.
    cpu_affinity: [48, 49, 50, 57, 58, 59, 60, 61, 62, 63]
    # Production's port: our kotekan replaces production's on these nodes. choco skips them
    # (maintenance mode), so the site tools push /earth_rotation_data (eop_push.sh) and
    # /updatable_config/bad_inputs (bad_inputs_cron.py) to 12048, hard-coded. A node whose EOP
    # table is not refreshed shuts down once time passes its last entry (fatal_eop_out_of_range).
    rest_port: 12048
    # The search aggregator's port on the stack host, named by the broker's `detectors:` URL
    # (config/gnss_chains_chord.yaml); not derived from rest_port.
    aggregator_rest_port: 12050
    # Stock nodes the generator asks for the EOP table (besides ours) and the bad-input block
    # when choco cannot be read (live_eop_table, live_bad_inputs). Production keeps them current.
    eop_reference_nodes: [cx47, cx52]
    # Base directory of the vis capture's rawFileWrites (<record_dir>/viscap). Local disk on
    # every node: /home is NFS and /data exists only on cx19. /tmp is on the NVMe, not a ramdisk.
    record_dir: /tmp/gnss
