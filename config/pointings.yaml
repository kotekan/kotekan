---
# Declared dish-pointing epochs for the beam-cube archive (recording plan P3).
#
# ⚠️ A POINTING IS DECLARED, NEVER INFERRED FROM THE DATA. Every repoint needs a fresh beam map,
# and the archive is laid out by pointing id (l0/<id>/<sender>/<day>.h5) so that a map builder
# can never sum two pointings by accident. gnss_cube_compact.py reads this file; an epoch that
# is not declared here lands under l0/unknown/ -- visible, not silently merged.
#
# Times are UTC ISO-8601. `to` open (null) = current. Boresight per docs/CHORD_BEAM_MAPS.md:
# the dish points at dec +40.73 (the fitted value; NOT the config's dish_coelev_deg) through the
# local meridian.
#
# ⚠️ HISTORY BEFORE 2026-09-05 IS UNVERIFIED (KV to confirm/extend): the raw cube archive
# starts 2026-09-05 15:xx UTC, so only the current epoch matters to it today.
    - id: p0_dec40p73
      from: 2026-07-01T00:00:00Z
      to: 2026-10-12T17:05:00Z
      boresight_dec_deg: 40.73
      note: first CHORD GNSS pointing; 09-02 beam maps (peak 6.3/6.6 deg off boresight) were taken here
    - id: p1_scattered_20261017
      from: 2026-10-17T01:52:37Z
      to: 2026-10-20T00:22:00Z
      boresight_dec_deg:
      note: dishes tipped in semi-random directions during the 10-12..10-17 F-engine outage; no common boresight, so no beam maps from this epoch; ends at the realignment
    - id: p2_ab_cyga_cf_tipped
      from: 2026-10-20T00:22:00Z
      to: 2026-10-23T11:37:00Z
      boresight_dec_deg:
      note: rows A/B still on the Cyg A pointing (dec +40.73), rows C-F tipped further down (KV 2026-10-19); no common boresight, so no beam maps; starts with the 96-element live set (rows A-F, array epoch 2026-10-20-rows-af96), so a sender's day file never mixes element counts; ends at the realignment
    - id: p3_ab_cyga_cfgh_tipped
      from: 2026-10-23T11:37:00Z
      to: 2026-10-23T15:43:00Z
      boresight_dec_deg:
      note: same aim as p2 (rows A/B on the Cyg A pointing, dec +40.73; rows C-F tipped further down) with rows G/H tipped with C-F (KV 2026-10-23); no common boresight, so no beam maps; starts with the 128-element live set (rows A-H, array epoch 2026-10-23-rows-ah128), so a sender's day file never mixes element counts; ends at the realignment
    - id: p4_repoint_taua_20261023
      from: 2026-10-23T15:43:00Z
      to: 2026-10-24T00:00:00Z
      boresight_dec_deg:
      note: the whole array (rows A-H) being repointed to Tau A (dec +22.0, meridian, el ~62.7 S), starting during the F-engine outage of 15:43Z; dishes keep moving while data are taken (KV 2026-10-23, likely over the weekend), so no common boresight and no beam maps; array epoch 2026-10-23-rows-ah128-repoint; ends when KV confirms the move complete
    - id: p5_taua_20261024
      from: 2026-10-24T00:00:00Z
      to:
      boresight_dec_deg: 22.0
      note: the whole array (rows A-H) on Tau A (dec +22.0, meridian, el 62.7 S), the repoint confirmed complete apart from the west edge of rows E-H (config/chord_array_epochs.json 2026-10-24-rows-ah128-taua, the same instant); per-dish N-S aim within +-0.55 deg, E-W -0.065 +- 0.04 deg (memory chord-taua-pointing-squint-20261024)
