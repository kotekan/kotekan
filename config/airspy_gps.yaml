---
##########################################
#
# airspy_gps.yaml
#
# Single-airspy GPS L1 C/A replica-correlator config. Streams real samples
# from one AirSpy R2, correlates them against software-generated GPS L1 C/A
# replicas (per-PRN, over a Doppler grid), and writes the per-PRN complex
# correlation peaks to disk. Uses GPS satellites as calibration point sources
# for overhead beam-response measurement as they transit.
#
# This replaces SimpleCrosscorr for the GPS use case: SimpleCrosscorr cannot
# handle the per-PRN Doppler shifts; the additions here are the replica
# generation and per-PRN carrier wipe-off.
#
# Author: Keith Vanderlinde
#
##########################################
type: config
log_level: info

instrument_name: airspy_gps

# Permit the browser viewer's REST access (airspyInput set_config / get_config
# / adcstat). Scoped to the viewer origin rather than a wildcard.
rest_server:
    cors_allow_origins:
        - "http://localhost:8080"
        - "http://127.0.0.1:8080"

# One input frame = 50000 real samples = 10 ms at 5 MSPS (10 code periods).
# The correlator slices this internally into 1 ms (Ns-sample) blocks and keeps
# a running sample-phase counter across frames, so the input frame size need
# not be a multiple of the 1 ms code period -- but a 10 ms frame keeps the
# producer/consumer handshakes infrequent.
samples_per_data_set: 50000
bytes_per_sample: 2
buffer_depth: 10
cpu_affinity: [4, 5, 6, 7]
sizeof_float: 4

# ---- airspy front end ----
# Frequency setup, inferred from airspy_autocorr.yaml (freq 1421, sample_bw 10)
# + networkPowerStream's bin->sky map: sky(f) = freq - sample_bw/2 +
# (sample_bw/freqs)*f. Those `freqs` real-mode bins physically occupy the
# digital band [0, Fs_real/2], so for the viewer's sky labels to be correct the
# RAW real-sample rate must be Fs_real = 2 * sample_bw * 1e6 (i.e. "2.5 MHz
# mode" -> 5 MSPS real, as in the handoff). Consequences:
#   * The LO (`freq`) lands at the CENTRE of the digital band (digital Fs_real/4
#     = sample_bw*1e6/2), not at DC.
#   * A sky tone at freq+df sits at digital offset  f_offset = df + Fs_real/4.
# `sample_bw` is the device IQ-rate label airspyInput passes to
# airspy_set_samplerate (must be device-supported: R2 reports 10 and 2.5);
# `sample_rate` under the correlator is the TRUE real rate = 2 * that.
#
# Tuning the LO onto L1 puts the carrier at band centre (f_offset = Fs_real/4),
# off the digital DC spike, with the +-1.023 MHz C/A main lobe (0.23..2.27 MHz)
# sitting inside the 0..2.5 MHz analytic band.
sample_bw: 2.5     # MHz device rate; Fs_real = 5 MSPS (2x, RAW real samples)
freq: 1575.42      # MHz LO on L1 -> carrier at band centre (digital 1.25 MHz)
gain_lna: 14    # 0-14
gain_mix: 15    # 0-15
gain_if: 15     # 0-15
biast_power: false
dither_disable: false

input_buf:
    kotekan_buffer: standard
    metadata_pool: none
    num_frames: buffer_depth
    frame_size: samples_per_data_set * bytes_per_sample

airspy_input:
    kotekan_stage: airspyInput
    out_buf: input_buf
#  serial: 0x________________   # pin a specific dongle; omit for "first found"

# ---- GPS replica correlator ----
# n_prn must match the length of the `prns` list below; the output frame holds
# exactly n_prn records of record_floats 4-byte slots each:
# {prn, doppler_hz, code_phase_chips, peak_amp, peak_re, peak_im, snr,
#  nav_sign, phase_cont} as float32, then a trailing float64 UTC timestamp in
# the last two slots. nav_sign/phase_cont/peak_re/im are set only when
# track_phase is true.
n_prn: 6
record_floats: 11

gps_record_buf:
    kotekan_buffer: standard
    metadata_pool: none
    num_frames: buffer_depth
    frame_size: n_prn * record_floats * sizeof_float

gps_correlator:
    kotekan_stage: GpsReplicaCorrelator
    in_buf: input_buf
    out_buf: gps_record_buf
    sample_rate: 5.0e6       # Hz real RAW rate = 2 * sample_bw (NOT 2.5e6)
    f_offset: 1.25e6         # Hz; L1 at band centre = Fs_real/4 (see notes above)
    doppler_min: -6000.0     # Hz
    doppler_max: 6000.0      # Hz
    doppler_step: 500.0      # Hz
    incoherent_ms: 1         # 1 ms blocks summed per emitted record
    track_phase: false       # Stage 2: phase tracking + nav-bit stripping
    lock_snr: 15.0           # SNR (peak/mean) to lock a PRN for phase tracking
    # Active PRNs to search. Feed known-overhead PRNs from an almanac to limit
    # the search, or list all 1..32 to brute-force.
    prns: [2, 5, 12, 15, 25, 29]

# ---- record sink ----
# Per-PRN records are tiny; persist them as raw frames. Each file is one
# integration's [n_prn, record_floats] float32 block. Downstream tooling /
# the viewer can tail these. (Swap in networkPowerStream + js_viewer later.)
record_write:
    kotekan_stage: rawFileWrite
    in_buf: gps_record_buf
    base_dir: "./gps_records"
    file_name: "gps"
    file_ext: "raw"
    prefix_hostname: false
