    in_bufs: [l2c_rec_buf]
    n_prn: 28
    integration_length: 200
    record_export: 64
# L2C-CM's CNAV symbols against CL, for nav_decode. CM and CL share the carrier phase.
l2cm_assemble:
    kotekan_stage: GnssGpuRecordAssemble
    in_buf: l2cm_epl_buf
