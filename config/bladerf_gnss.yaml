# B2a-D's B-CNAV2 symbols against B2a-P, for the broker's bcnav2-combiner.
b2ad_assemble:
    kotekan_stage: GnssGpuRecordAssemble
    in_buf: b2ad_epl_buf
    out_buf: b2ad_rec_buf
    prns: *b2a_prns
b2ad_symbols:
