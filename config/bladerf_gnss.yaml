sbas_assemble:
    kotekan_stage: GnssGpuRecordAssemble
    in_buf: sbas_epl_buf
    out_buf: sbas_rec_buf
    prns: *sbas_prns
    chan_export: true
    channel_ids: [35, 36, 37, 38, 39, 40, 41, 42]
sbas_combine:
    kotekan_stage: GnssCoherentCombiner
    in_bufs: [sbas_rec_buf]
    n_prn: 6
    integration_length: 200
    record_export: 64
# The 500 sps symbols (two 1 ms records each) for nav_decode: a 1 s window, each symbol decided
# against the phase of the +-50 symbols (100 ms) around it.
sbas_bits:
    kotekan_stage: GnssCoherentCombiner
    in_bufs: [sbas_rec_buf]
    n_prn: 6
    integration_length: 1000
    navwipe_bit_records: 2
    bit_export: true
    bit_export_track: 50

b2b_assemble:
    kotekan_stage: GnssGpuRecordAssemble
    in_buf: b2b_epl_buf
    out_buf: b2b_rec_buf
    prns: *b2a_prns
    chan_export: true
    channel_ids: [51, 52, 53, 54, 55, 56, 57, 58]
# B-CNAV3 is one symbol per record: the deep sum wipes each record's sign, and bit_export serves
# the decisions to the bcnav3 decoder (nav_decode.py), which decodes each 1.5 s window's whole
# 1000-symbol frame. The bit-wipe path is linear in the window, with no rate search. The carrier
# phase drifts tens of degrees across a window, so each exported bit is decided against the
# phase of the +-100 bits around it (bit_export_track), with its soft value.
b2b_combine:
    kotekan_stage: GnssCoherentCombiner
    in_bufs: [b2b_rec_buf]
    n_prn: 31
    integration_length: 1500
    record_export: 64
    navwipe_bit_records: 1
    bit_export: true
    bit_export_track: 100

# ---- Telemetry ----
# Every chain's records as a CHORD node ships them (GnssTelemPack), gathered in this instance
# (GnssTelemGather) and served to the broker (telem-gather 127.0.0.1:11061): its tracker code
# residual then averages a window's records, not one, as the tracker-fed joint state requires.
telem_buf:
    kotekan_buffer: standard
    metadata_pool: gnss_pool
    # Nine chains send ~2250 frames/s: 1536 frames ride out the broker's pauses (256 dropped
    # 1.3% of them at seven chains).
    num_frames: 1536
    # The widest row's frame: gnss::telem_frame_bytes(4 records, 69 PRNs, 5 channels).
    frame_size: 85120
telem_pack:
    kotekan_stage: GnssTelemPack
    out_buf: telem_buf
    inst: gx10.0
    n_elements: 1
    records_per_frame: 4
    chains:
        l5:
            in_buf: l5_rec_buf
            chain: gps_l5
            n_prn: 32
            max_prn: 32
            n_chan: 8
            channel_ids: [35, 36, 37, 38, 39, 40, 41, 42]
        e5a:
            in_buf: e5a_rec_buf
            chain: gal_e5a
            n_prn: 36
            max_prn: 36
            n_chan: 8
            channel_ids: [35, 36, 37, 38, 39, 40, 41, 42]
        b2a:
            in_buf: b2a_rec_buf
            chain: bds_b2a
            n_prn: 31
            max_prn: 31
            n_chan: 8
            channel_ids: [35, 36, 37, 38, 39, 40, 41, 42]
        gw:
            in_buf: gw_rec_buf
            chain: gw_1202
            n_prn: 69
            max_prn: 69
            n_chan: 5
            channel_ids: [50, 51, 52, 53, 54]
        b3i:
            in_buf: b3i_rec_buf
            chain: bds_b3i
            n_prn: 31
            max_prn: 31
            n_chan: 8
            channel_ids: [19, 20, 21, 22, 23, 24, 25, 26]
        e6:
            in_buf: e6_rec_buf
            chain: gal_e6
            n_prn: 32
            max_prn: 32
            n_chan: 6
            channel_ids: [25, 26, 27, 28, 29, 30]
        l2c:
            in_buf: l2c_rec_buf
            chain: gps_l2c
            n_prn: 28
            max_prn: 28
            n_chan: 2
            channel_ids: [1, 2]
        e5b:
            in_buf: e5b_rec_buf
            chain: gal_e5b
            n_prn: 36
            max_prn: 36
            n_chan: 8
            channel_ids: [51, 52, 53, 54, 55, 56, 57, 58]
        b2b:
            in_buf: b2b_rec_buf
            chain: bds_b2b
            n_prn: 31
            max_prn: 31
            n_chan: 8
            channel_ids: [51, 52, 53, 54, 55, 56, 57, 58]
        sbas:
            in_buf: sbas_rec_buf
            chain: sbas_l5
            n_prn: 6
            max_prn: 6
            n_chan: 8
            channel_ids: [35, 36, 37, 38, 39, 40, 41, 42]
telem_gather:
    kotekan_stage: GnssTelemGather
    in_buf: telem_buf
    serve_host: 127.0.0.1
    serve_port: 11061
    stale_after_s: 5.0
