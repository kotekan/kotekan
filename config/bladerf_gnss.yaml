e5b_assemble:
    kotekan_stage: GnssGpuRecordAssemble
    in_buf: e5b_epl_buf
    out_buf: e5b_rec_buf
    prns: *e5a_prns
    chan_export: true
    channel_ids: [51, 52, 53, 54, 55, 56, 57, 58]
e5b_combine:
    kotekan_stage: GnssCoherentCombiner
    in_bufs: [e5b_rec_buf]
    n_prn: 36
    integration_length: 200
    record_export: 64
# E5b-I's I/NAV symbols against E5b-Q, for the broker's inav-combiner.
e5bi_assemble:
    kotekan_stage: GnssGpuRecordAssemble
    in_buf: e5bi_epl_buf
    out_buf: e5bi_rec_buf
    prns: *e5a_prns
e5bi_symbols:
    kotekan_stage: GnssNavSymbols
    pilot_buf: e5b_rec_buf
    data_buf: e5bi_rec_buf
    n_prn: 36
