---
##########################################
#
# airspy_gps_rxtest.yaml
#
# Quick GPS *reception* sanity test on a real antenna. Searches all 32 L1 C/A
# PRNs (4-way split, real-time) with 1 s incoherent integration for strong,
# unambiguous detection, and writes one record stream per worker. Any satellite
# overhead should show up as a high-SNR record at a sensible Doppler.
#
# Run (note: REST port is a CLI flag, NOT config -- move it off the default
# 12048 since other kotekan processes are on the host):
#   mkdir -p gps_records
#   kotekan -c airspy_gps_rxtest.yaml -b 0.0.0.0:12055
#
# Read back: python/scripts/gps_beamtrack.py globs gps_records/gps_*.raw.
#
# Author: Keith Vanderlinde
#
##########################################
type: config
log_level: info
instrument_name: airspy_gps

# Minimal telescope: nothing in the airspy pipeline uses it (the correlator
# derives its own frequencies), but chord's default ICETelescope now requires
# these fields just to construct.
telescope:
    name: ICETelescope
    num_polarizations: 1
    num_dishes: 1

rest_server:
    cors_allow_origins:
        - "http://localhost:8080"
        - "http://127.0.0.1:8080"

samples_per_data_set: 50000
bytes_per_sample: 2
buffer_depth: 10
sizeof_float: 4

# Front end: LO on L1 -> carrier at band centre, Fs_real = 2*sample_bw = 5 MSPS.
sample_bw: 2.5
freq: 1575.42
gain_lna: 14
gain_mix: 15
gain_if: 15
biast_power: true   # active antenna: bias-tee on
dither_disable: false

cpu_affinity: [0, 1, 2, 3]

input_buf:
    kotekan_buffer: standard
    metadata_pool: none
    num_frames: buffer_depth
    frame_size: samples_per_data_set * bytes_per_sample

airspy_input:
    kotekan_stage: airspyInput
    out_buf: input_buf
    serial: 8380179419296242767   # 0x744C60C821311C4F

# --- correlator common settings (each worker overrides prns/out_buf/affinity) ---
record_floats: 11
n_prn: 8
sample_rate: 5.0e6
f_offset: 1.25e6
doppler_min: -6000.0
doppler_max: 6000.0
doppler_step: 500.0
incoherent_ms: 1000   # 1 s integration -> strong detection
track_phase: false
lock_snr: 15.0

rec_a: { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }
rec_b: { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }
rec_c: { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }
rec_d: { kotekan_buffer: standard, metadata_pool: none, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }

gps_a:
    kotekan_stage: GpsReplicaCorrelator
    in_buf: input_buf
    out_buf: rec_a
    cpu_affinity: [4]
    prns: [1, 2, 3, 4, 5, 6, 7, 8]
gps_b:
    kotekan_stage: GpsReplicaCorrelator
    in_buf: input_buf
    out_buf: rec_b
    cpu_affinity: [5]
    prns: [9, 10, 11, 12, 13, 14, 15, 16]
gps_c:
    kotekan_stage: GpsReplicaCorrelator
    in_buf: input_buf
    out_buf: rec_c
    cpu_affinity: [6]
    prns: [17, 18, 19, 20, 21, 22, 23, 24]
gps_d:
    kotekan_stage: GpsReplicaCorrelator
    in_buf: input_buf
    out_buf: rec_d
    cpu_affinity: [7]
    prns: [25, 26, 27, 28, 29, 30, 31, 32]

write_a: { kotekan_stage: rawFileWrite, in_buf: rec_a, base_dir: "./gps_records", file_name: "gps_a", file_ext: "raw", prefix_hostname: false }
write_b: { kotekan_stage: rawFileWrite, in_buf: rec_b, base_dir: "./gps_records", file_name: "gps_b", file_ext: "raw", prefix_hostname: false }
write_c: { kotekan_stage: rawFileWrite, in_buf: rec_c, base_dir: "./gps_records", file_name: "gps_c", file_ext: "raw", prefix_hostname: false }
write_d: { kotekan_stage: rawFileWrite, in_buf: rec_d, base_dir: "./gps_records", file_name: "gps_d", file_ext: "raw", prefix_hostname: false }
