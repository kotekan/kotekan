##########################################
#
# FRB / Tracking beamformer verification
#
# Runs both GPU and CPU FRB beamformer pipelines, include re-ordering, hybrid beamformer, transposer, upchannelizer.
# using 3840 samples for a quick run, change it to 49152 for the standard operation setting
# Choose either testDataGen to make fake data or read from a previous baseband dump. DPDK should work too but i just didn't put it here
#
##########################################
---
type: config
# Logging level can be one of:
# OFF, ERROR, WARN, INFO, DEBUG, DEBUG2 (case insensitive)
# Note DEBUG and DEBUG2 require a build with (-DCMAKE_BUILD_TYPE=Debug)
log_level: info
num_elements: 2048
num_local_freq: 1
num_data_sets: 1
samples_per_data_set: 6144 # must be this to get 16 output samples (not 12)
sample_period_ns: 2560
network_frame_arrival_period: 6144 * sample_period_ns / 1e9
# see where / if / how to use buffer_depth and gpu_buffer_depth
# must be at least size of gpu_buffer_depth
buffer_depth: 4
baseband_buffer_depth: 120  # 48Gb, 15s buffer.
vbuffer_depth: 32
num_links: 4
timesamples_per_packet: 2
cpu_affinity: [2,3,8,9]
block_size: 32
num_gpus: 1
link_map: [0,1,2,3]

# this must be 4 since cudaTranspose2048_chime.cpp hard-codes the outermost
# size of the voltage ring-buffer as 4
gpu_buffer_depth: 4

# Constants
sizeof_half: 2
sizeof_float: 4
sizeof_int: 4
sizeof_short: 2

dataset_manager:
  use_dataset_broker: False
  ds_broker_host: "127.0.0.1"
  ds_broker_port: 12050

#FRB global options
downsample_time: 3
downsample_freq: 8
factor_upchan: 128
factor_upchan_out: 16
num_frb_total_beams: 1024
frb_missing_gains: [1.0,0.0]
frb_scaling: 1.0
# not quite input reorder since that one is to cylinder order (cyl, pol, dish)
# while here we are going to beamformer order (pol, dis). Also groups by 4 (so
# only 512 entries and each entry covers elements 4*i to 4*i+3)
reorder_map: [
# cyl A, pol 0
 32, 33, 34, 35, 40, 41, 42, 43, 48, 49, 50, 51, 56, 57, 58, 59, 96, 97, 98, 99,104,105,106,107,112,113,114,115,120,121,122,123,
 67, 66, 65, 64, 75, 74, 73, 72, 83, 82, 81, 80, 91, 90, 89, 88,  3,  2,  1,  0, 11, 10,  9,  8, 19, 18, 17, 16, 27, 26, 25, 24,
# cyl B, pol 0
152,153,154,155,144,145,146,147,136,137,138,139,128,129,130,131,216,217,218,219,208,209,210,211,200,201,202,203,192,193,194,195,
251,250,249,248,243,242,241,240,235,234,233,232,227,226,225,224,187,186,185,184,179,178,177,176,171,170,169,168,163,162,161,160,
# cyl C, pol 0
355,354,353,352,363,362,361,360,371,370,369,368,379,378,377,376,291,290,289,288,299,298,297,296,307,306,305,304,315,314,313,312,
259,258,257,256,264,265,266,267,272,273,274,275,280,281,282,283,323,322,321,320,331,330,329,328,339,338,337,336,347,346,345,344,
# cyl D, pol 0
408,409,410,411,400,401,402,403,392,393,394,395,384,385,386,387,472,473,474,475,464,465,466,467,456,457,458,459,448,449,450,451,
440,441,442,443,432,433,434,435,424,425,426,427,416,417,418,419,504,505,506,507,496,497,498,499,488,489,490,491,480,481,482,483,
# cyl A, pol 1
 36, 37, 38, 39, 44, 45, 46, 47, 52, 53, 54, 55, 60, 61, 62, 63,100,101,102,103,108,109,110,111,116,117,118,119,124,125,126,127,
 71, 70, 69, 68, 79, 78, 77, 76, 87, 86, 85, 84, 95, 94, 93, 92,  7,  6,  5,  4, 15, 14, 13, 12, 23, 22, 21, 20, 31, 30, 29, 28,
# cyl B, pol 1
156,157,158,159,148,149,150,151,140,141,142,143,132,133,134,135,220,221,222,223,212,213,214,215,204,205,206,207,196,197,198,199,
255,254,253,252,247,246,245,244,239,238,237,236,231,230,229,228,191,190,189,188,183,182,181,180,175,174,173,172,167,166,165,164,
# cyl C, pol 1
359,358,357,356,367,366,365,364,375,374,373,372,383,382,381,380,295,294,293,292,303,302,301,300,311,310,309,308,319,318,317,316,
263,262,261,260,268,269,270,271,276,277,278,279,284,285,286,287,327,326,325,324,335,334,333,332,343,342,341,340,351,350,349,348,
# cyl D, pol 1
412,413,414,415,404,405,406,407,396,397,398,399,388,389,390,391,476,477,478,479,468,469,470,471,460,461,462,463,452,453,454,455,
444,445,446,447,436,437,438,439,428,429,430,431,420,421,422,423,508,509,510,511,500,501,502,503,492,493,494,495,484,485,486,487
]

# Pool
main_pool:
  kotekan_metadata_pool: chordMetadata
  num_metadata_objects: 30 * buffer_depth + 5 * baseband_buffer_depth

hfb_pool:
  kotekan_metadata_pool: HFBMetadata
  num_metadata_objects: 30 * buffer_depth + 5 * baseband_buffer_depth

# Buffers
host_voltage_buffer:
  kotekan_buffer: standard
  num_frames: baseband_buffer_depth
  frame_size: samples_per_data_set * num_elements * num_local_freq * num_data_sets
  metadata_pool: main_pool
host_voltage_ringbuffer:
  kotekan_buffer: ring
  # [24576, 1, 2, 512]
  # value = 0x55555ba9c5e0 "T"}, {value = 0x55555ba9d650 "F"}, {value = 0x55555ba9d8a0 "P"}, {
  # value = 0x55555ba9e5f0 "D"}}}
  ring_buffer_size: gpu_buffer_depth * samples_per_data_set * num_elements * num_local_freq
  type: float32
  dimnames: ["F", "T", "P", "E"]
  shape: [num_local_freq,  samples_per_dataset, 2, num_elements / 2]
  metadata_pool: main_pool

host_beamform_frb1_buffer:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size: num_data_sets * samples_per_data_set * num_local_freq * num_elements * 2*sizeof_half
  metadata_pool: main_pool
host_beamform_frb1_ringbuffer:
  kotekan_buffer: ring
  ring_buffer_size: buffer_depth * num_data_sets * samples_per_data_set * num_local_freq * num_elements * 2*sizeof_half
  type: cfloat16
  dimnames: ["T", "F", "P", "EW", "NS"]
  shape: [buffer_depth * samples_per_data_set, num_local_freq, 2, 4, num_elements / 2 / 4]
  metadata_pool: main_pool

host_beamform_frb2_buffer:
  kotekan_buffer: standard
  num_frames: buffer_depth
  frame_size: num_data_sets * (samples_per_data_set/downsample_time/downsample_freq) * num_frb_total_beams * sizeof_float
  metadata_pool: main_pool
host_beamform_frb2_ringbuffer:
  kotekan_buffer: ring
  ring_buffer_size: buffer_depth * num_data_sets * (samples_per_data_set/downsample_time/downsample_freq) * num_frb_total_beams * sizeof_float
  type: float32
  dimnames: ["Tc", "B", "Fc", "Tfrb", "Fu"]
  shape: [buffer_depth,  num_elements / 2, num_local_freq, samples_per_data_set / (3 * 128), 16]
  metadata_pool: main_pool

gain_frb_buffer:
  kotekan_buffer: standard
  metadata_pool: main_pool
  num_frames: buffer_depth
  frame_size: 2048 * 2 * sizeof_float

# trivial gain
set_gain_frb_buffer:
  kotekan_stage: testDataGenFloat
  type: const
  value: 1.0
  # TODO: needs array description etc
  network_out_buf: gain_frb_buffer

# send data to GPU
run_send_voltage:
  kotekan_stage: cudaProcess
  log_level: debug
  gpu_id: 0
  buffer_depth: gpu_buffer_depth
  frame_arrival_period: network_frame_arrival_period
  num_times: samples_per_data_set
  in_buffers:
      host_voltage_buffer: host_voltage_buffer
  out_buffers:
      host_voltage_ringbuffer: host_voltage_ringbuffer
  commands:
  - name: cudaCopyToRingbuffer
    input_size: samples_per_data_set * num_elements * num_local_freq
    ring_buffer_size: gpu_buffer_depth * input_size
    in_buf: host_voltage_buffer
    signal_buf: host_voltage_ringbuffer
    gpu_mem_output: voltage_buffer

# TODO: reorder into beamformer order
# TODO: handle gains (hard-coded to 1.0 in C++ code right now)
gpu_beamform:
  kotekan_stage: cudaProcess
  log_level: debug
  buffer_depth: gpu_buffer_depth
  frame_arrival_period: network_frame_arrival_period
  num_times: samples_per_data_set
  gpu_id: 0
  in_buffers:
      host_voltage_ringbuffer: host_voltage_ringbuffer
  out_buffers:
      host_beamform_frb2_ringbuffer: host_beamform_frb2_ringbuffer
      host_beamform_frb1_ringbuffer: host_beamform_frb1_ringbuffer
  commands:
  - name: cudaCHIMEFRBBeamform
    poison_buffers: true
    num_frequencies: num_local_freq
    num_polarizations: 2
    num_dishes: num_elements / 2
    voltage_name: voltage
    frb1_beams_name: beamform_frb1
    frb2_beams_name: beamform_frb2

recv_gpu_beamform_output_buffer:
  kotekan_stage: cudaProcess
  buffer_depth: gpu_buffer_depth
  frame_arrival_period: network_frame_arrival_period
  num_times: samples_per_data_set
  gpu_id: 0
  in_buffers:
      host_beamform_frb2_ringbuffer: host_beamform_frb2_ringbuffer
  out_buffers:
      host_beamform_frb2_buffer: host_beamform_frb2_buffer
  commands:
  - name: cudaCopyFromRingbuffer
    host_signal: host_beamform_frb2_ringbuffer
    gpu_mem_input: beamform_frb2
    output_size: sizeof_float * num_frb_total_beams * num_local_freq * samples_per_data_set / (downsample_time * factor_upchan) * factor_upchan_out
    ring_buffer_size: gpu_buffer_depth * output_size
    out_buf: host_beamform_frb2_buffer

cpu_output_buffers:
  num_frames: buffer_depth
  frame_size: num_data_sets * (samples_per_data_set/downsample_time/downsample_freq) * num_frb_total_beams * sizeof_float
  metadata_pool: main_pool
  cpu_output_buffer_0:
    kotekan_buffer: standard

cpu_hfb_output_buffers:
  num_frames: buffer_depth
  frame_size: num_data_sets * factor_upchan * num_frb_total_beams * sizeof_float
  metadata_pool: main_pool
  cpu_hfb_output_buffer_0:
    kotekan_buffer: standard

lost_samples_buffer:
  kotekan_buffer: standard
  num_frames: 2 * buffer_depth
  frame_size: samples_per_data_set * num_local_freq * num_data_sets
  metadata_pool: main_pool

gen_data:
  test_data_gen_network:
    type: random_signed_offset
    value: 153
    kotekan_stage: testDataGen
    out_buf: host_voltage_buffer
    name: "E"
    # kotekan does not like variables in arrays
    #array_shape: [ samples_per_data_set, num_local_freq, 2, num_elements/2 ]
    array_shape: [ 6144, 1, 2, 1024 ]
    dim_name: [ "T", "F", "P", "D" ]
  test_data_gen_lost_samples:
    type: const
    value: 0
    kotekan_stage: testDataGen
    out_buf: lost_samples_buffer

cpu_simulate:
  cpu_data_sim_0:
    gain_dir: "./"
    ew_spacing: [0.0, 0.1, 0.2, 0.3]
    northmost_beam: 90.0
    kotekan_stage: gpuBeamformSimulate
    network_in_buf: host_voltage_buffer
    beam_out_buf: cpu_output_buffer_0
    hfb_out_buf: cpu_hfb_output_buffer_0

check_data:
  bf_data_check_0:
    num_frames_to_test: 1
    epsilon: 0.001
    kotekan_stage: testDataCheckFloat
    first_buf : host_beamform_frb2_buffer
    second_buf: cpu_output_buffer_0


frb:
  # set via a globals
  #num_gpus: 1
  #samples_per_data_set: samples_per_data_set
  #downsample_time: downsample_time
  #factor_upchan: factor_upchan
  # must be 16, hard-coded in C code
  #factor_upchan_out: factor_upchan_out
  # from chime_science_run_gpu.yaml
  num_beams_per_frb_packet: 4
  # must be 16 (hard-coded in C code)
  timesamples_per_frb_packet: 16
  frb_packet_header_size: 32
  frb_output_buffer:
    num_frames: buffer_depth + 4
    frame_size: 8 * 256 * (num_beams_per_frb_packet * num_gpus
      * factor_upchan_out * timesamples_per_frb_packet
      + frb_packet_header_size + sizeof_short * num_beams_per_frb_packet + sizeof_short * num_gpus
      + sizeof_float * num_beams_per_frb_packet * num_gpus
      + sizeof_float * num_beams_per_frb_packet * num_gpus)
    metadata_pool: main_pool
    kotekan_buffer: standard
  postprocess:
    kotekan_stage: frbPostProcess
    incoherent_beams: [0, 256, 512, 768]
    lost_samples_buf: lost_samples_buffer
    in_buf_0: cpu_output_buffer_0
    out_buf: frb_output_buffer
  network_send:
    kotekan_stage: frbNetworkProcess
    in_buf: frb_output_buffer
    udp_frb_packet_size: (frb_packet_header_size
      + sizeof_short * num_beams_per_frb_packet
      + sizeof_short * num_gpus
      + sizeof_float * num_beams_per_frb_packet * num_gpus
      + sizeof_float * num_beams_per_frb_packet * num_gpus)
      + (num_beams_per_frb_packet * num_gpus
         * factor_upchan_out * timesamples_per_frb_packet)
    udp_frb_port_number: 1313
    number_of_nodes: 1
    packets_per_stream: 8
    # magic number, don't bind to any subnet
    number_of_subnets: 0
    #column_mode: true
    beam_offset: 0
    time_interval: 125829120
    # don't ping
    ping_dead_threshold: 0
    L1_node_ips:
      - 127.0.0.1

...
