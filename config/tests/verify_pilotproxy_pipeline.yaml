---
# Compare detector output with a CPU calculation from recorded voltage frames.
# The four test channels include two ATSC pilots (2408 and 2623) and two
# non-pilot channels. Voltage, power and mask files retain their frame metadata.
#
# This config uses coarse mode so it can run with an exported development
# bundle. tests/test_pilotproxy_integration.py also checks fine mode with
# synthetic calibration; see docs/sphinx/dev/dev_pilotproxy_testing.rst.
#
# After exporting a bundle to fake_data/pilotproxy_bundle:
#   mkdir -p fake_data/pilotproxy_verify
#   ./kotekan -c config/tests/verify_pilotproxy_pipeline.yaml
#   python3 tools/verify_pilotproxy_pipeline.py \
#       --dump-dir fake_data/pilotproxy_verify --bundle-dir fake_data/pilotproxy_bundle
#
type: config
log_level: INFO

buffer_depth: 4
cpu_affinity: [0, 1]
frame_arrival_period: 5.12e-6 * num_times
samples_per_data_set: 4 * num_times

# Small array to keep the CPU reference calculation quick.
num_times: 8192                  # voltage samples per generated frame
samples_per_detector_frame: 8192 # detector block = one frame (128 windows at K=64)
num_local_freq: 4
num_polarizations: 2
num_dishes: 8
num_gen_frames: 8                # -> 8 detector blocks

# Output directory for the raw dumps (inherited by the rawFileWrite stages)
# and the PilotProxy runtime-bundle files (inherited by the detector).
base_dir: "fake_data/pilotproxy_verify"
pilot_profiles_path: "fake_data/pilotproxy_bundle/pilot_profiles.json"
weights_path: "fake_data/pilotproxy_bundle/weights.bin"

main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 30 * buffer_depth

# Buffers (standard host buffers so rawFileWrite can dump them; the
# chordMetadata carried by each frame still describes the array).
host_voltage_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: num_times * num_local_freq * num_polarizations * num_dishes
    metadata_pool: main_pool

host_voltage_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * num_times * num_local_freq * num_polarizations * num_dishes
    metadata_pool: main_pool

host_dtv_mask_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: num_local_freq
    metadata_pool: main_pool

host_dtv_powers_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: num_local_freq * 3 * 8
    metadata_pool: main_pool

# Stages

gen_voltage:
    kotekan_stage: testDataGen
    out_buf: host_voltage_buffer
    type: random_signed_offset      # random samples, int4x2_swapped_withoffset
    seed: 42
    first_frame_index: 17
    num_frames: num_gen_frames
    name: "E"
    array_shape: [8192, 4, 2, 8]    # = [num_times, num_local_freq, num_polarizations, num_dishes]
    dim_name: ["T", "F", "P", "D"]
    dim_scaling: [1, 1, 1, 1]
    # Coarse channels on this "node": 2408 (ATSC ch 14) and 2623 (ATSC ch 21)
    # are pilot channels present in the ATSC 14-36 runtime bundle; 1600 and
    # 4000 are non-pilot channels and must emit zeros.
    manual_freq_ids: [2408, 1600, 2623, 4000]
    meta_time_downsample_factor: 4

# Save raw arrays and frame metadata. The verifier uses the layouts in this
# config to compare every detector output with its CPU reference.
dump_voltage:
    kotekan_stage: rawFileWrite
    in_buf: host_voltage_buffer
    file_name: "voltage"
    file_ext: "raw"
    prefix_hostname: false
    num_frames_per_file: 1
    # testDataGen attaches an NDArray frame descriptor even to standard
    # buffers; we only want the raw bytes (the verifier knows the layout).
    allow_ndarray: true
    exit_after_n_files: 8           # = num_gen_frames

run_send_voltage:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_buffer: host_voltage_buffer
        out_buffers:
            host_voltage_ringbuffer: host_voltage_ringbuffer
        commands:
            - name: cudaCopyToRingbuffer
              input_size: num_times * num_local_freq * num_polarizations * num_dishes
              ring_buffer_size: buffer_depth * input_size
              in_buf: host_voltage_buffer
              signal_buf: host_voltage_ringbuffer
              gpu_mem_output: voltage_buffer

run_dtv_detector:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_ringbuffer: host_voltage_ringbuffer
        out_buffers:
            host_dtv_mask: host_dtv_mask_buffer
            host_dtv_powers: host_dtv_powers_buffer
        commands:
            - name: cudaPilotProxyDetector
              voltage_name: voltage
              dtv_mask_name: dtv_mask
              dtv_powers_name: dtv_powers
              num_frequencies: num_local_freq
              decision_mode: coarse
              require_fine_calibration: false
              # pilot_profiles_path / weights_path inherited from the top level
            - name: cudaSyncOutput
            - name: cudaOutputData
              gpu_mem: dtv_mask_buffer
              out_buf: host_dtv_mask
            - name: cudaOutputData
              gpu_mem: dtv_powers_buffer
              out_buf: host_dtv_powers

dump_dtv_powers:
    kotekan_stage: rawFileWrite
    in_buf: host_dtv_powers_buffer
    file_name: "dtv_powers"
    file_ext: "raw"
    prefix_hostname: false
    num_frames_per_file: 1
    # cudaOutputData attaches an NDArray frame descriptor; raw bytes only.
    allow_ndarray: true
    exit_after_n_files: 8           # = num_gen_frames

dump_dtv_mask:
    kotekan_stage: rawFileWrite
    in_buf: host_dtv_mask_buffer
    file_name: "dtv_mask"
    file_ext: "raw"
    prefix_hostname: false
    num_frames_per_file: 1
    # cudaOutputData attaches an NDArray frame descriptor; raw bytes only.
    allow_ndarray: true
    # All three dumpers carry exit_after_n_files, so kotekan exits cleanly
    # only once every dump (8 voltage + 8 powers + 8 mask files) is on disk.
    exit_after_n_files: 8           # = num_gen_frames
log_config_usage: fatal_error
