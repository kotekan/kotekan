---
##########################################
#
# verify_pilotproxy_pipeline.yaml
#
# File-based end-to-end parity harness for cudaPilotProxyDetector (the
# pipeline-level companion to the kernel-level
# ci-tests/gpu_batch/test_pilotproxy_detector.yaml).
#
# testDataGen fills the voltage buffer with random int4x2_swapped_withoffset
# samples and CHORD channel metadata (two of the four coarse channels are
# ATSC pilot channels: 2408 = physical channel 14, 2623 = physical channel
# 21). The voltage frames are written to disk and simultaneously streamed
# through the GPU ring buffer into the detector; the dtv_mask / dtv_powers
# products are written to disk; kotekan exits cleanly after the last file.
# tools/verify_pilotproxy_pipeline.py then recomputes the exact expected
# uint64 powers and coarse rational mask from the dumped voltage plus the
# runtime bundle and compares bit-for-bit.
#
# Requires a PilotProxy runtime bundle on disk (default
# data/pilotproxy_bundle; see config/fengine/include/dtv_chord.j2 for the
# export command) and an output directory (default data/pilotproxy_verify):
#
#   mkdir -p data/pilotproxy_verify
#   ./kotekan -c config/tests/verify_pilotproxy_pipeline.yaml
#   python3 tools/verify_pilotproxy_pipeline.py \
#       --dump-dir data/pilotproxy_verify --bundle-dir data/pilotproxy_bundle
#
# This descends from the file-based fstat testbench workflow in the earlier
# djgormley/kotekan feat/fstat integration (gen inputs -> run pipeline ->
# verify products offline), rebuilt on the runtime-bundle contract and
# in-tree stages.
#
##########################################
type: config
log_level: INFO

buffer_depth: 4
cpu_affinity: [0, 1]
frame_arrival_period: 5.12e-6 * num_times
samples_per_data_set: num_times

# Small geometry: full logical structure, cheap offline verification.
num_times: 8192                  # voltage samples per generated frame
samples_per_detector_frame: 16384 # detector block = 2 frames (128 windows)
num_local_freq: 4
num_polarizations: 2
num_dishes: 8
num_gen_frames: 8                # -> 4 detector blocks

# Output directory for the raw dumps (inherited by the rawFileWrite stages)
# and the PilotProxy runtime-bundle files (inherited by the detector).
base_dir: "data/pilotproxy_verify"
pilot_profiles_path: "data/pilotproxy_bundle/pilot_profiles.json"
weights_path: "data/pilotproxy_bundle/weights.bin"

main_pool:
    kotekan_metadata_pool: chordMetadata
    num_metadata_objects: 30 * buffer_depth

# Buffers (standard host buffers so rawFileWrite can dump them; the
# chordMetadata carried by each frame still describes the array).
host_voltage_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: num_times * num_local_freq * num_polarizations * num_dishes
    metadata_pool: main_pool

host_voltage_ringbuffer:
    kotekan_buffer: ring
    ring_buffer_size: buffer_depth * num_times * num_local_freq * num_polarizations * num_dishes
    metadata_pool: main_pool

host_dtv_mask_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: num_local_freq
    metadata_pool: main_pool

host_dtv_powers_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: num_local_freq * 3 * 8
    metadata_pool: main_pool

# Stages

gen_voltage:
    kotekan_stage: testDataGen
    out_buf: host_voltage_buffer
    type: random_signed_offset      # random samples, int4x2_swapped_withoffset
    seed: 42
    num_frames: num_gen_frames
    name: "E"
    array_shape: [8192, 4, 2, 8]    # = [num_times, num_local_freq, num_polarizations, num_dishes]
    dim_name: ["T", "F", "P", "D"]
    dim_scaling: [1, 1, 1, 1]
    # Coarse channels on this "node": 2408 (ATSC ch 14) and 2623 (ATSC ch 21)
    # are pilot channels present in the ATSC 14-36 runtime bundle; 1600 and
    # 4000 are non-pilot channels and must emit zeros.
    manual_freq_ids: [2408, 1600, 2623, 4000]
    meta_time_downsample_factor: 1

dump_voltage:
    kotekan_stage: rawFileWrite
    in_buf: host_voltage_buffer
    file_name: "voltage"
    file_ext: "raw"
    prefix_hostname: false
    num_frames_per_file: 1

run_send_voltage:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_buffer: host_voltage_buffer
        out_buffers:
            host_voltage_ringbuffer: host_voltage_ringbuffer
        commands:
        - name: cudaCopyToRingbuffer
          input_size: num_times * num_local_freq * num_polarizations * num_dishes
          ring_buffer_size: buffer_depth * input_size
          in_buf: host_voltage_buffer
          signal_buf: host_voltage_ringbuffer
          gpu_mem_output: voltage_buffer

run_dtv_detector:
    gpu_0:
        kotekan_stage: cudaProcess
        gpu_id: 0
        in_buffers:
            host_voltage_ringbuffer: host_voltage_ringbuffer
        out_buffers:
            host_dtv_mask: host_dtv_mask_buffer
            host_dtv_powers: host_dtv_powers_buffer
        commands:
        - name: cudaPilotProxyDetector
          voltage_name: voltage
          dtv_mask_name: dtv_mask
          dtv_powers_name: dtv_powers
          num_frequencies: num_local_freq
          decision_mode: coarse
          # pilot_profiles_path / weights_path inherited from the top level
        - name: cudaSyncOutput
        - name: cudaOutputData
          gpu_mem: dtv_mask_buffer
          out_buf: host_dtv_mask
        - name: cudaOutputData
          gpu_mem: dtv_powers_buffer
          out_buf: host_dtv_powers

dump_dtv_powers:
    kotekan_stage: rawFileWrite
    in_buf: host_dtv_powers_buffer
    file_name: "dtv_powers"
    file_ext: "raw"
    prefix_hostname: false
    num_frames_per_file: 1

dump_dtv_mask:
    kotekan_stage: rawFileWrite
    in_buf: host_dtv_mask_buffer
    file_name: "dtv_mask"
    file_ext: "raw"
    prefix_hostname: false
    num_frames_per_file: 1
    # num_gen_frames / 2 detector blocks, then exit kotekan cleanly.
    exit_after_n_files: 4
log_config_usage: fatal_error
