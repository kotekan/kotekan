giga: 1000000000
start_time_s: 1417910418

earth_rotation_data:
  kotekan_update_endpoint: json
  earth_orientation_parameter_table: [
    {
      time_inst_ns: 1417910401000000000,
      delta_UT1_inst: 0.5,
      x_pm: 0.1,
      y_pm: 0.2
    }, {
      time_inst_ns: 1418910418000000000,
      delta_UT1_inst: 0.5,
      x_pm: 0.1,
      y_pm: 0.2
    }]

fakevis0:
  cadence: T_rot_sec / (86400 * raw_rate)
  dec: 49.32
  ra: -37.0
  freq_ids: [8000]
  kotekan_stage: FakeVis
  mode: point_source
  n_lost_ticks: 0
  n_rfi_ticks: 0
  noise_var: 0.1
  num_frames: 86400 * raw_rate + 1
  out_buf: fakevis_buf0
  sleep_after: 1.0
  start_time: start_time_s
  stokes_I: 10.0
  stokes_Q: 0.0
  stokes_U: 0.0
  stokes_V: 0.0
  wait: false

fakevis_buf0:
  kotekan_buffer: N2
  metadata_pool: N2_pool
  num_frames: buffer_depth

gps_time:
  frame0_nano: start_time_s * giga

log_level: debug

num_data_sets: 1
num_elements: 14
num_ev: 4
num_freq_in_frame: 1
num_gpu_frames: 64
num_local_freq: 1
samples_per_dataset: 32768

telescope:
  name: CHORDTelescope
  dish_positions: [
    [0.0, 0.0, 0.0],
    [6.3, 0.0, 0.0],
    [0.0, 8.4, 0.0],
    [6.3, 8.4, 0.0],
    [151.0, 0.0, 0.0],
    [0.0, 204.0, 0.0],
    [151.0, 204.0, 0.0]]
  inst_lat_deg: 49.32075144444
  inst_long_deg: -119.62081125
  inst_grid_x_axis: [1.0, 0.0, 0.0]
  inst_grid_y_axis: [0.0, 1.0, 0.0]
  inst_alt_deg: 90.0
  inst_dish_alt_axis: [1.0, 0.0, 0.0]
  inst_dish_vert_axis: [0.0, 0.0, 1.0]
  require_gps: false
  updatable_config: /earth_rotation_data

type: config
