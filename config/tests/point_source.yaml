---
type: config
log_level: INFO

N2_pool:
    int_frames: 64
    kotekan_metadata_pool: N2Metadata
    num_metadata_objects: 1000 * buffer_depth

buffer_depth: 4
cpu_affinity: [4]
giga: 1000000000
start_time_s: 1764576000
num_elements: 14
num_dishes: 7
num_polarizations: 2
num_ev: 4
sampling_rate_MHz: 3.2e3
fft_length: 16384
nyquist_zone: 1

telescope:
    name: CHORDTelescope
    origin_itrs_lat_deg: 49.32075144444
    origin_itrs_lon_deg: -119.62081125
    grid_x_axis: [0.999974342398359362, -0.000037539331442772, -0.007163318767675494]
    grid_y_axis: [0.000065403387739210, 0.999992433220348809, 0.003889630373557614]
    dish_elev_axis: [0.99999999838132392, -0.000056897733584327 0.0]
    dish_vert_axis: [0.0, 0.0, 1.0]
    dish_coelev_deg: 0.0
    require_gps: false
    eop_updatable_config: /earth_rotation_data
    dish_grid_size_x: 8
    dish_grid_size_y: 12

    dish_separation_x_m: 6.300156854906823
    dish_separation_y_m: 8.500057809796308
    # yamlfix:off
    dish_inputs: [
      {dish_idx: 0, grid_x_idx: 0,  grid_y_idx: 0,  feed_pos_disp_m: [0.0, 0.0, 0.0], coelev_disp_deg: 0.0, type: ArrayDish, label: A01},
      {dish_idx: 1, grid_x_idx: 1,  grid_y_idx: 0,  feed_pos_disp_m: [0.0, 0.0, 0.0], coelev_disp_deg: 0.0, type: ArrayDish, label: A02},
      {dish_idx: 2, grid_x_idx: 0,  grid_y_idx: 1,  feed_pos_disp_m: [0.0, 0.0, 0.0], coelev_disp_deg: 0.0, type: ArrayDish, label: B01},
      {dish_idx: 3, grid_x_idx: 1,  grid_y_idx: 1,  feed_pos_disp_m: [0.0, 0.0, 0.0], coelev_disp_deg: 0.0, type: ArrayDish, label: B02},
      {dish_idx: 4, grid_x_idx: 7,  grid_y_idx: 0,  feed_pos_disp_m: [0.0, 0.0, 0.0], coelev_disp_deg: 0.0, type: ArrayDish, label: A08},
      {dish_idx: 5, grid_x_idx: 0,  grid_y_idx: 7,  feed_pos_disp_m: [0.0, 0.0, 0.0], coelev_disp_deg: 0.0, type: ArrayDish, label: H01},
      {dish_idx: 6, grid_x_idx: 7,  grid_y_idx: 7,  feed_pos_disp_m: [0.0, 0.0, 0.0], coelev_disp_deg: 0.0, type: ArrayDish, label: H08}
    ]
    # yamlfix:on

input_order: CHORDBeamformer

earth_rotation_data:
    kotekan_update_endpoint: json
    # yamlfix:off
    earth_orientation_parameter_table: [
      {
        t_inst_ns: 1764575999000000000,
        delta_UT1_inst: 0.08,
        xp_as: 0.13,
        yp_as: 0.32
      }, {
        t_inst_ns: 1764676000000000000,
        delta_UT1_inst: 0.08,
        xp_as: 0.13,
        yp_as: 0.32
      }]
    # yamlfix:on

gps_time:
    frame0_nano: start_time_s * giga

fakevis_buf:
    kotekan_buffer: N2
    num_ev: 0
    n2_layout: FullUpperTri
    metadata_pool: N2_pool
    num_frames: buffer_depth

fakevis:
    kotekan_stage: FakeN2
    out_buf: fakevis_buf
    cadence: 10.0
    num_frames: -1
    wait: false
    mode: point_source
    dec: 49.0
    ra: 318.0
    freq_ids: [1536, 2000, 3000, 4000, 5000, 6000, 7000, 7680]
    n_lost_ticks: 0
    n_rfi_ticks: 0
    noise_var: 0.1
    num_ev: 0
    spectral_index: 1.0/3.0
    start_time: start_time_s
    beam_FWHM_300MHz_deg: 10.0
    stokes_I: 10.0
    stokes_Q: 0.0
    stokes_U: 0.0
    stokes_V: 0.0

write_vis_10s:
    kotekan_stage: hdf5FileWrite
    base_dir: ./data_out
    file_name: vis_t10_yfs
    in_buf: fakevis_buf
    prefix_hostname: false
    max_frames: 64
    skip_writing: false

write_fullvis_10s:
    kotekan_stage: hdf5N2Write
    in_buf: fakevis_buf
    base_dir: ./data_out
    file_name: vis
    prefix_hostname: false
    use_bitshuffle: true
    blocksize_f: 8
    blocksize_t: 6
    num_file_t: 6
    late_frame_grace_seconds: 30
    max_frames: 96
