---
type: config
log_level: info
instrument_name: airspy_gps
telescope: { name: ICETelescope, num_polarizations: 1, num_dishes: 1 }
rest_server: { cors_allow_origins: ["http://localhost:8080"] }

samples_per_data_set: 50000
bytes_per_sample: 2
buffer_depth: 16
sizeof_float: 4
cpu_affinity: [0, 1, 2, 3]   # bufferSend/Recv require it; inherited by all stages

spectrum_length: 50
num_taps: 4
sample_rate: 20.0e6
f_offset: 5.0e6
n_prn: 2
record_floats: 11
hops_per_record: 200
doppler_margin_hz: 900000.0

gnss_pool: { kotekan_metadata_pool: GnssChanMetadata, num_metadata_objects: 8 * buffer_depth }
rec_pool:  { kotekan_metadata_pool: GnssChanMetadata, num_metadata_objects: 8 * buffer_depth }

sub_buf: { kotekan_buffer: standard, metadata_pool: gnss_pool, num_frames: buffer_depth, frame_size: 100000 }
rec_buf: { kotekan_buffer: standard, metadata_pool: rec_pool, num_frames: buffer_depth, frame_size: n_prn * record_floats * sizeof_float }

recv:  { kotekan_stage: bufferRecv, buf: sub_buf, listen_port: 14002, num_threads: 1 }
search: { kotekan_stage: GnssChannelizedSearch, in_buf: sub_buf, channel_offset: 25, n_channels: 25,
          acquire_snr: 12.0, acquire_windows: 32, doppler_min: -6000.0, doppler_max: 6000.0, doppler_step: 500.0,
          prns: [5, 10, 23] }
track: { kotekan_stage: GnssChannelizedTracker, in_buf: sub_buf, out_buf: rec_buf, channel_offset: 25, n_channels: 25,
         prns: [10, 23], doppler_hz: [-1250.0, -2750.0], code_phase_chips: [647.0, 747.51] }
send: { kotekan_stage: bufferSend, buf: rec_buf, server_ip: 127.0.0.1, server_port: 14004, drop_frames: false }
