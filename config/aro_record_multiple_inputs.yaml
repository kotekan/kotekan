##########################################
#
# aro_record_multiple_inputs.yaml
#
# Allow more than 2 threads
#
##########################################
---
type: config
# Logging level can be one of:
# OFF, ERROR, WARN, INFO, DEBUG, DEBUG2 (case insensitive)
# Note DEBUG and DEBUG2 require a build with (-DCMAKE_BUILD_TYPE=Debug)
log_level: DEBUG

telescope:
  name: ICETelescope
  require_gps: true
  query_gps: true
  gps_host: 127.0.0.1 # Set this to the fpga_master host

instrument_name: aro

power_integration_length: 512

# Definition of what to save.
# This is done in num_thread chunks of num_elements * num_freq samples,
# picking some of the 16 elements and some of the 1024 frequencies,
# as given by offsets and frequencies.
# Note: both num_elements and num_freq have to be powers of 2 (since VDIF
# requires powers-of-two channels; one can work around this a bit using
# num_threads, which can be any number).
# Offset value for the *10m* telescope is 0, for 46m is 8.
# Examples: old-style
# num_threads: 2
# num_elements: 1
# num_freq: 1024
# offsets: [8, 9]
# frequencies: [0, 0]
# Save all frequencies of four consecutive inputs (for LPDA)
# num_threads: 1
# num_elements: 4
# num_freq: 1024
# offsets: [8]
# frequencies: [0]
# Save half the frequencies of eight consecutive inputs (for LPDA)
# num_threads: 1
# num_elements: 8
# num_freq: 512
# offsets: [8]
# frequencies: [512]
# CHORD-like 300-800, supposing 6&7 contain 0-400, and 8&9 400-800.
# num_threads: 5
# num_elements: 2
# num_freq: 256
# offsets: [6, 8, 8, 8, 8]
# frequencies: [768, 0, 256, 512, 768]
# CHORD-like 800-1500, supposing 10&11 contain 800-1200, and 8&9 1200-1500.
# num_threads: 7
# num_elements: 2
# num_freq: 256
# offsets: [10, 10, 10, 10, 8, 8, 8]
# frequencies: [0, 256, 512, 768, 256, 512, 768]
# Try full CHORD, but omitting cellphone band
#num_threads: 10
#num_elements: 2
#num_freq: 256
#offsets: [0, 2, 2, 2, 2, 4, 4, 6, 6, 6]
#frequencies: [768, 0, 256, 512, 768, 512, 768, 256, 512, 768]
#offsets: [0, 2, 2, 2, 2, 4, 4, 6, 6, 6]
#frequencies: [768, 0, 256, 512, 768, 512, 768, 256, 512, 768]
# Trial with partial CHORD
num_threads: 8
num_elements: 2
num_freq: 256
offsets: [2, 2, 2, 2, 4, 4, 6, 6]
frequencies: [0, 256, 512, 768, 512, 768, 256, 512]

samples_per_data_set: 32768
buffer_depth: 10
num_links: 8
timesamples_per_packet: 2
num_data_sets: 1
cpu_affinity: [1, 7, 5, 11] #squirrel
# cpu_affinity: [8, 9, 18, 19] #cloyd

sizeof_float: 4
sizeof_short: 2
vdif_header_size: 32
vdif_payload_size: num_freq * num_elements
num_disks: 10

# Pool
main_pool:
    kotekan_metadata_pool: chimeMetadata
    num_metadata_objects: 15 * buffer_depth

# Buffers
vdif_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth * num_disks
    frame_size: samples_per_data_set * num_threads * (vdif_payload_size + vdif_header_size)
    metadata_pool: main_pool

lost_samples_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: samples_per_data_set
    metadata_pool: main_pool

power_buffer:
    kotekan_buffer: standard
    num_frames: buffer_depth
    frame_size: (samples_per_data_set/power_integration_length) * (vdif_payload_size + 1) * num_threads * sizeof_float
    metadata_pool: main_pool

# Stages

# The core mapping here is setup for a 6 core CPU with 12 threads (vcores)
# and setup to use the first 4 real cores (8 vcores)
dpdk:
    num_mem_channels: 4
    kotekan_stage: dpdkCore
    mbuf_cache_size: 500
    # Format is index = lcore, value = cpu core
    lcore_cpu_map: [0, 2, 3, 4, 6, 8, 9, 10] #squirrel
    # lcore_cpu_map: [0, 1, 2, 3, 4, 5, 6, 7] #cloyd
    main_lcore_cpu: 4
    fpga_packet_size: 4680
    alignment: samples_per_data_set * 100
    # Format is index = lcore, value = array of port IDs
    # so [[0,1],[2,3]] maps lcore 0 to service ports 0 and 1,
    # and lcore 1 to service ports 2 and 3.
    lcore_port_map: # 1 stream/lcore, 16 streams
        - [0]
        - [1]
        - [2]
        - [3]
        - [4]
        - [5]
        - [6]
        - [7]
    # One handler must be given per port on the system.
    handlers:
        - dpdk_handler: iceBoardVDIF
        - dpdk_handler: iceBoardVDIF
        - dpdk_handler: iceBoardVDIF
        - dpdk_handler: iceBoardVDIF
        - dpdk_handler: iceBoardVDIF
        - dpdk_handler: iceBoardVDIF
        - dpdk_handler: iceBoardVDIF
        - dpdk_handler: iceBoardVDIF
    out_buf: vdif_buffer
    lost_samples_buf: lost_samples_buffer

zero_samples:
    kotekan_stage: invalidateVDIFframes
    out_buf: vdif_buffer
    lost_samples_buf: lost_samples_buffer

raw_capture:
   kotekan_stage: nDiskFileWrite
#################################
# THIS IS THE PLACE TO EDIT!!!  #
#################################
   note: ARO 46m Recording
   # Change this if you want to record
   write_to_disk: True
   write_metadata_and_gains: False
   gain_files: Null
   disk_base: /drives
   disk_set: N
   # Can set above: num_disks
   in_buf: vdif_buffer
# These next two stages are used for live viewing of the data
# they are not required for saving data.

