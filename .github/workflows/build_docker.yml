name: Manual Docker image build

on:
  workflow_dispatch:
    inputs:
      image_branch:
        description: "Git branch to build"
        required: true
        default: "chord"
      uyear:
        description: "Ubuntu year (18, 22, or 24)"
        required: true
        default: "24"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.image_branch }}
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and Dockerfile path
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # Same base image name style as the CI workflow
          IMG_2404="ghcr.io/${{ github.repository }}/kotekan-${{ inputs.uyear }}04"
        
          # Keep case, just sanitize to image-tag-safe (replace '/' etc. with '.')
          BRANCH_TAG="$(echo "${{ inputs.image_branch }}" | sed -E 's/[^a-zA-Z0-9_.-]+/./g')"
        
          DOCKERFILE="tools/docker/${{ inputs.uyear }}.04/Dockerfile"
        
          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "img_name=${IMG_2404}:${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image name: ${IMG_2404}:${BRANCH_TAG}"

      - name: Verify Dockerfile exists
        shell: bash
        run: |
          echo "Dockerfile: ${{ steps.meta.outputs.dockerfile }}"
          if [ ! -f "${{ steps.meta.outputs.dockerfile }}" ]; then
            echo "::error::Missing Dockerfile at ${{ steps.meta.outputs.dockerfile }}"
            exit 1
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.img_name }}

      - name: Show resulting tag
        shell: bash
        run: |
          echo "Pushed: ${{ steps.meta.outputs.img_name }}"
