name: Daily Job Scheduler

on:
  schedule:
    # Run every day at 8 AM UTC (4 AM ET / 1 AM PT)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      branches:
        description: 'Custom branch name or comma-separated list (e.g., "feature/test" or "feature/a,feature/b")'
        required: false
        default: ''
        type: string

jobs:
  determine-branches:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Determine which branches to run
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.branches }}" ]; then
            # Manual trigger with custom branches
            BRANCHES="${{ github.event.inputs.branches }}"
            echo "Manual trigger for branches: $BRANCHES"
          else
            # Scheduled trigger
            BRANCHES="chord,develop"
            echo "Running scheduled branches: $BRANCHES"
          fi
          
          # Convert comma-separated list to JSON array
          JSON_ARRAY=$(echo $BRANCHES | jq -R -s -c 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "matrix={\"branch\":$JSON_ARRAY}" >> $GITHUB_OUTPUT

  trigger-workflows:
    needs: determine-branches
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.determine-branches.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Trigger workflow on ${{ matrix.branch }}
        env:
          BRANCH: ${{ matrix.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting to trigger workflow on branch: $BRANCH"
          
          # Check if branch exists
          if gh api repos/${{ github.repository }}/branches/$BRANCH >/dev/null 2>&1; then
            # Trigger workflow
            gh workflow run scheduled_tasks.yml \
              --ref "$BRANCH" \
              -f trigger_source="${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}" \
              -f triggered_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -f schedule_type="${{ github.event.schedule || 'manual' }}"
            
            echo "Successfully triggered workflow on branch: $BRANCH"
          else
            echo "Branch '$BRANCH' not found, skipping..."
          fi
