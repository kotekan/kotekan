# This workflow runs suites of tests on both a local runner and github runners.
# Generally, it should be when pull requests are open/updated, or on direct pushes (uncommon).
# It calls the build_push_docker workflow to make sure the kotekan docker image exists,
# and the test_kotekan_build workflow for kotekan tests.
---
name: kotekan-ci-tests
on:
  workflow_dispatch:
  pull_request:
    branches:
    - develop
    - pilotproxy-dtv-detector
  push:
    branches:
    - develop
    - pilotproxy-dtv-detector

permissions: {}

# Cancel a superseded PR run on a new commit; let push runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:

  pilotproxy-vendor:
    name: PilotProxy vendor integrity
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: python3 tools/check_vendored_pilotproxy.py --offline

  # Kotekan docker image build and push
  kotekan-docker:
    needs: pilotproxy-vendor
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build_push_docker.yaml

  kotekan-cpu-tests:
    name: CPU
    needs: kotekan-docker
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test_kotekan_build.yaml
    with:
      container_image: ${{ needs.kotekan-docker.outputs.docker_cpu_img_name }}
      ccache_key: ${{ matrix.ccache_key }}
      cmake_defs: ${{ matrix.cmake_defs }}
      post_build: ${{ matrix.post_build }}
      runs_on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          
          # Test gcc build + no features
          - id: test_gcc_basic
            ccache_key: kotekan-test-gcc-cpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=OFF -DNO_MEMLOCK=OFF
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=OFF -DUSE_HDF5=OFF -DUSE_GDAL=OFF
              -DUSE_AIRSPY=OFF -DUSE_LAPACK_BLAZE=OFF -DUSE_FFTW=OFF -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: ""   # nothing to run

          # Test gcc build + serial pytests
          - id: test_gcc_serial_pytests
            ccache_key: kotekan-test-gcc-cpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: |
              PYTHONPATH=$GITHUB_WORKSPACE/python
              PYTEST_TIMEOUT=60
              cd $GITHUB_WORKSPACE/tests
              pytest -v -x -rs --durations=0 --timeout="${PYTEST_TIMEOUT}" -m serial

          # Test gcc build + parallel pytests
          - id: test_gcc_parallel_pytests
            ccache_key: kotekan-test-gcc-cpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: |
              PYTHONPATH=$GITHUB_WORKSPACE/python
              PYTEST_TIMEOUT=60
              cd $GITHUB_WORKSPACE/tests
              pytest -v -n auto -rs --dist=loadfile --durations=0 --timeout="${PYTEST_TIMEOUT}" -x -m 'not serial'

          # Test gcc build + boost tests
          - id: test_gcc_boost
            ccache_key: kotekan-test-gcc-cpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=ON
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=ON
            post_build: |
              TEST_TIMEOUT=30
              bash $GITHUB_WORKSPACE/tests/boost/run_boost_tests.sh -v -t "${TEST_TIMEOUT}" $GITHUB_WORKSPACE/build-2404/tests/boost

          # Release gcc build + serial pytests
          - id: release_gcc_serial_pytests
            ccache_key: kotekan-release-gcc-cpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Release -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: |
              PYTHONPATH=$GITHUB_WORKSPACE/python
              PYTEST_TIMEOUT=60
              cd $GITHUB_WORKSPACE/tests
              pytest -v -x -rs --durations=0 --timeout="${PYTEST_TIMEOUT}" -m serial

          # Release gcc build + parallel pytests
          - id: release_gcc_parallel_pytests
            ccache_key: kotekan-release-gcc-cpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Release -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: |
              PYTHONPATH=$GITHUB_WORKSPACE/python
              PYTEST_TIMEOUT=60
              cd $GITHUB_WORKSPACE/tests
              pytest -v -n auto -rs --dist=loadfile --durations=0 --timeout="${PYTEST_TIMEOUT}" -x -m 'not serial'

          # Test clang build
          - id: clang
            ccache_key: kotekan-test-clang-cpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DUSE_OMP=ON -DUSE_NUMA=OFF -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=ON
            post_build: ""  # Any clang tests to run?

          # Release clang build and install
          - id: release_clang_install
            ccache_key: kotekan-release-clang-cpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Release -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DUSE_OMP=ON -DUSE_NUMA=OFF -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=ON
            post_build: |
              # Attempt install
              (cd $GITHUB_WORKSPACE/build-2404 && make install)
              # Just try executing the installed kotekan
              which kotekan
              /usr/local/bin/kotekan -v

          # run yamls in config/ci-tests/cpu_batch
          - id: test-gcc-cpu-yaml
            ccache_key: kotekan-test-gcc-yaml
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=ON
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: |
              bash $GITHUB_WORKSPACE/config/ci-tests/run_tests.sh $GITHUB_WORKSPACE/build-2404/kotekan/kotekan 2m $GITHUB_WORKSPACE/config/ci-tests/cpu_batch

          # Test gcc build with docs
          - id: local-docs
            ccache_key: kotekan-test-gcc-docs
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Release -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=OFF -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF -DCOMPILE_DOCS=ON
            post_build: |
              cd $GITHUB_WORKSPACE/build-2404 && make docs


  # Run the CPU test suites built with the Intel oneAPI compilers (icx/icpx).
  # This is a trimmed-down version of the gcc CPU matrix above: one Test build
  # shared via ccache across the pytest and boost-test suites.
  kotekan-intel-tests:
    name: Intel
    needs: kotekan-docker
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test_kotekan_build.yaml
    with:
      container_image: ${{ needs.kotekan-docker.outputs.docker_intel_img_name }}
      ccache_key: ${{ matrix.ccache_key }}
      cmake_defs: ${{ matrix.cmake_defs }}
      post_build: ${{ matrix.post_build }}
      runs_on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:

          # Test icx build + serial pytests
          - id: test_icx_serial_pytests
            ccache_key: kotekan-test-icx-cpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: |
              PYTHONPATH=$GITHUB_WORKSPACE/python
              PYTEST_TIMEOUT=60
              cd $GITHUB_WORKSPACE/tests
              pytest -v -x -rs --durations=0 --timeout="${PYTEST_TIMEOUT}" -m serial

          # Test icx build + parallel pytests
          - id: test_icx_parallel_pytests
            ccache_key: kotekan-test-icx-cpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: |
              PYTHONPATH=$GITHUB_WORKSPACE/python
              PYTEST_TIMEOUT=60
              cd $GITHUB_WORKSPACE/tests
              pytest -v -n auto -rs --dist=loadfile --durations=0 --timeout="${PYTEST_TIMEOUT}" -x -m 'not serial'

          # Test icx build + boost tests
          - id: test_icx_boost
            ccache_key: kotekan-test-icx-cpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icpx
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=ON
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=ON
            post_build: |
              TEST_TIMEOUT=30
              bash $GITHUB_WORKSPACE/tests/boost/run_boost_tests.sh -v -t "${TEST_TIMEOUT}" $GITHUB_WORKSPACE/build-2404/tests/boost


  kotekan-gpu-tests:
    name: "GPU"
    # Requires an online self-hosted x86_64 CUDA runner with /data mounted;
    # leave false/unset until one is provisioned. Never execute fork code on
    # the privileged runner or expose its /data mount.
    if: >-
      ${{ vars.ENABLE_SELF_HOSTED_GPU_TESTS == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: kotekan-docker
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test_kotekan_build.yaml
    with:
      container_image: ${{ needs.kotekan-docker.outputs.docker_gpu_img_name }}
      ccache_key: ${{ matrix.ccache_key }}
      cmake_defs: ${{ matrix.cmake_defs }}
      pre_build: ${{ matrix.pre_build }}
      post_build: ${{ matrix.post_build }}
      runs_on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: true
      matrix:
        include:

          # Test gcc build + CUDA/OpenCL
          - id: test-gcc-cuda-opencl
            ccache_key: kotekan-test-gcc-gpu
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON -DUSE_HIP=OFF -DUSE_OPENCL=ON
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=ON
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=ON
              -DPILOTPROXY_EXPORT_BUNDLE=ON
            pre_build: |
              # PILOTPROXY_EXPORT_BUNDLE runs the pilot-proxy CLI at configure
              # time, so the CLI has to be on PATH before cmake. The image is
              # the better home for it. However, a pull request from a fork
              # cannot put it there, since touching the Dockerfile forces an
              # image rebuild and a push to ghcr.io that a fork's read-only
              # token is refused. Installing it here works instead. The
              # image's python is already the one the other python tooling
              # installs into, so a plain pip install is enough. The commit is
              # the one the vendored detector core is pinned to, read from the
              # vendor manifest rather than repeated here, so the exported
              # bundle geometry always matches the compiled kernel.
              PP_COMMIT="$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_WORKSPACE"] + "/external/pilotproxy/VENDOR.json"))["upstream_commit"])')"
              echo "Installing the pilot-proxy CLI at ${PP_COMMIT}"
              python3 -m pip install --upgrade "git+https://github.com/WVURAIL/pilot-proxy@${PP_COMMIT}"
              command -v pilot-proxy
            post_build: ""   # Any OpenCL-specific commands to test?
            runs_on: self-hosted

          # run yamls in config/ci-tests/gpu_batch
          - id: test-gcc-gpu-yaml
            ccache_key: kotekan-test-gcc-yaml
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON -DUSE_HIP=OFF -DUSE_OPENCL=ON
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=ON
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
              -DPILOTPROXY_EXPORT_BUNDLE=ON
            pre_build: |
              PP_COMMIT="$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_WORKSPACE"] + "/external/pilotproxy/VENDOR.json"))["upstream_commit"])')"
              echo "Installing the pilot-proxy CLI at ${PP_COMMIT}"
              python3 -m pip install --upgrade "git+https://github.com/WVURAIL/pilot-proxy@${PP_COMMIT}"
              command -v pilot-proxy
            post_build: |
              bash $GITHUB_WORKSPACE/config/ci-tests/run_tests.sh $GITHUB_WORKSPACE/build-2404/kotekan/kotekan 2m $GITHUB_WORKSPACE/config/ci-tests/gpu_batch
              PIPELINE_DIR="$RUNNER_TEMP/pilotproxy_pipeline_test"
              mkdir -p "$PIPELINE_DIR/fake_data/pilotproxy_bundle" "$PIPELINE_DIR/fake_data/pilotproxy_verify"
              cp "$GITHUB_WORKSPACE/build-2404/pilotproxy_bundle/"* "$PIPELINE_DIR/fake_data/pilotproxy_bundle/"
              (cd "$PIPELINE_DIR" && "$GITHUB_WORKSPACE/build-2404/kotekan/kotekan" --config "$GITHUB_WORKSPACE/config/tests/verify_pilotproxy_pipeline.yaml")
              python3 "$GITHUB_WORKSPACE/tools/verify_pilotproxy_pipeline.py" --dump-dir "$PIPELINE_DIR/fake_data/pilotproxy_verify" --bundle-dir "$PIPELINE_DIR/fake_data/pilotproxy_bundle"
            runs_on: self-hosted

          # run yamls in config/ci-tests/gpu_batch
          - id: release-gcc-gpu-yaml
            ccache_key: kotekan-release-gcc-yaml
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Release -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON -DUSE_HIP=OFF -DUSE_OPENCL=ON
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=OFF -DUSE_DPDK=ON
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
              -DPILOTPROXY_EXPORT_BUNDLE=ON
            pre_build: |
              PP_COMMIT="$(python3 -c 'import json, os; print(json.load(open(os.environ["GITHUB_WORKSPACE"] + "/external/pilotproxy/VENDOR.json"))["upstream_commit"])')"
              echo "Installing the pilot-proxy CLI at ${PP_COMMIT}"
              python3 -m pip install --upgrade "git+https://github.com/WVURAIL/pilot-proxy@${PP_COMMIT}"
              command -v pilot-proxy
            post_build: |
              bash $GITHUB_WORKSPACE/config/ci-tests/run_tests.sh $GITHUB_WORKSPACE/build-2404/kotekan/kotekan 2m $GITHUB_WORKSPACE/config/ci-tests/gpu_batch
              PIPELINE_DIR="$RUNNER_TEMP/pilotproxy_pipeline_release"
              mkdir -p "$PIPELINE_DIR/fake_data/pilotproxy_bundle" "$PIPELINE_DIR/fake_data/pilotproxy_verify"
              cp "$GITHUB_WORKSPACE/build-2404/pilotproxy_bundle/"* "$PIPELINE_DIR/fake_data/pilotproxy_bundle/"
              (cd "$PIPELINE_DIR" && "$GITHUB_WORKSPACE/build-2404/kotekan/kotekan" --config "$GITHUB_WORKSPACE/config/tests/verify_pilotproxy_pipeline.yaml")
              python3 "$GITHUB_WORKSPACE/tools/verify_pilotproxy_pipeline.py" --dump-dir "$PIPELINE_DIR/fake_data/pilotproxy_verify" --bundle-dir "$PIPELINE_DIR/fake_data/pilotproxy_bundle"
            runs_on: self-hosted

          # /data dir test"
          - id: data-test
            cmake_defs: ""
            post_build: |
              # Try something with the persistent /data directory.
              touch /data/tmp
              ls /data
              rm /data/tmp
            runs_on: self-hosted


  # Run the linter as its own top-level job (rather than as a matrix entry
  # inside kotekan-cpu-tests) so the auto-lint-fix job below can run conditioned
  # on this job's result.
  kotekan-lint:
    name: "Lint"
    needs: kotekan-docker
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/test_kotekan_build.yaml
    with:
      container_image: ${{ needs.kotekan-docker.outputs.docker_cpu_img_name }}
      ccache_key: kotekan-lint
      cmake_defs: ""
      post_build: |
        cd $GITHUB_WORKSPACE
        git config --global --add safe.directory $GITHUB_WORKSPACE
        bash ./tools/lint.sh

  # This stable aggregate check is the branch-protection target. GPU jobs may
  # be skipped until a self-hosted runner is enabled and for untrusted fork PRs.
  ci-success:
    name: CI success
    if: ${{ always() }}
    needs:
      - pilotproxy-vendor
      - kotekan-docker
      - kotekan-cpu-tests
      - kotekan-intel-tests
      - kotekan-gpu-tests
      - kotekan-lint
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VENDOR_RESULT: ${{ needs.pilotproxy-vendor.result }}
      DOCKER_RESULT: ${{ needs.kotekan-docker.result }}
      CPU_RESULT: ${{ needs.kotekan-cpu-tests.result }}
      INTEL_RESULT: ${{ needs.kotekan-intel-tests.result }}
      GPU_RESULT: ${{ needs.kotekan-gpu-tests.result }}
      LINT_RESULT: ${{ needs.kotekan-lint.result }}
    steps:
      - name: Require successful hosted checks
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          required_results=(
            "PilotProxy vendor integrity=${VENDOR_RESULT}"
            "Docker images=${DOCKER_RESULT}"
            "CPU matrix=${CPU_RESULT}"
            "Intel matrix=${INTEL_RESULT}"
            "Lint=${LINT_RESULT}"
          )

          for entry in "${required_results[@]}"; do
            name="${entry%%=*}"
            result="${entry#*=}"
            if [[ "$result" != "success" ]]; then
              echo "::error title=${name} failed::Result was ${result}"
              failed=1
            fi
          done

          if [[ "$GPU_RESULT" != "success" && "$GPU_RESULT" != "skipped" ]]; then
            echo "::error title=GPU matrix failed::Result was ${GPU_RESULT}"
            failed=1
          elif [[ "$GPU_RESULT" == "skipped" ]]; then
            echo "::notice::GPU matrix skipped because it is disabled or unsafe for this event."
          fi

          exit "$failed"

  # If kotekan-lint failed, open a PR with lint fixes back to the branch
  # that triggered the failing run. Skipped for PRs from forks because
  # we can't push the fix branch into a fork.
  auto-lint-fix:
    name: "Auto lint fix"
    needs: [kotekan-docker, kotekan-lint]
    if: >-
      ${{ always() && needs.kotekan-lint.result == 'failure' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      pull-requests: write
    env:
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply linter fixes inside kotekan CPU container
        shell: bash
        run: |
          set -e
          IMAGE="${{ needs.kotekan-docker.outputs.docker_cpu_img_name }}"
          echo "Using image: ${IMAGE}"
          # `lint.sh -e OFF` keeps going after a single formatter fails so
          # every formatter gets a chance to apply its fixes in one pass.
          # The script still exits non-zero whenever any formatter changed
          # a file, so `|| true` keeps the step from failing here.
          docker run --rm \
            --mount type=bind,src="$(pwd)",target=/code/kotekan \
            -w /code/kotekan \
            "${IMAGE}" \
            bash -c "git config --global --add safe.directory /code/kotekan && /code/kotekan/tools/lint.sh -e OFF -d /code/kotekan" \
            || true

      - name: Restore file ownership (container ran as root)
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Open auto-lint pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "auto-lint: apply formatter fixes"
          title: "auto-lint: apply formatter fixes for ${{ env.SOURCE_BRANCH }}"
          body: |
            Automatically opened by the `auto-lint-fix` job in `main.yaml`
            after the `kotekan-lint` check failed on `${{ env.SOURCE_BRANCH }}`
            (commit `${{ env.SOURCE_SHA }}`).

            Merge this PR into `${{ env.SOURCE_BRANCH }}` to clear the lint
            check on the originating branch/PR.
          branch: auto-lint-fix/${{ env.SOURCE_BRANCH }}
          base: ${{ env.SOURCE_BRANCH }}
          delete-branch: true
