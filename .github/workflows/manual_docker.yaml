# This workflow can be used to trigger manual builds on github.
# This will only work if/when it exists on the default branch.
---
name: manual-docker-image-build

permissions: {}

on:
  workflow_dispatch:
    inputs:
      build_branch:
        description: "Tag/branch name to use for the Docker images (will be sanitized for tag)"
        required: true
        default: 'pilotproxy-dtv-detector'
        type: string

jobs:
  manual-build-docker:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build_push_docker.yaml
    with:
      build_branch: ${{ github.event.inputs.build_branch }}
