name: IWYU tasks
on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Source of trigger'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - scheduled
      triggered_at:
        description: 'ISO timestamp when triggered'
        required: false
        type: string
      schedule_type:
        description: 'Which schedule triggered this'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMG_2404: "ghcr.io/${{ github.repository }}/kotekan-2404"
  PYTEST_TIMEOUT: 60

jobs:
  log-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Log execution context
        run: |
          echo "Workflow triggered by: ${{ github.event.inputs.trigger_source }}"
          echo "Triggered at: ${{ github.event.inputs.triggered_at }}"
          echo "Schedule type: ${{ github.event.inputs.schedule_type }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"

  # Ubuntu 24.04 docker image build and push
  iwyu-build-docker-2404:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: tj-actions/changed-files@v44
        id: changed-files

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Name
        id: docker_img
        run: |
          IMAGE_NAME="${IMG_2404}:latest"
          # Check if the specific 24.04 Dockerfile was modified
          if [[ "${{ contains(steps.changed-files.outputs.all_modified_files, 'tools/docker/24.04/Dockerfile') }}" = "true" ]] ; then
             echo "Modified Dockerfile found. Rebuild forced."
             echo "docker_build=1" >> $GITHUB_OUTPUT
          else
             # Check if image exists in registry
             if docker manifest inspect ${IMAGE_NAME} >/dev/null ; then
               echo "Docker package found."
             else
               echo "Docker package NOT found. Setting docker_build=1."
               echo "docker_build=1" >> $GITHUB_OUTPUT
             fi
          fi
          echo "img_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        if: steps.docker_img.outputs.docker_build
        run: |
          echo "Building and pushing ${{ steps.docker_img.outputs.img_name }}"
          # CRITICAL FIX: cd into directory so COPY requirements.txt works
          cd tools/docker/24.04
          docker build --cache-from=${IMG_2404} -t "${{ steps.docker_img.outputs.img_name }}" .
          docker push "${{ steps.docker_img.outputs.img_name }}"

    outputs:
      docker_img_name: "${{ steps.docker_img.outputs.img_name }}"

  # Run the IWYU script.
  run-iwyu:
    runs-on: ubuntu-latest
    needs: iwyu-build-docker-2404

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run IWYU
        run: |
          # Run the include-what-you-use tool inside the container
          docker run --rm \
            -v ${{ github.workspace }}:/code/kotekan \
            -w /code/kotekan \
            ${{ needs.iwyu-build-docker-2404.outputs.docker_img_name }} \
            /bin/bash -c "mkdir -p build && cd build && cmake -DIWYU=ON .. && make -j$(nproc)"