# Run the iwyu linter. Generally, triggered manually or via scheduler.
# Running IWYU takes a while, so is not currently run for every PR.
---
name: IWYU tasks

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Source of trigger'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - scheduled
      triggered_at:
        description: 'ISO timestamp when triggered'
        required: false
        type: string
      schedule_type:
        description: 'Which schedule triggered this'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  PYTEST_TIMEOUT: 60

jobs:
  log-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Log execution context
        run: |
          echo "Workflow triggered by: ${{ github.event.inputs.trigger_source }}"
          echo "Triggered at:        ${{ github.event.inputs.triggered_at }}"
          echo "Schedule type:       ${{ github.event.inputs.schedule_type }}"
          echo "Branch:              ${{ github.ref_name }}"
          echo "Actor:               ${{ github.actor }}"

  # Build/push Docker images via reusable workflow
  iwyu-build-docker:
    permissions: write-all
    uses: ./.github/workflows/build_push_docker.yml
    # For IWYU we don't override build_branch; the reusable workflow
    # will choose a tag based on event / Dockerfile changes.
    # with:
    #   build_branch: ${{ github.ref_name }}

  # Run the IWYU script using the CPU image
  run-iwyu:
    runs-on: ubuntu-latest
    needs: iwyu-build-docker

    steps:
      - uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run lint.sh (IWYU)
        shell: bash
        run: |
          set -e
          IMAGE="${{ needs.iwyu-build-docker.outputs.docker_cpu_img_name }}"
          echo "Using image: ${IMAGE}"
          docker run --rm \
            --mount type=bind,src="$(pwd)",target=/code/kotekan \
            -w /code/kotekan \
            "${IMAGE}" \
            /code/kotekan/tools/lint.sh -i ON -d /code/kotekan
