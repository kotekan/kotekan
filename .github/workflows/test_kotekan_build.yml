name: Test Kotekan Build

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
      container_image:
        required: true
        type: string
      ccache_key:
        required: true
        type: string
      cmake_defs:
        required: true
        type: string
      post_build:
        required: true
        type: string

jobs:
  test-kotekan-build:
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    container:
      image: ${{ inputs.container_image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        ${{ contains(inputs.runs_on || '', 'self-hosted')
            && '--privileged --mount type=bind,source=/data,target=/data --log-level=info'
            || '--log-level=info' }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: true
      CCACHE_TEMPDIR: /tmp/.ccache
      CCACHE_MAXSIZE: 1G

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ inputs.ccache_key }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ inputs.ccache_key }}-

      - name: Print local compute environment details
        run: |
          echo "==========="
          pwd
          echo "==========="
          ls -la
          echo "==========="
          env
          echo "==========="
          df -h
          echo "==========="
          free -h
          echo "==========="
          lscpu
          echo "==========="
          uname -m
          echo "==========="
          du -xh --max-depth=2 / | sort -h | tail -40
          echo "==========="
          du -xh --max-depth=1 /__e | sort -h
          echo "==========="
          du -xh --max-depth=3 /__w | sort -h | tail -40
          echo "==========="
          find / -xdev -type f -size +500M -printf '%p %kK\n' 2>/dev/null | sort -nk2 | tail -40
          echo "==========="

      - name: Verify architecture is x86_64
        if: ${{ !contains(runner.labels, 'self-hosted') }}
        run: |
          arch=$(uname -m)
          echo "Detected architecture: $arch"
          if [ "$arch" != "x86_64" ]; then
            echo "::error::This job must run on an x86_64 runner (found $arch)"
            exit 1
          fi

      - name: Configure & Build kotekan
        if: inputs.cmake_defs
        run: |
          set -euo pipefail
          mkdir $GITHUB_WORKSPACE/build-2404 && cd $GITHUB_WORKSPACE/build-2404
          ccache -s
          cmake -DARCH=haswell -Wdev -Werror=dev -Wdeprecated -Werror=deprecated ${{ inputs.cmake_defs }} ..
          make -j $(nproc)
          ccache -s

      - name: Post-build commands
        if: inputs.post_build
        shell: bash
        run: |
          set -euo pipefail
          # Run any commands specified ...
          ${{ inputs.post_build }}
