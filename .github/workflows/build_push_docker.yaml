# This re-usable workflow conditionally builds and pushes the kotekan `cpu`,
# `intel`, and `gpu` Docker builds. It returns each full image location plus
# tag, using a changed branch or PR base as the tag source.
# 
#  - If this workflow is triggered by a PR open, PR update, or push, it
#    should only execute if the Dockerfile has changed since the last
#    commit(s), or if there aren't changes, if the PR is new and the PR
#    branches Dockerfiles differ between the PR base and head.
#  - On manual or scheduled builds, the build will execute.
#  - If this job is run locally, i.e. using ACT, the variable force_build
#    in the script can be locally set to 1 to trigger a build.
#
# The GPU docker file sizes are significant, 12-13 GB, and we only (as of
# writing this) get 14 GB on the github runners, so an additional step may
# clear some bloat on the github hosted runners.
# 
---

name: Build and optionally push docker images

env:
  REGISTRY: ghcr.io
  IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

permissions: {}

on:
  workflow_call:
    inputs:
      build_branch:
        required: false
        type: string
    outputs:
      docker_cpu_img_name:
        description: "Full CPU image name (including tag) built or selected by this workflow"
        value: ${{ jobs.build-push-docker.outputs.docker_cpu_img_name }}
      docker_gpu_img_name:
        description: "Full GPU image name (including tag) built or selected by this workflow"
        value: ${{ jobs.build-push-docker.outputs.docker_gpu_img_name }}
      docker_intel_img_name:
        description: "Full Intel-compiler image name (including tag) built or selected by this workflow"
        value: ${{ jobs.build-push-docker.outputs.docker_intel_img_name }}

jobs:

  build-push-docker:
    name: "Build and push CPU, Intel, and GPU docker images"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      docker_cpu_img_name: ${{ steps.docker_img.outputs.cpu_img_name }}
      docker_gpu_img_name: ${{ steps.docker_img.outputs.gpu_img_name }}
      docker_intel_img_name: ${{ steps.docker_img.outputs.intel_img_name }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test Docker tag sanitizer
        if: >-
          ${{ github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository }}
        run: python3 tools/docker/test_sanitize_image_tag.py

      - name: Normalize container image namespace
        shell: bash
        run: |
          set -euo pipefail
          repository_lower=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          {
            echo "CPU_IMG=${REGISTRY}/${repository_lower}/kotekan-2404-cpu"
            echo "GPU_IMG=${REGISTRY}/${repository_lower}/kotekan-2404"
            echo "INTEL_IMG=${REGISTRY}/${repository_lower}/kotekan-2404-intel"
          } >> "$GITHUB_ENV"

      # Has the Dockerfile ever changed vs base branch? (for tag selection)
      - name: Check Dockerfile diff vs base
        id: changed-vs-base
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            tools/docker/24.04/Dockerfile

       # Has the Dockerfile changed in the latest push? (for rebuild decision)
      - name: Check Dockerfile diff in latest push
        id: changed-latest
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            tools/docker/24.04/Dockerfile
          since_last_remote_commit: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        if: ${{ env.ACT == '' }} # Don't log in if running locally
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check to see if Docker rebuild is needed
        id: docker_img
        env:
          DOCKERFILE_EVER_CHANGED: ${{ steps.changed-vs-base.outputs.any_changed }}
          DOCKERFILE_RECENT_CHANGED: ${{ steps.changed-latest.outputs.any_changed }}
          BUILD_BRANCH: ${{ inputs.build_branch }}
        run: |
          set -euo pipefail
          event="$GITHUB_EVENT_NAME"
          is_fork_pr="${IS_FORK_PR:-false}"
          force_build=0
          tag=""

          if [[ "$event" == "pull_request_target" ]]; then
            echo "::error::This reusable workflow refuses pull_request_target events because Docker builds execute repository code."
            exit 1
          fi

          # determine "safe" head/base branches
          head_branch="$GITHUB_REF_NAME"
          base_branch="$GITHUB_REF_NAME"
          if [[ "$event" == "pull_request" ]]; then
            head_branch="$GITHUB_HEAD_REF"
            base_branch="$GITHUB_BASE_REF"
          fi

          # Never execute scripts from a fork checkout in this registry job.
          # Trusted events use the collision-resistant sanitizer; fork PRs are
          # restricted to an already-valid base-branch tag.
          safe_head=""
          safe_base=""
          if [[ "$is_fork_pr" == "true" ]]; then
            if [[ ! "$base_branch" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              echo "::error::The base branch cannot be represented directly as a Docker tag; a maintainer must publish a trusted tag."
              exit 1
            fi
            safe_base="$base_branch"
          else
            safe_head=$(python3 tools/docker/sanitize_image_tag.py -- "$head_branch")
            safe_base=$(python3 tools/docker/sanitize_image_tag.py -- "$base_branch")
          fi

          echo "DOCKERFILE_EVER_CHANGED=${DOCKERFILE_EVER_CHANGED}"
          echo "DOCKERFILE_RECENT_CHANGED=${DOCKERFILE_RECENT_CHANGED}"
          echo "event=${event}"
          echo "is_fork_pr=${is_fork_pr}"

          # If build_branch is provided, we use that as the tag and always rebuild
          override_branch="${BUILD_BRANCH:-}"
          if [[ "$is_fork_pr" == "true" ]]; then
            if [[ -n "$override_branch" ]]; then
              echo "::error::Fork pull requests cannot override or publish Docker image tags."
              exit 1
            fi
            if [[ "$DOCKERFILE_EVER_CHANGED" == "true" ]]; then
              echo "::error::Dockerfile changes from fork pull requests require validation from a maintainer-owned branch."
              exit 1
            fi
            echo "Fork pull request: using the trusted base-branch images without rebuilding."
            tag="$safe_base"
          elif [[ -n "$override_branch" ]]; then
            echo "build_branch input provided: $override_branch. Forcing docker rebuild for that tag."
            tag=$(python3 tools/docker/sanitize_image_tag.py -- "$override_branch")
            force_build=1
          else
            # 1) Decide which branch/tag to use
            if [[ "$event" == "pull_request" ]]; then
              if [[ "$DOCKERFILE_EVER_CHANGED" == "true" ]]; then
                echo "Dockerfile changed at some point in this PR. Using HEAD branch tag."
                tag="$safe_head"
              else
                echo "Dockerfile never changed vs base in this PR. Using BASE branch tag."
                tag="$safe_base"
              fi
            else
              echo "Non-PR event. Using HEAD branch tag."
              tag="$safe_head"
            fi
          fi

          # 2) Decide whether we actually build
          needs_build=0

          if [[ "$is_fork_pr" != "true" ]]; then
            # Force rebuild for manual/scheduled runs
            if [[ "$event" == "workflow_dispatch" || "$event" == "schedule" ]]; then
              echo "Manual or scheduled trigger (${event}). Forcing docker rebuild."
              needs_build=1
            fi

            # Rebuild if Dockerfile changed in the latest push
            if [[ "$DOCKERFILE_RECENT_CHANGED" == "true" ]]; then
              echo "Dockerfile changed in latest push. Forcing docker rebuild."
              needs_build=1
            fi

            # Or if DOCKER_BUILD is set
            if [[ -n "${DOCKER_BUILD:-}" ]]; then
              echo "DOCKER_BUILD set. Forcing docker rebuild."
              needs_build=1
            fi

            # Or if override_branch logic requested a build
            if [[ "$force_build" -eq 1 ]]; then
              needs_build=1
            fi
          fi

          CPU_IMAGE_TAG="${CPU_IMG}:${tag}"
          GPU_IMAGE_TAG="${GPU_IMG}:${tag}"
          INTEL_IMAGE_TAG="${INTEL_IMG}:${tag}"

          # As a last check, ensure images actually exist in the registry.
          # If they don't, force a rebuild (only for real GitHub runs, not act).
          if [[ -z "${ACT:-}" ]]; then
            echo "Checking whether images exist in ${REGISTRY}..."
            missing=0

            if ! docker manifest inspect "$CPU_IMAGE_TAG" >/dev/null 2>&1; then
              echo "CPU image $CPU_IMAGE_TAG not found in registry."
              missing=1
            fi

            if ! docker manifest inspect "$GPU_IMAGE_TAG" >/dev/null 2>&1; then
              echo "GPU image $GPU_IMAGE_TAG not found in registry."
              missing=1
            fi

            if ! docker manifest inspect "$INTEL_IMAGE_TAG" >/dev/null 2>&1; then
              echo "Intel image $INTEL_IMAGE_TAG not found in registry."
              missing=1
            fi

            if [[ "$missing" -eq 1 ]]; then
              if [[ "$is_fork_pr" == "true" ]]; then
                echo "::error::One or more trusted base-branch images are missing; a maintainer must publish them before this fork PR can run."
                exit 1
              fi
              echo "One or more images missing; forcing docker rebuild."
              needs_build=1
            fi
          else
            echo "ACT detected; skipping remote image existence check."
          fi

          {
            echo "docker_build=$needs_build"
            echo "cpu_img_name=$CPU_IMAGE_TAG"
            echo "gpu_img_name=$GPU_IMAGE_TAG"
            echo "intel_img_name=$INTEL_IMAGE_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "CPU image: $CPU_IMAGE_TAG"
          echo "GPU image: $GPU_IMAGE_TAG"
          echo "Intel image: $INTEL_IMAGE_TAG"
          echo "docker_build=$needs_build"

      - name: Output environment and variable details
        run: |
          echo "The job_id is: $GITHUB_JOB"
          echo "The id of this action is: $GITHUB_ACTION"
          echo "The run id is: $GITHUB_RUN_ID"
          echo "The repository is: $GITHUB_REPOSITORY"
          echo "The GitHub Actor's username is: $GITHUB_ACTOR"
          echo "GitHub SHA: $GITHUB_SHA"
          echo "GitHub event name: $GITHUB_EVENT_NAME"
          echo "GitHub Ref: $GITHUB_REF"
          echo "GitHub Head Ref: $GITHUB_HEAD_REF"
          echo "GitHub Base Ref: $GITHUB_BASE_REF"
          echo "GitHub Ref Name: $GITHUB_REF_NAME"
          echo "Docker CPU image base: $CPU_IMG"
          echo "Used docker CPU image name: ${{ steps.docker_img.outputs.cpu_img_name }}"
          echo "Docker GPU image base: $GPU_IMG"
          echo "Used docker GPU image name: ${{ steps.docker_img.outputs.gpu_img_name }}"
          echo "Docker Intel image base: $INTEL_IMG"
          echo "Used docker Intel image name: ${{ steps.docker_img.outputs.intel_img_name }}"
          echo "docker_build: ${{ steps.docker_img.outputs.docker_build }}"
          echo "ACT: ${ACT:-}"

      # This takes about a minute to clean, so only run it when we need to.
      - name: "Github-hosted runner cleanup"
        if: >-
          ${{ steps.docker_img.outputs.docker_build == '1' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
          df -h

      - name: Build CPU (target=cpu) image
        if: >-
          ${{ steps.docker_img.outputs.docker_build == '1' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tools/docker/24.04/Dockerfile
          target: cpu
          tags: ${{ steps.docker_img.outputs.cpu_img_name }}
          push: >-
            ${{ env.ACT == '' &&
                (github.event_name != 'pull_request' ||
                 github.event.pull_request.head.repo.full_name == github.repository) }}
          load: ${{ env.ACT != '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Intel (target=intel) image
        if: >-
          ${{ steps.docker_img.outputs.docker_build == '1' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tools/docker/24.04/Dockerfile
          target: intel
          tags: ${{ steps.docker_img.outputs.intel_img_name }}
          push: >-
            ${{ env.ACT == '' &&
                (github.event_name != 'pull_request' ||
                 github.event.pull_request.head.repo.full_name == github.repository) }}
          load: ${{ env.ACT != '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build GPU (target=gpu) image
        if: >-
          ${{ steps.docker_img.outputs.docker_build == '1' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: tools/docker/24.04/Dockerfile
          target: gpu
          tags: ${{ steps.docker_img.outputs.gpu_img_name }}
          push: >-
            ${{ env.ACT == '' &&
                (github.event_name != 'pull_request' ||
                 github.event.pull_request.head.repo.full_name == github.repository) }}
          load: ${{ env.ACT != '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
