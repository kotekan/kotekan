# Cron entry point for recurring CI tasks. GitHub only runs `schedule` triggers
# from the workflow file on the repository's default branch, so this must live
# on the default branch to fire. It fans out by dispatching the per-branch
# `scheduled_tasks.yaml` and `iwyu.yaml` workflows.
---
name: Daily Job Scheduler

permissions: {}

on:
  schedule:
    # Run every day at 8 AM UTC (4 AM ET / 1 AM PT)
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      branches:
        description: 'Custom branch name or comma-separated list (e.g., "feature/test" or "feature/a,feature/b")'
        required: false
        default: ''
        type: string

jobs:
  determine-branches:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Determine which branches to run
        id: set-matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BRANCH_INPUT: ${{ inputs.branches }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          script: |
            let branches = [];
            const input = process.env.BRANCH_INPUT || '';

            if (context.eventName === 'workflow_dispatch' && input) {
              // Manual trigger with custom branches
              branches = input.split(',').map(b => b.trim()).filter(b => b);
              console.log('Manual trigger for branches:', branches);
            } else {
              // Scheduled trigger or manual without custom branches
              const defaultBranch = process.env.DEFAULT_BRANCH || context.ref.replace('refs/heads/', '');
              branches = [defaultBranch];
              console.log('Running scheduled branches:', branches);
            }

            const matrix = { branch: branches };
            core.setOutput('matrix', JSON.stringify(matrix));
            return matrix;

  trigger-workflows:
    needs: determine-branches
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.determine-branches.outputs.matrix) }}
      fail-fast: false
    steps:
      - name: Trigger workflow on ${{ matrix.branch }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.TARGET_BRANCH;

            try {
              // Check if branch exists
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branch
              });

              // Trigger the scheduled tasks workflow
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'scheduled_tasks.yaml',
                ref: branch,
                inputs: {
                  trigger_source: context.eventName === 'schedule' ? 'scheduled' : 'manual',
                  triggered_at: new Date().toISOString(),
                  schedule_type: context.eventName === 'schedule' ?
                    context.payload.schedule : 'manual'
                }
              });

              // Trigger the IWYU workflow
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'iwyu.yaml',
                ref: branch,
                inputs: {
                  trigger_source: context.eventName === 'schedule' ? 'scheduled' : 'manual',
                  triggered_at: new Date().toISOString(),
                  schedule_type: context.eventName === 'schedule' ?
                    context.payload.schedule : 'manual'
                }
              });

              console.log(`Successfully triggered workflow on branch: ${branch}`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`Branch '${branch}' or workflow not found, skipping...`);
              } else {
                console.error(`Error triggering workflow on ${branch}:`, error.message);
                throw error;
              }
            }
