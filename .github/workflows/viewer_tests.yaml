---
name: Python tests

on:
    pull_request:
        branches: [develop]
    push:
        branches: [develop]

permissions:
    contents: read

jobs:
    debug-viewer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: '3.12'
            - name: Install Python utilities and debug viewer dependencies
              run: python -m pip install ./python flask flask-cors
            - name: Check installed Python utilities
              run: |
                  python -m pip check
                  python -c "from kotekan import __version__, config, runner; print(__version__)"
                  kotekan-ctl --help
            - name: Test dump directory access
              run: python -m unittest discover -s tools/debug_tool -p 'test_*.py'
