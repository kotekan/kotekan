---
name: Debug viewer tests

on:
    pull_request:
        branches: [develop]
    push:
        branches: [develop]

permissions:
    contents: read

jobs:
    debug-viewer:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.12'
            - name: Install debug viewer dependencies
              run: python -m pip install flask flask-cors requests
            - name: Test dump directory access
              run: python -m unittest discover -s tools/debug_tool -p 'test_*.py'
