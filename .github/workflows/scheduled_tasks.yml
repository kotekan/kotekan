name: Scheduled Tasks
on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Source of trigger'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - scheduled
      triggered_at:
        description: 'ISO timestamp when triggered'
        required: false
        type: string
      schedule_type:
        description: 'Which schedule triggered this'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMG_2404: "ghcr.io/${{ github.repository }}/kotekan-2404"
  PYTEST_TIMEOUT: 60

jobs:

  log-execution:
    runs-on: ubuntu-latest
    steps:
      - name: Log execution context
        run: |
          echo "Workflow triggered by: ${{ github.event.inputs.trigger_source }}"
          echo "Triggered at: ${{ github.event.inputs.triggered_at }}"
          echo "Schedule type: ${{ github.event.inputs.schedule_type }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Actor: ${{ github.actor }}"

  # Ubuntu 24.04 docker image build and push
  build-docker-2404:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check for file changes
      uses: tj-actions/changed-files@v44
      id: changed-files

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Rebuild (or build) for a push/pr from a local branch (separate workflow for PR merges)
    - name: Check to see if a docker rebuild is needed
      id: docker_img
      run: |
        echo "docker_build=" >> $GITHUB_OUTPUT; # Default to no rebuild

        if [[ ${{ contains(steps.changed-files.outputs.all_modified_files, 'tools/docker/24.04/Dockerfile') }} == "true" || ${DOCKER_BUILD} ]] ; then
          echo "Modified Dockerfile found (or re-build requested). Building on local branch."
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_REF_NAME} | tr / .)"
          else
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_HEAD_REF} | tr / .)"
          fi
          echo "docker_build=1" >> $GITHUB_OUTPUT;
        else
          if [[ "${GITHUB_EVENT_NAME}" = "pull_request" || "${GITHUB_EVENT_NAME}" = "pull_request_target" ]]; then
            echo "Dockerfile was not modified. Using image from branch ${GITHUB_BASE_REF}."
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_BASE_REF} | tr / .)"
          else
            # This can happen when we're merging a chord branch back to chord, eg
            echo "Dockerfile was not modified. Using image from branch ${GITHUB_REF_NAME}."
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_REF_NAME} | tr / .)"
          fi
        fi

        if docker manifest inspect ${IMAGE_NAME} >/dev/null; then
          echo "Docker package found."
        else
          echo "Docker package NOT found. Setting docker_build=1."
          echo "docker_build=1" >> $GITHUB_OUTPUT;
        fi

        echo "img_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT;
        echo "Image name: ${IMAGE_NAME}"

    - name: Output environment variable details
      run: |
        echo "The job_id is: $GITHUB_JOB"
        echo "The id of this action is: $GITHUB_ACTION"
        echo "The run id is: $GITHUB_RUN_ID"
        echo "The repository is: $GITHUB_REPOSITORY"
        echo "The GitHub Actor's username is: $GITHUB_ACTOR"
        echo "GitHub SHA: $GITHUB_SHA"
        echo "GitHub event name: $GITHUB_EVENT_NAME"
        echo "GitHub Ref: $GITHUB_REF"
        echo "GitHub Head Ref: $GITHUB_HEAD_REF"
        echo "GitHub Base Ref: $GITHUB_BASE_REF"
        echo "GitHub Ref Name: $GITHUB_REF_NAME"
        echo "Docker 2404 image: $IMG_2404"
        echo "Used docker image name: ${{ steps.docker_img.outputs.img_name }}"
        echo "docker_build: ${{ steps.docker_img.outputs.docker_build }}"
        echo "img_name: ${{ steps.docker_img.outputs.img_name }}"

    - name: Build and Push Docker Image
      if: steps.docker_img.outputs.docker_build
      run: |
        echo "Building and pushing ${{ steps.docker_img.outputs.img_name }}"
        docker build --cache-from=${IMG_2404} -t "${{ steps.docker_img.outputs.img_name }}" - < tools/docker/24.04/Dockerfile
        docker push "${{ steps.docker_img.outputs.img_name }}"

    outputs:
      docker_img_name: "${{ steps.docker_img.outputs.img_name }}"

  # Build a version of kotekan and run some direct tests
  build-scheduled-tests-2404:
    runs-on: self-hosted
    container: 
      image: summerwind/actions-runner:ubuntu-22.04
      options: --user root
    needs: build-docker-2404

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache ccache files
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-direct-2404-${{ github.sha }}
        restore-keys: |
          ccache-direct-2404
          ccache-base-build-2404

    - name: Build kotekan
      shell: bash
      run: |
        OPTS=(--pull=always --privileged --rm --mount type=bind,src=/home/lwlab/kotekan-runner/_work/kotekan/kotekan/,target=/code/kotekan -w /code/kotekan/build-2404/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" ccache -s
        docker run "${OPTS[@]}" \
          cmake -Wdev -Werror=dev -Wdeprecated -Werror=deprecated \
            -DWERROR=ON \
            -DCMAKE_BUILD_TYPE=Test \
            -DUSE_HDF5=ON \
            -DUSE_LAPACK_BLAZE=ON -DBLAZE_PATH=/code/build/blaze \
            -DNO_MEMLOCK=ON \
            -DUSE_OMP=ON \
            -DUSE_ASDF=ON \
            -DUSE_GDAL=ON \
            -DWITH_BOOST_TESTS=ON \
            -DUSE_CUDA=ON \
            -DCCACHE=ON ..
        docker run "${OPTS[@]}" make -j
        docker run "${OPTS[@]}" rm -r lib
        docker run "${OPTS[@]}" ccache -s
        df -h

    # Run tests in the config/scheduled-tests directory with timeout
    - name: Run scheduled Kotekan tests
      run: |
        TIMEOUT_DURATION="5m"  # Timeout duration per test
        TEST_CONFIG_DIR="config/scheduled-tests"
        for config_file in "$TEST_CONFIG_DIR"/*.yaml; do
          echo "Running test with config: $config_file"
          
          # Run the test with timeout
          timeout "$TIMEOUT_DURATION" docker run --rm --privileged \
            --mount type=bind,src=/home/lwlab/kotekan-runner/_work/kotekan/kotekan/,target=/code/kotekan \
            -w /code/kotekan \
            ${{ needs.build-docker-2404.outputs.docker_img_name }} \
            ./build-2404/kotekan/kotekan --bind-address 0:23000 --config "$config_file"

          EXIT_CODE=$?

          if [ $EXIT_CODE -eq 124 ]; then
            echo "Test timed out for config: $config_file"
            exit 1
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "Test failed for config: $config_file with exit code $EXIT_CODE"
            exit 1
          else
            echo "Test passed for config: $config_file"
          fi
        done

    - name: Clean up
      run: |
        rm -rf kotekan
