# NOTE:
# When we build kotekan on the Github VM we need to take into account a few
# limitations: first we can't lock very much memory so we need to disable
# mlock the buffers. Second, the VMs run across a range of CPU
# architectures (from Haswell to Skylake-AVX512 as of 2020/03). Because our
# use of ccache shares compiled objects we must target our build for the
# lowest architecture available or we will occasionally crash with SIGILL
# when a newer instruction is called than is available.  

name: kotekan-ci-tests
on:
  pull_request:
    branches:
    - chord
    - develop
    - master
  push:
    branches:
    - chord
    - develop
    - master

env:
  REGISTRY: ghcr.io
  IMG_2404: "ghcr.io/${{ github.repository }}/kotekan-2404"
  PYTEST_TIMEOUT: 120

jobs:

  # 2404 Tests

  # Ubuntu 24.04 docker image build and push
  build-docker-2404:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check for file changes
      uses: tj-actions/changed-files@v44
      id: changed-files

    - name: Login to GitHub Container Registry
      if: ${{ !env.ACT }} # Don't log in if running locally
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Rebuild (or build) for a push/pr from a local branch (separate workflow for PR merges)
    - name: Check to see if a docker rebuild is needed
      id: docker_img
      run: |
        echo "docker_build=" >> $GITHUB_OUTPUT; # Default to no rebuild

        if [[ ${{ contains(steps.changed-files.outputs.all_modified_files, 'tools/docker/24.04/Dockerfile') }} == "true" || ${DOCKER_BUILD} ]] ; then
          echo "Modified Dockerfile found (or re-build requested). Building on local branch."
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_REF_NAME} | tr / .)"
          else
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_HEAD_REF} | tr / .)"
          fi
          echo "docker_build=1" >> $GITHUB_OUTPUT;
        else
          if [[ "${GITHUB_EVENT_NAME}" = "pull_request" || "${GITHUB_EVENT_NAME}" = "pull_request_target" ]]; then
            echo "Dockerfile was not modified. Using image from branch ${GITHUB_BASE_REF}."
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_BASE_REF} | tr / .)"
          else
            # This can happen when we're merging a chord branch back to chord, eg
            echo "Dockerfile was not modified. Using image from branch ${GITHUB_REF_NAME}."
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_REF_NAME} | tr / .)"
          fi
        fi

        if docker manifest inspect ${IMAGE_NAME} >/dev/null; then
          echo "Docker package found."
        else
          echo "Docker package NOT found. Setting docker_build=1."
          echo "docker_build=1" >> $GITHUB_OUTPUT;
        fi

        echo "img_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT;
        echo "Image name: ${IMAGE_NAME}"

    - name: Output environment variable details
      run: |
        echo "The job_id is: $GITHUB_JOB"
        echo "The id of this action is: $GITHUB_ACTION"
        echo "The run id is: $GITHUB_RUN_ID"
        echo "The repository is: $GITHUB_REPOSITORY"
        echo "The GitHub Actor's username is: $GITHUB_ACTOR"
        echo "GitHub SHA: $GITHUB_SHA"
        echo "GitHub event name: $GITHUB_EVENT_NAME"
        echo "GitHub Ref: $GITHUB_REF"
        echo "GitHub Head Ref: $GITHUB_HEAD_REF"
        echo "GitHub Base Ref: $GITHUB_BASE_REF"
        echo "GitHub Ref Name: $GITHUB_REF_NAME"
        echo "Docker 2404 image: $IMG_2404"
        echo "Used docker image name: ${{ steps.docker_img.outputs.img_name }}"
        echo "docker_build: ${{ steps.docker_img.outputs.docker_build }}"
        echo "img_name: ${{ steps.docker_img.outputs.img_name }}"

    - name: Build and Push Docker Image (outside of act)
      if: ${{ steps.docker_img.outputs.docker_build && !env.ACT }} # Push if not running locally
      run: |
        echo "Building and pushing ${{ steps.docker_img.outputs.img_name }}"
        docker build --cache-from=${IMG_2404} -t "${{ steps.docker_img.outputs.img_name }}" - < tools/docker/24.04/Dockerfile
        docker push "${{ steps.docker_img.outputs.img_name }}"

    - name: Build Docker Image (locally, in act)
      if: ${{ steps.docker_img.outputs.docker_build && env.ACT }} # Don't push if running locally
      run: |
        echo "Building ${{ steps.docker_img.outputs.img_name }} (local only, no push)"
        docker build --cache-from=${IMG_2404} -t "${{ steps.docker_img.outputs.img_name }}" - < tools/docker/24.04/Dockerfile

    outputs:
      docker_img_name: "${{ steps.docker_img.outputs.img_name }}"


  # Linting
  lint:
    runs-on: ubuntu-latest
    needs: build-docker-2404

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      if: ${{ !env.ACT }} # Don't log in if running locally
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run lint.sh
      shell: bash
      run: |
        set -e
        docker run --rm --mount type=bind,src=$(pwd),target=/code/kotekan -w /code/kotekan ${{ needs.build-docker-2404.outputs.docker_img_name }} /code/kotekan/tools/lint.sh -d /code/kotekan  # Build kotekan documentation

  # Test documentation compile
  build-docs:
    runs-on: ubuntu-latest
    needs: build-docker-2404

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      if: ${{ !env.ACT }} # Don't log in if running locally
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build kotekan docs
      run: |
        IMG=${{ needs.build-docker-2404.outputs.docker_img_name }}
        OPTS=(--rm --mount type=bind,src=$(pwd),target=/code/kotekan -w /code/kotekan/build-docs/ ${IMG})
        docker run "${OPTS[@]}" \
          cmake -DCMAKE_BUILD_TYPE=Test -DWERROR=ON \
            -DCMAKE_LINK_WHAT_YOU_USE=OFF -DCCACHE=OFF \
            -DUSE_OMP=OFF -DUSE_NUMA=ON -DNO_MEMLOCK=OFF \
            -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF \
            -DUSE_ASDF=OFF -DUSE_HDF5=OFF -DUSE_GDAL=OFF \
            -DUSE_AIRSPY=OFF -DUSE_LAPACK_BLAZE=OFF -DUSE_FFTW=OFF -DUSE_JULIA=OFF \
            -DUSE_DPDK=OFF \
            -DWITH_TESTS=OFF -DWITH_BOOST_TESTS=OFF \
            -DCOMPILE_DOCS=ON \
            ..
        docker run "${OPTS[@]}" make docs

  build-matrix-2404:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container_image || null }}
      options: ${{ matrix.container_options || '' }}
    needs: build-docker-2404

    strategy:
      fail-fast: false
      matrix:
        include:

          - id: base
            name: "Base build (no extras)"
            runner: ubuntu-latest
            container_image: ""
            container_options: ""
            cmake_defs: &base_build_cmake_opts >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=OFF -DNO_MEMLOCK=OFF
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=OFF -DUSE_HDF5=OFF -DUSE_GDAL=OFF
              -DUSE_AIRSPY=OFF -DUSE_LAPACK_BLAZE=OFF -DUSE_FFTW=OFF -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: ""   # nothing to run

          - id: full
            name: "Full build + unit tests"
            runner: ubuntu-latest
            container_image: ""
            container_options: ""
            cmake_defs: &full_build_cmake_opts >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=ON -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=ON
            post_build: |
              # Run pytest tests
              OPTS=(--rm --mount type=bind,src="${WORKSPACE}",target=/code/kotekan -w /code/kotekan/tests/)
              docker run "${OPTS[@]}" "${IMG}" pytest -v -n auto --dist=loadfile --timeout="${PYTEST_TIMEOUT}" -x -m 'not serial'
              docker run "${OPTS[@]}" "${IMG}" pytest -v -x --timeout="${PYTEST_TIMEOUT}" -m serial
              # Run Boost tests
              OPTS=(--rm --mount type=bind,src="${WORKSPACE}",target=/code/kotekan -w /code/kotekan/build-2404/tests/)
              docker run "${OPTS[@]}" "${IMG}" /code/kotekan/tests/boost/run_boost_tests.sh -v -t "${PYTEST_TIMEOUT}" /code/kotekan/build-2404/tests/boost

          - id: opencl
            name: "OpenCL build"
            runner: ubuntu-latest
            container_image: ""
            container_options: ""
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON -DUSE_HIP=OFF -DUSE_OPENCL=ON
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=ON -DUSE_DPDK=ON
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: ""   # Any OpenCL-specific commands to test?

          - id: clang
            name: "clang build"
            runner: self-hosted
            container_image: summerwind/actions-runner:ubuntu-22.04
            container_options: --user root
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DUSE_OMP=ON -DUSE_NUMA=OFF -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON -DUSE_HIP=OFF -DUSE_OPENCL=ON
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=ON
              -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=ON
            post_build: ""   # Any clang-specific tests to run?

          - id: direct-base
            name: "Direct-run config tests"
            runner: self-hosted
            container_image: summerwind/actions-runner:ubuntu-22.04
            container_options: --user root
            cmake_defs: &runner_build_default_opts >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON -DUSE_HIP=OFF -DUSE_OPENCL=ON
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=ON -DUSE_DPDK=ON
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: "" # Proto-entry for use later

          - id: direct-send_recv_asdfwrite
            name: "Direct-run send_recv_asdfwrite test"
            runner: self-hosted
            container_image: summerwind/actions-runner:ubuntu-22.04
            container_options: --user root
            cmake_defs: *runner_build_default_opts
            post_build: |
              set -euo pipefail
              # Run Kotekan directly in the built tree inside the container
              timeout 2m docker run --rm --privileged \
                --mount type=bind,src="${WORKSPACE}",target=/code/kotekan \
                -w /code/kotekan \
                ${{ needs.build-docker-2404.outputs.docker_img_name }} ./build-2404/kotekan/kotekan --bind-address 0:23000 --config ./config/ci-tests/send_recv_asdfwrite.yaml

    env:
      REGISTRY: ghcr.io
      PYTEST_TIMEOUT: ${{ vars.PYTEST_TIMEOUT || '600' }}
      WORKSPACE: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@v4

    - name: Login to GHCR
      if: ${{ !env.ACT }}
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-${{ matrix.id }}-2404-${{ github.sha }}
        restore-keys: |
          ccache-${{ matrix.id }}-2404

    - name: Configure & Build
      shell: bash
      run: |
        set -euo pipefail
        IMG="${{ needs.build-docker-2404.outputs.docker_img_name }}"
        OPTS=(--rm --mount type=bind,src="${WORKSPACE}",target=/code/kotekan -w /code/kotekan/build-2404/)

        docker run "${OPTS[@]}" "${IMG}" ccache -s
        docker run "${OPTS[@]}" "${IMG}" cmake -Wdev -Werror=dev -Wdeprecated -Werror=deprecated ${{ matrix.cmake_defs }} ..
        docker run "${OPTS[@]}" "${IMG}" bash -lc 'make -j $(nproc)'
        docker run "${OPTS[@]}" "${IMG}" ccache -s
        df -h

    - name: Post-build commands (optional)
      if: ${{ matrix.post_build != '' }}
      shell: bash
      env:
        IMG: ${{ needs.build-docker-2404.outputs.docker_img_name }}
      run: |
        set -euo pipefail
        # The block below comes from matrix.post_build
        ${{ matrix.post_build }}


  test-in-container:
    runs-on: ubuntu-latest
    needs: build-docker-2404
    container:
      image: ${{ needs.build-docker-2404.outputs.docker_img_name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-test-2404-${{ github.sha }}
          restore-keys: |
            ccache-test-2404

      - name: Run commands in repo
        run: |
          pwd
          ls -la
          env
