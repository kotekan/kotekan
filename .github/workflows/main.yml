# NOTE:
# When we build kotekan on the Github VM we need to take into account a few
# limitations: first we can't lock very much memory so we need to disable
# mlock the buffers. Second, the VMs run across a range of CPU
# architectures (from Haswell to Skylake-AVX512 as of 2020/03). Because our
# use of ccache shares compiled objects we must target our build for the
# lowest architecture available or we will occasionally crash with SIGILL
# when a newer instruction is called than is available.  


name: kotekan-ci-tests
on:
  pull_request:
    branches:
    - chord
    - develop
    - master
  push:
    branches:
    - chord
    - develop
    - master

env:
  REGISTRY: ghcr.io
  IMG_IWYU: "ghcr.io/kotekan/kotekan/kotekan-iwyu"
  IMG_2404: "ghcr.io/${{ github.repository }}/kotekan-2404"
  PYTEST_TIMEOUT: 90

jobs:

  # 2404 Tests

  # Ubuntu 24.04 docker image build and push
  build-docker-2404:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check for file changes
      uses: tj-actions/changed-files@v44
      id: changed-files

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Rebuild (or build) for a push/pr from a local branch (separate workflow for PR merges)
    - name: Check to see if a docker rebuild is needed
      id: docker_img
      run: |
        echo "docker_build=" >> $GITHUB_OUTPUT; # Default to no rebuild

        if [[ ${{ contains(steps.changed-files.outputs.all_modified_files, 'tools/docker/24.04/Dockerfile') }} == "true" || ${DOCKER_BUILD} ]] ; then
          echo "Modified Dockerfile found (or re-build requested). Building on local branch."
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_REF_NAME} | tr / .)"
          else
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_HEAD_REF} | tr / .)"
          fi
          echo "docker_build=1" >> $GITHUB_OUTPUT;
        else
          if [[ "${GITHUB_EVENT_NAME}" = "pull_request" || "${GITHUB_EVENT_NAME}" = "pull_request_target" ]]; then
            echo "Dockerfile was not modified. Using image from branch ${GITHUB_BASE_REF}."
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_BASE_REF} | tr / .)"
          else
            # This can happen when we're merging a chord branch back to chord, eg
            echo "Dockerfile was not modified. Using image from branch ${GITHUB_REF_NAME}."
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_REF_NAME} | tr / .)"
          fi
        fi

        if docker manifest inspect ${IMAGE_NAME} >/dev/null; then
          echo "Docker package found."
        else
          echo "Docker package NOT found. Setting docker_build=1."
          echo "docker_build=1" >> $GITHUB_OUTPUT;
        fi

        echo "img_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT;
        echo "Image name: ${IMAGE_NAME}"

    - name: Output environment variable details
      run: |
        echo "The job_id is: $GITHUB_JOB"
        echo "The id of this action is: $GITHUB_ACTION"
        echo "The run id is: $GITHUB_RUN_ID"
        echo "The repository is: $GITHUB_REPOSITORY"
        echo "The GitHub Actor's username is: $GITHUB_ACTOR"
        echo "GitHub SHA: $GITHUB_SHA"
        echo "GitHub event name: $GITHUB_EVENT_NAME"
        echo "GitHub Ref: $GITHUB_REF"
        echo "GitHub Head Ref: $GITHUB_HEAD_REF"
        echo "GitHub Base Ref: $GITHUB_BASE_REF"
        echo "GitHub Ref Name: $GITHUB_REF_NAME"
        echo "Docker 2404 image: $IMG_2404"
        echo "Docker IWYU image: $IMG_IWYU"
        echo "Used docker image name: ${{ steps.docker_img.outputs.img_name }}"
        echo "docker_build: ${{ steps.docker_img.outputs.docker_build }}"
        echo "img_name: ${{ steps.docker_img.outputs.img_name }}"

    - name: Build and Push Docker Image
      if: steps.docker_img.outputs.docker_build
      run: |
        echo "Building and pushing ${{ steps.docker_img.outputs.img_name }}"
        docker build --cache-from=${IMG_2404} -t "${{ steps.docker_img.outputs.img_name }}" - < tools/docker/24.04/Dockerfile
        docker push "${{ steps.docker_img.outputs.img_name }}"

    outputs:
      docker_img_name: "${{ steps.docker_img.outputs.img_name }}"

  # Build a basic version of kotekan
  build-base-2404:
    runs-on: ubuntu-latest
    needs: build-docker-2404

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache ccache files
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-base-build-2404-${{ github.sha }}
        restore-keys: |
          ccache-base-build-2404
          ccache-full-build-2404

    - name: Build kotekan
      run: |
        OPTS=(--rm --mount type=bind,src=$(pwd),target=/code/kotekan -w /code/kotekan/build-2404/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" ccache -s
        docker run "${OPTS[@]}" \
          cmake -Wdev -Werror=dev -Wdeprecated -Werror=deprecated \
            -DWERROR=ON \
            -DCMAKE_LINK_WHAT_YOU_USE=ON \
            -DCMAKE_BUILD_TYPE=Test \
            -DCCACHE=ON \
            -DUSE_OMP=ON \
            -DWITH_TESTS=ON \
            ..
        docker run "${OPTS[@]}" make -j 2
        docker run "${OPTS[@]}" ccache -s

  # Build a full version of kotekan and run the unit tests
  build-full-tests-2404:
    runs-on: ubuntu-latest
    needs: build-docker-2404

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache ccache files
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-full-build-2404-${{ github.sha }}
        restore-keys: |
          ccache-full-build-2404
          ccache-base-build-2404

    - name: Build kotekan
      run: |
        OPTS=(--rm --mount type=bind,src=$(pwd),target=/code/kotekan -w /code/kotekan/build-2404/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" ccache -s
        docker run "${OPTS[@]}" \
          cmake -Wdev -Werror=dev -Wdeprecated -Werror=deprecated \
            -DWERROR=ON \
            -DCMAKE_LINK_WHAT_YOU_USE=ON \
            -DCMAKE_BUILD_TYPE=Test \
            -DNO_MEMLOCK=ON \
            -DUSE_OMP=ON \
            -DWITH_BOOST_TESTS=ON \
            -DCCACHE=ON ..
        docker run "${OPTS[@]}" make -j 2
        docker run "${OPTS[@]}" rm -r lib
        docker run "${OPTS[@]}" ccache -s
        df -h

    - name: Run parallel python tests
      run: |
        OPTS=(--rm --mount type=bind,src=$(pwd),target=/code/kotekan -w /code/kotekan/tests/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" pytest -v -n auto --dist=loadfile --timeout=${PYTEST_TIMEOUT} -x -m 'not serial'

    - name: Run serial python tests
      run: |
        OPTS=(--rm --mount type=bind,src=$(pwd),target=/code/kotekan -w /code/kotekan/tests/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" pytest -v -x --timeout=${PYTEST_TIMEOUT} -m serial

    - name: Run boost tests
      run: |
        OPTS=(--rm --mount type=bind,src=$(pwd),target=/code/kotekan -w /code/kotekan/build-2404/tests/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" pytest -v -x --timeout=${PYTEST_TIMEOUT}

  # Build an OpenCL version of kotekan and run the unit tests
  build-opencl-2404:
    runs-on: self-hosted
    container: 
      image: summerwind/actions-runner:ubuntu-22.04
      options: --user root
    needs: build-docker-2404

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache ccache files
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-opencl-2404-${{ github.sha }}
        restore-keys: |
          ccache-opencl-2404
          ccache-base-build-2404

    - name: Build kotekan
      shell: bash
      run: |
        OPTS=(--pull=always --rm --mount type=bind,src=/home/lwlab/kotekan-runner/_work/kotekan/kotekan/,target=/code/kotekan -w /code/kotekan/build-2404/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" ccache -s
        docker run "${OPTS[@]}" \
          cmake -Wdev -Werror=dev -Wdeprecated -Werror=deprecated \
            -DWERROR=ON \
            -DCMAKE_BUILD_TYPE=Test \
            -DNO_MEMLOCK=ON \
            -DUSE_OMP=ON \
            -DWITH_BOOST_TESTS=ON \
            -DUSE_CUDA=OFF \
            -DUSE_OPENCL=ON \
            -DCCACHE=ON ..
        docker run "${OPTS[@]}" make -j 8
        docker run "${OPTS[@]}" rm -r lib
        docker run "${OPTS[@]}" ccache -s
        df -h

    - name: Run parallel python tests
      shell: bash
      run: |
        OPTS=(--rm --mount type=bind,src=/home/lwlab/kotekan-runner/_work/kotekan/kotekan/,target=/code/kotekan -w /code/kotekan/tests/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" pytest -v -n auto --dist=loadfile --timeout=${PYTEST_TIMEOUT} -x -m 'not serial'

    - name: Run serial python tests
      shell: bash
      run: |
        OPTS=(--rm --mount type=bind,src=/home/lwlab/kotekan-runner/_work/kotekan/kotekan/,target=/code/kotekan -w /code/kotekan/tests/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" pytest -v -x --timeout=${PYTEST_TIMEOUT} -m serial

    - name: Run boost tests
      shell: bash
      run: |
        OPTS=(--rm --mount type=bind,src=/home/lwlab/kotekan-runner/_work/kotekan/kotekan/,target=/code/kotekan -w /code/kotekan/build-2404/tests/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" pytest -v -x --timeout=${PYTEST_TIMEOUT}

    - name: Clean up
      run: |
        rm -rf kotekan


  # Build a version of kotekan and run some direct tests
  build-direct-tests-2404:
    runs-on: self-hosted
    container: 
      image: summerwind/actions-runner:ubuntu-22.04
      options: --user root
    needs: build-docker-2404

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache ccache files
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-direct-2404-${{ github.sha }}
        restore-keys: |
          ccache-direct-2404
          ccache-base-build-2404

    - name: Build kotekan
      shell: bash
      run: |
        OPTS=(--pull=always --privileged --rm --mount type=bind,src=/home/lwlab/kotekan-runner/_work/kotekan/kotekan/,target=/code/kotekan -w /code/kotekan/build-2404/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" ccache -s
        docker run "${OPTS[@]}" \
          cmake -Wdev -Werror=dev -Wdeprecated -Werror=deprecated \
            -DWERROR=ON \
            -DCMAKE_BUILD_TYPE=Test \
            -DNO_MEMLOCK=ON \
            -DUSE_OMP=ON \
            -DUSE_CUDA=ON \
            -DCCACHE=ON ..
        docker run "${OPTS[@]}" make -j
        docker run "${OPTS[@]}" rm -r lib
        docker run "${OPTS[@]}" ccache -s
        df -h

    # Run tests in the config/ci-tests directory with timeout
    - name: Run direct Kotekan tests
      run: |
        TIMEOUT_DURATION="2m"  # Timeout duration per test
        TEST_CONFIG_DIR="config/ci-tests"
        for config_file in "$TEST_CONFIG_DIR"/*.yaml; do
          echo "Running test with config: $config_file"
          
          # Run the test with timeout
          timeout "$TIMEOUT_DURATION" docker run --rm --privileged \
            --mount type=bind,src=/home/lwlab/kotekan-runner/_work/kotekan/kotekan/,target=/code/kotekan \
            -w /code/kotekan \
            ${{ needs.build-docker-2404.outputs.docker_img_name }} \
            ./build-2404/kotekan/kotekan --bind-address 0:23000 --config "$config_file"

          EXIT_CODE=$?

          if [ $EXIT_CODE -eq 124 ]; then
            echo "Test timed out for config: $config_file"
            exit 1
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "Test failed for config: $config_file with exit code $EXIT_CODE"
            exit 1
          else
            echo "Test passed for config: $config_file"
          fi
        done

    - name: Clean up
      run: |
        rm -rf kotekan

  # Build kotekan documentation
  build-docs:
    runs-on: ubuntu-latest
    needs: build-docker-2404

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build kotekan docs
      run: |
        OPTS=(--rm --mount type=bind,src=$(pwd),target=/code/kotekan -w /code/kotekan/build-docs/ "${{ needs.build-docker-2404.outputs.docker_img_name }}")
        docker run "${OPTS[@]}" \
          cmake \
            -Wdev -Werror=dev -Wdeprecated -Werror=deprecated \
            -DWERROR=ON \
            -DCOMPILE_DOCS=ON \
            ..
        docker run "${OPTS[@]}" make doc
        docker run "${OPTS[@]}" make sphinx

  # Linting
  lint:
    runs-on: ubuntu-latest
    needs: build-docker-2404

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Run lint.sh
      shell: bash
      run: |
        set -e
        docker run --rm --mount type=bind,src=$(pwd),target=/code/kotekan -w /code/kotekan ${{ needs.build-docker-2404.outputs.docker_img_name }} /code/kotekan/tools/lint.sh -d /code/kotekan

  # Build a clang version of kotekan
  # Note that this build isn't working at the moment, so for now only run it upon request.
  build-clang-2404:
    runs-on: ubuntu-latest
    needs: build-docker-2404

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache ccache files
      uses: actions/cache@v4
      with:
        path: .ccache
        key: ccache-clang-build-2404-${{ github.sha }}
        restore-keys: |
          ccache-clang-build-2404

    - name: Build kotekan
      env:
        CC: clang
        CXX: clang++
      if: env.RUN_2404_CLANG_TESTS
      run: |
        OPTS=(--rm --mount type=bind,src=$(pwd),target=/code/kotekan -w /code/kotekan/build-2404/ ${{ needs.build-docker-2404.outputs.docker_img_name }})
        docker run "${OPTS[@]}" ccache -s
        docker run "${OPTS[@]}" cmake -Wdev -Werror=dev -Wdeprecated -Werror=deprecated \
        -DWERROR=ON \
        -DCMAKE_LINK_WHAT_YOU_USE=ON \
        -DUSE_OLD_DPDK=ON \
        -DCMAKE_BUILD_TYPE=Test \
        -DARCH=haswell \
        -DNO_MEMLOCK=ON \
        -DUSE_OMP=ON \
        -DWITH_TESTS=ON \
        -DCCACHE=ON ..
        docker run "${OPTS[@]}" make -j 2
        docker run "${OPTS[@]}" ccache -s
