name: kotekan-ci-tests
on:
  pull_request:
    branches:
    - chord
    - develop
  push:
    branches:
    - chord
    - develop

env:
  REGISTRY: ghcr.io
  IMG_2404: "ghcr.io/${{ github.repository }}/kotekan-2404"

jobs:

  # Kotekan docker image build and push
  build-docker-2404:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - uses: actions/checkout@v4

    - name: Check for file changes
      uses: tj-actions/changed-files@v44
      id: changed-files

    - name: Login to GitHub Container Registry
      if: ${{ !env.ACT }} # Don't log in if running locally
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Rebuild (or build) for a push/pr from a local branch (separate workflow for PR merges)
    - name: Check to see if a docker rebuild is needed
      id: docker_img
      run: |
        echo "docker_build=" >> $GITHUB_OUTPUT; # Default to no rebuild

        if [[ ${{ contains(steps.changed-files.outputs.all_modified_files, 'tools/docker/24.04/Dockerfile') }} == "true" || ${DOCKER_BUILD} ]] ; then
          echo "Modified Dockerfile found (or re-build requested). Building on local branch."
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_REF_NAME} | tr / .)"
          else
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_HEAD_REF} | tr / .)"
          fi
          echo "docker_build=1" >> $GITHUB_OUTPUT;
        else
          if [[ "${GITHUB_EVENT_NAME}" = "pull_request" || "${GITHUB_EVENT_NAME}" = "pull_request_target" ]]; then
            echo "Dockerfile was not modified. Using image from branch ${GITHUB_BASE_REF}."
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_BASE_REF} | tr / .)"
          else
            # This can happen when we're merging a chord branch back to chord, eg
            echo "Dockerfile was not modified. Using image from branch ${GITHUB_REF_NAME}."
            IMAGE_NAME="${IMG_2404}:$(echo ${GITHUB_REF_NAME} | tr / .)"
          fi
        fi

        if docker manifest inspect ${IMAGE_NAME} >/dev/null; then
          echo "Docker package found."
        else
          echo "Docker package NOT found. Setting docker_build=1."
          echo "docker_build=1" >> $GITHUB_OUTPUT;
        fi

        echo "img_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT;
        echo "Image name: ${IMAGE_NAME}"

    - name: Output environment variable details
      run: |
        echo "The job_id is: $GITHUB_JOB"
        echo "The id of this action is: $GITHUB_ACTION"
        echo "The run id is: $GITHUB_RUN_ID"
        echo "The repository is: $GITHUB_REPOSITORY"
        echo "The GitHub Actor's username is: $GITHUB_ACTOR"
        echo "GitHub SHA: $GITHUB_SHA"
        echo "GitHub event name: $GITHUB_EVENT_NAME"
        echo "GitHub Ref: $GITHUB_REF"
        echo "GitHub Head Ref: $GITHUB_HEAD_REF"
        echo "GitHub Base Ref: $GITHUB_BASE_REF"
        echo "GitHub Ref Name: $GITHUB_REF_NAME"
        echo "Docker 2404 image: $IMG_2404"
        echo "Used docker image name: ${{ steps.docker_img.outputs.img_name }}"
        echo "docker_build: ${{ steps.docker_img.outputs.docker_build }}"
        echo "img_name: ${{ steps.docker_img.outputs.img_name }}"

    - name: Build and Push Docker Image (outside of act)
      if: ${{ steps.docker_img.outputs.docker_build && !env.ACT }} # Push if not running locally
      run: |
        echo "Building and pushing ${{ steps.docker_img.outputs.img_name }}"
        docker build --cache-from=${IMG_2404} -t "${{ steps.docker_img.outputs.img_name }}" - < tools/docker/24.04/Dockerfile
        docker push "${{ steps.docker_img.outputs.img_name }}"

    - name: Build Docker Image (locally, in act)
      if: ${{ steps.docker_img.outputs.docker_build && env.ACT }} # Don't push if running locally
      run: |
        echo "Building ${{ steps.docker_img.outputs.img_name }} (local only, no push)"
        docker build --cache-from=${IMG_2404} -t "${{ steps.docker_img.outputs.img_name }}" - < tools/docker/24.04/Dockerfile

    outputs:
      docker_img_name: "${{ steps.docker_img.outputs.img_name }}"


  github-kotekan-tests:
    name: "Github"
    runs-on: ubuntu-latest
    needs: build-docker-2404
    container:
      image: ${{ needs.build-docker-2404.outputs.docker_img_name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: true
      CCACHE_TEMPDIR: /tmp/.ccache

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: base
            name: "Base build (no extras)"
            ccache_key: kotekan-base
            cmake_defs: &base_build_cmake_opts >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=OFF -DNO_MEMLOCK=OFF
              -DUSE_CUDA=OFF -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=OFF -DUSE_HDF5=OFF -DUSE_GDAL=OFF
              -DUSE_AIRSPY=OFF -DUSE_LAPACK_BLAZE=OFF -DUSE_FFTW=OFF -DUSE_JULIA=OFF -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: ""   # nothing to run

          - id: full
            name: "Full build + pytests tests"
            ccache_key: kotekan-full-pytest
            cmake_defs: &full_build_cmake_opts >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON -DUSE_HIP=OFF -DUSE_OPENCL=OFF
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=ON -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=ON
            post_build: |
              # Run pytest tests
              PYTHONPATH=$GITHUB_WORKSPACE/python
              PYTEST_TIMEOUT=120
              cd $GITHUB_WORKSPACE/tests
              pytest -v -n auto --dist=loadfile --timeout="${PYTEST_TIMEOUT}" -x -m 'not serial'
              pytest -v -x --timeout="${PYTEST_TIMEOUT}" -m serial

          - id: boost
            name: "Full build + boost tests"
            ccache_key: kotekan-full-boost
            runner: ubuntu-latest
            container_image: ""
            container_options: ""
            cmake_defs: *full_build_cmake_opts
            post_build: |
              TEST_TIMEOUT=30
              bash $GITHUB_WORKSPACE/tests/boost/run_boost_tests.sh -v -t "${TEST_TIMEOUT}" $GITHUB_WORKSPACE/build-2404/tests/boost

          - id: opencl
            name: "OpenCL build"
            ccache_key: kotekan-opencl
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON -DUSE_HIP=OFF -DUSE_OPENCL=ON
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=ON -DUSE_DPDK=ON
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: ""   # Any OpenCL-specific commands to test?
          
          - id: release_pytest_gcc
            name: "Release build + pytest"
            ccache_key: kotekan-release-gcc
            cmake_defs: &build_release_gcc_opts >-
              -DCMAKE_BUILD_TYPE=Release
              -DWERROR=ON
              -DCCACHE=ON
              -DUSE_OMP=ON
              -DUSE_NUMA=ON
              -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON
              -DUSE_HIP=OFF
              -DUSE_OPENCL=ON
              -DUSE_ASDF=ON
              -DUSE_HDF5=ON
              -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON
              -DUSE_LAPACK_BLAZE=ON
              -DUSE_FFTW=ON
              -DUSE_JULIA=ON
              -DUSE_DPDK=ON
              -DWITH_TESTS=ON
              -DWITH_BOOST_TESTS=OFF
            post_build: |
              # Run pytest tests
              PYTHONPATH=$GITHUB_WORKSPACE/python
              PYTEST_TIMEOUT=120
              cd $GITHUB_WORKSPACE/tests
              pytest -v -n auto --dist=loadfile --timeout="${PYTEST_TIMEOUT}" -x -m 'not serial'
              pytest -v -x --timeout="${PYTEST_TIMEOUT}" -m serial

          - id: clang
            name: "clang build"
            ccache_key: kotekan-clang
            cmake_defs: >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
              -DUSE_OMP=ON -DUSE_NUMA=OFF -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON -DUSE_HIP=OFF -DUSE_OPENCL=ON
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=ON
              -DUSE_DPDK=OFF
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=ON
            post_build: ""   # Any clang-specific tests to run?

          - id: docs
            name: "Build Documentation"
            ccache_key: kotekan-docs
            cmake_defs: >-
              -DCOMPILE_DOCS=ON
            post_build: |
              cd $GITHUB_WORKSPACE/build-2404 && make docs

          - id: lint
            name: "Run Linter"
            cmake_defs: ""
            post_build: |
              cd $GITHUB_WORKSPACE
              git config --global --add safe.directory $GITHUB_WORKSPACE
              bash ./tools/lint.sh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.ccache_key }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.ccache_key }}-

      - name: Print working environment details
        run: |
          echo "==========="
          pwd
          echo "==========="
          ls -la
          echo "==========="
          env
          echo "==========="
          df -h
          echo "==========="
          free -h
          echo "==========="
          lscpu

      - name: Configure & Build kotekan
        if: matrix.cmake_defs
        run: |
          set -euo pipefail
          mkdir $GITHUB_WORKSPACE/build-2404 && cd $GITHUB_WORKSPACE/build-2404
          ccache -s
          cmake -DCMAKE_SYSTEM_PROCESSOR=x86_64 -DCMAKE_HOST_SYSTEM_PROCESSOR=x86_64 -Wdev -Werror=dev -Wdeprecated -Werror=deprecated ${{ matrix.cmake_defs }} ..
          make -j $(nproc)
          ccache -s

      - name: Post-build commands
        if: matrix.post_build
        shell: bash
        run: |
          set -euo pipefail
          # Run any commands specified ...
          ${{ matrix.post_build }}


  selfhosted-kotekan-tests:
    name: "Self-Hosted"
    runs-on: self-hosted
    needs: build-docker-2404
    container:
      image: ${{ needs.build-docker-2404.outputs.docker_img_name }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: >-
        --privileged
        --mount type=bind,source=/data,target=/data
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: true
      CCACHE_TEMPDIR: /tmp/.ccache

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: base
            name: "Build kotekan"
            ccache_key: selfhosted-kotekan-default
            cmake_defs: &runner_build_default_opts >-
              -DCMAKE_BUILD_TYPE=Test -DWERROR=ON
              -DCMAKE_LINK_WHAT_YOU_USE=ON -DCCACHE=ON
              -DUSE_OMP=ON -DUSE_NUMA=ON -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON -DUSE_HIP=OFF -DUSE_OPENCL=ON
              -DUSE_ASDF=ON -DUSE_HDF5=ON -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON -DUSE_LAPACK_BLAZE=ON -DUSE_FFTW=ON -DUSE_JULIA=ON -DUSE_DPDK=ON
              -DWITH_TESTS=ON -DWITH_BOOST_TESTS=OFF
            post_build: "" # Proto-entry for use later

          - id: ci_yaml_tests
            name: "run yamls in config/ci-tests"
            ccache_key: selfhosted-kotekan-default # Re-use ccache key from above
            cmake_defs: *runner_build_default_opts # Re-use build opts from above
            post_build: |
              bash $GITHUB_WORKSPACE/config/ci-tests/run_tests.sh $GITHUB_WORKSPACE/build-2404/kotekan/kotekan 2m $GITHUB_WORKSPACE/config/ci-tests

          - id: release_gcc
            name: "Build release kotekan"
            ccache_key: selfhosted-kotekan-release-gcc
            cmake_defs: &runner_build_release_gcc_opts >-
              -DCMAKE_BUILD_TYPE=Release
              -DWERROR=ON
              -DCCACHE=ON
              -DUSE_OMP=ON
              -DUSE_NUMA=ON
              -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON
              -DUSE_HIP=OFF
              -DUSE_OPENCL=ON
              -DUSE_ASDF=ON
              -DUSE_HDF5=ON
              -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON
              -DUSE_LAPACK_BLAZE=ON
              -DUSE_FFTW=ON
              -DUSE_JULIA=ON
              -DUSE_DPDK=ON
              -DWITH_TESTS=ON
              -DWITH_BOOST_TESTS=OFF
            post_build: ""
          
          - id: release_gcc_yaml_tests
            name: "Build release kotekan"
            ccache_key: selfhosted-kotekan-release-gcc  # re-using key from build
            cmake_defs: *runner_build_release_gcc_opts      # re-using build opts from build
            post_build: |
              bash $GITHUB_WORKSPACE/config/ci-tests/run_tests.sh $GITHUB_WORKSPACE/build-2404/kotekan/kotekan 2m $GITHUB_WORKSPACE/config/ci-tests
          
          - id: release_clang
            name: "Release build with clang"
            ccache_key: selfhosted-kotekan-release-clang
            cmake_defs: &runner_build_release_clang_opts >-
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_C_COMPILER=clang
              -DCMAKE_CXX_COMPILER=clang++
              -DWERROR=ON
              -DCCACHE=ON
              -DUSE_OMP=ON
              -DUSE_NUMA=ON
              -DNO_MEMLOCK=ON
              -DUSE_CUDA=ON
              -DUSE_HIP=OFF
              -DUSE_OPENCL=ON
              -DUSE_ASDF=ON
              -DUSE_HDF5=ON
              -DUSE_GDAL=ON
              -DUSE_AIRSPY=ON
              -DUSE_LAPACK_BLAZE=ON
              -DUSE_FFTW=ON
              -DUSE_JULIA=ON
              -DUSE_DPDK=ON
              -DWITH_TESTS=ON
              -DWITH_BOOST_TESTS=OFF
            post_build: ""  # clang tests?

          - id: data_test
            name: "/data dir test"
            cmake_defs: ""
            post_build: |
              # Try something with /data.
              touch /data/tmp
              ls /data
              rm /data/tmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.ccache_key }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.ccache_key }}-

      - name: Print working environment details
        run: |
          echo "==========="
          pwd
          echo "==========="
          ls -la
          echo "==========="
          env
          echo "==========="
          df -h
          echo "==========="
          free -h
          echo "==========="
          lscpu
          echo "==========="
          nvidia-smi

      - name: Configure & Build kotekan
        if: matrix.cmake_defs
        run: |
          set -euo pipefail
          mkdir $GITHUB_WORKSPACE/build-2404 && cd $GITHUB_WORKSPACE/build-2404
          ccache -s
          cmake -DCMAKE_SYSTEM_PROCESSOR=x86_64 -DCMAKE_HOST_SYSTEM_PROCESSOR=x86_64 -Wdev -Werror=dev -Wdeprecated -Werror=deprecated ${{ matrix.cmake_defs }} ..
          make -j $(nproc)
          ccache -s

      - name: Post-build commands
        if: matrix.post_build
        shell: bash
        run: |
          set -euo pipefail
          # Run any commands specified ...
          ${{ matrix.post_build }}
