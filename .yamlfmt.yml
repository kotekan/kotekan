---
# Use doublestar glob matching so include/exclude can address nested paths.
# Invoke yamlfmt without a path argument so it walks the `include` patterns
# instead of crawling the current directory and ignoring them.
doublestar: true

include:
    - "**/*.yml"
    - "**/*.yaml"

exclude:
    - "build/**"
    - "build-*/**"
    - "external/**"
    - ".venv/**"
    - "scratch/**"
    - "julia/**"
    - "lib/cuda/generated/**"

formatter:
    type: basic
    indent: 4
    retain_line_breaks: true
    retain_line_breaks_single: true
    scan_folded_as_literal: true
    include_document_start: true
    pad_line_comments: 1
